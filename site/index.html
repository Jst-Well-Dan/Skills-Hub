<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="浏览、筛选并直达优质 Agent Skills 的开源目录。">
  <title>Skills-Hub - Agent Skills 目录</title>
  <style>
    @font-face {
      font-family: "TsangerJinKai02";
      src: url("assets/fonts/TsangerJinKai02-W04.ttf") format("truetype");
      font-weight: 400 500;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "JetBrains Mono";
      src: url("assets/fonts/JetBrainsMono.woff2") format("woff2");
      font-weight: 400 500;
      font-style: normal;
      font-display: swap;
    }
    :root {
      color-scheme: light dark;
      --bg: #f6f8fa;
      --bg-deep: #eaeef2;
      --ivory: #ffffff;
      --panel: #ffffff;
      --panel-muted: #f6f8fa;
      --panel-lift: #f3f4f6;
      --text: #1f2328;
      --body-text: #3b434b;
      --muted: #59636e;
      --faint: #6e7781;
      --stone: #59636e;
      --line: #d0d7de;
      --line-strong: #8c959f;
      --accent: #0969da;
      --accent-strong: #0550ae;
      --accent-soft: #ddf4ff;
      --accent-text: #ffffff;
      --shadow: 0 3px 12px rgba(140, 149, 159, .14);
      --ease: cubic-bezier(.16, 1, .3, 1);
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      --mono: "JetBrains Mono", "SF Mono", Consolas, Monaco, monospace;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --bg-deep: #21262d;
        --ivory: #161b22;
        --panel: #161b22;
        --panel-muted: #0d1117;
        --panel-lift: #21262d;
        --text: #f0f6fc;
        --body-text: #c9d1d9;
        --muted: #9da7b1;
        --faint: #8b949e;
        --stone: #9da7b1;
        --line: #30363d;
        --line-strong: #6e7681;
        --accent: #58a6ff;
        --accent-strong: #79c0ff;
        --accent-soft: #0c2d4a;
        --accent-text: #0d1117;
        --shadow: 0 3px 12px rgba(1, 4, 9, .32);
      }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      background: var(--bg);
      color: var(--body-text);
      font-family: var(--sans);
      font-size: 14px;
      line-height: 1.55;
      letter-spacing: 0;
    }
    a { color: inherit; text-decoration: none; }
    button, input, select { font: inherit; }
    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--ivory) 94%, transparent);
      backdrop-filter: blur(16px);
    }
    .topbar-inner {
      max-width: 1240px;
      margin: 0 auto;
      padding: 12px 24px;
      display: grid;
      grid-template-columns: 220px minmax(280px, 1fr) auto;
      gap: 20px;
      align-items: center;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .mark {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: var(--accent-text);
      font-weight: 800;
      letter-spacing: 0;
      box-shadow: none;
    }
    .brand-title {
      margin: 0;
      color: var(--text);
      font-size: 17px;
      line-height: 1.1;
      font-weight: 720;
    }
    .brand-meta {
      margin-top: 2px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .search-box {
      position: relative;
      min-width: 0;
    }
    .search-box input {
      width: 100%;
      height: 42px;
      padding: 0 44px 0 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      outline: none;
    }
    .search-box input::placeholder { color: var(--muted); }
    .search-box input:focus {
      border-color: var(--line-strong);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
    }
    .search-icon, .clear-search {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
    }
    .search-icon { left: 14px; }
    .clear-search {
      right: 8px;
      width: 30px;
      height: 30px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      cursor: pointer;
    }
    .clear-search:hover { background: var(--panel-lift); color: var(--accent); }
    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .nav-link {
      min-height: 38px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--panel);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      transition: border-color .18s var(--ease), background .18s var(--ease);
    }
    .nav-link:hover { border-color: var(--line-strong); background: var(--panel-lift); }
    button.nav-link { cursor: pointer; }
    .icon-button {
      width: 38px;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: var(--panel);
      color: var(--accent);
      cursor: pointer;
      transition: transform .18s var(--ease), border-color .18s var(--ease), background .18s var(--ease);
    }
    .icon-button:hover { border-color: var(--line-strong); background: var(--panel-lift); transform: translateY(-1px); }

    .layout {
      max-width: 1240px;
      margin: 0 auto;
      padding: 42px 24px 56px;
      display: grid;
      grid-template-columns: 208px minmax(0, 1fr);
      gap: 40px;
    }
    .sidebar {
      align-self: start;
      position: sticky;
      top: 88px;
      padding-right: 24px;
      border-right: 1px solid var(--line);
    }
    .filter-panel {
      min-width: 0;
    }
    .filter-head {
      padding: 0 10px 10px;
      display: flex;
      align-items: center;
    }
    .filter-title {
      margin: 0;
      font-size: 14px;
      color: var(--text);
      font-weight: 680;
    }
    .filter-list {
      display: grid;
      gap: 2px;
    }
    .facet {
      width: 100%;
      min-height: 38px;
      padding: 8px 10px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      text-align: left;
      cursor: pointer;
      color: var(--text);
      transition: background .16s var(--ease), color .16s var(--ease);
    }
    .facet:hover { background: var(--panel-lift); }
    .facet.active {
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 650;
    }
    .facet span:first-child {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .count {
      min-width: 24px;
      padding: 1px 5px;
      border-radius: 4px;
      background: var(--panel-lift);
      color: var(--muted);
      text-align: center;
      font-size: 12px;
    }
    .facet.active .count { background: var(--accent-soft); color: var(--accent); }

    .workspace {
      min-width: 0;
      display: grid;
      gap: 20px;
    }
    .catalog-intro {
      padding: 0 0 6px;
    }
    .catalog-title {
      margin: 0;
      color: var(--text);
      font-size: 32px;
      line-height: 1.15;
      letter-spacing: -.025em;
      text-wrap: balance;
    }
    .catalog-copy {
      margin: 8px 0 0;
      max-width: 65ch;
      color: var(--muted);
      font-size: 14px;
      text-wrap: pretty;
    }
    .toolbar {
      padding: 0 0 14px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .toolbar-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .segmented {
      display: inline-grid;
      grid-auto-flow: column;
      gap: 3px;
      padding: 3px;
      border-radius: 9px;
      background: var(--bg-deep);
      border: 0;
    }
    .segment {
      min-width: 58px;
      height: 32px;
      padding: 0 12px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }
    .segment.active {
      background: var(--panel);
      color: var(--text);
      box-shadow: 0 1px 3px rgba(31, 35, 40, .12);
      font-weight: 650;
    }
    .sort-select {
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--panel);
      color: var(--text);
      padding: 0 10px;
    }
    .result-meta {
      color: var(--text);
      font-size: 14px;
      font-weight: 650;
    }
    .project-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }
    .project-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    .project-card {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
      min-width: 0;
      overflow: hidden;
      transition: transform .18s var(--ease), border-color .18s var(--ease), box-shadow .18s var(--ease);
    }
    .project-card:hover {
      border-color: var(--line-strong);
      box-shadow: var(--shadow);
    }
    .project-main {
      width: 100%;
      border: 0;
      background: transparent;
      color: inherit;
      padding: 20px 20px 14px;
      text-align: left;
      cursor: pointer;
      display: grid;
      gap: 10px;
    }
    .project-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: start;
    }
    .project-name {
      margin: 0;
      color: var(--text);
      font-size: 17px;
      line-height: 1.25;
      overflow-wrap: anywhere;
      text-wrap: balance;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 3px 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--muted);
      background: var(--panel-muted);
      font-size: 12px;
      white-space: nowrap;
    }
    .description {
      margin: 0;
      color: var(--muted);
      line-height: 1.65;
      font-size: 13px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .project-foot {
      padding: 0 20px 18px;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      color: var(--muted);
      font-size: 12px;
    }
    .card-category { white-space: nowrap; }
    .github-link, .primary-link {
      min-height: 34px;
      padding: 0;
      border: 0;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
      transition: background .18s var(--ease), transform .18s var(--ease);
    }
    .github-link:hover, .primary-link:hover { color: var(--accent-strong); text-decoration: underline; }
    .github-link:active, .primary-link:active { transform: translateY(1px); }
    .empty {
      border: 1px dashed var(--line-strong);
      border-radius: 6px;
      padding: 38px;
      text-align: center;
      color: var(--muted);
      background: var(--panel);
    }

    .drawer {
      position: fixed;
      inset: 0;
      z-index: 40;
      pointer-events: none;
    }
    .drawer.open { pointer-events: auto; }
    .drawer-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(20, 20, 19, .34);
      opacity: 0;
      transition: opacity .18s ease;
    }
    .drawer.open .drawer-backdrop { opacity: 1; }
    .drawer-panel {
      position: absolute;
      top: 0;
      right: 0;
      width: min(760px, 100vw);
      height: 100%;
      background: var(--bg);
      border-left: 1px solid var(--line-strong);
      transform: translateX(100%);
      transition: transform .2s ease;
      display: grid;
      grid-template-rows: auto 1fr;
    }
    .drawer.open .drawer-panel { transform: translateX(0); }
    .drawer-head {
      padding: 18px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: start;
    }
    .drawer-head-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .drawer-title {
      margin: 0;
      color: var(--text);
      font-size: 26px;
      line-height: 1.2;
      overflow-wrap: anywhere;
    }
    .drawer-body {
      overflow: auto;
      padding: 18px;
      display: grid;
      gap: 16px;
      align-content: start;
    }
    .detail-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .detail {
      border-bottom: 1px solid var(--line);
      padding: 10px 0;
      min-width: 0;
    }
    .detail-label {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 6px;
    }
    .detail-value {
      font-size: 13px;
      overflow-wrap: anywhere;
    }
    .section-title {
      margin: 0;
      font-size: 15px;
    }
    .skill-list {
      display: grid;
      gap: 8px;
    }
    .skill-item {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      display: grid;
      gap: 8px;
      background: var(--panel);
    }
    .skill-name {
      font-weight: 680;
      color: var(--text);
      overflow-wrap: anywhere;
    }
    .skill-description {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
      font-size: 13px;
    }
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .text-link {
      border: 0;
      padding: 0;
      background: transparent;
      color: var(--accent);
      font-size: 13px;
      font-weight: 650;
      cursor: pointer;
    }
    .text-link:hover { color: var(--accent-strong); text-decoration: underline; }
    .text-link:disabled { color: var(--muted); cursor: wait; text-decoration: none; }
    .skill-panel {
      margin-top: 4px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
      display: grid;
      gap: 12px;
    }
    .skill-panel[hidden] { display: none; }
    .translation-empty { margin: 0; color: var(--muted); font-size: 13px; }
    .skill-content {
      margin: 0;
      max-height: 520px;
      overflow: auto;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel-muted);
      color: var(--body-text);
      font: 14px/1.7 var(--sans);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .skill-content[data-language="original"] { font: 12px/1.65 var(--mono); }
    .related-reviews {
      padding-top: 12px;
      border-top: 1px solid var(--line);
      display: grid;
      gap: 2px;
    }
    .review-title { margin: 0 0 6px; color: var(--text); font-size: 15px; }
    .review-link {
      min-height: 44px;
      padding: 8px 0;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      border-bottom: 1px solid var(--line);
      color: var(--accent);
      font-weight: 650;
    }
    .review-link:last-child { border-bottom: 0; }
    .review-meta { color: var(--muted); font-size: 12px; font-weight: 400; white-space: nowrap; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .001ms !important;
      }
    }

    @media (max-width: 980px) {
      .topbar-inner {
        grid-template-columns: 1fr auto;
      }
      .search-box {
        grid-column: 1 / -1;
        order: 3;
      }
      .layout {
        display: flex;
        flex-direction: column;
        gap: 24px;
      }
      .workspace { display: contents; }
      .catalog-intro { order: 1; }
      .sidebar {
        order: 2;
        position: static;
        align-self: stretch;
        min-width: 0;
        padding-right: 0;
        border-right: 0;
      }
      .filter-panel { display: flex; align-items: center; gap: 10px; }
      .filter-head { padding: 0; flex: 0 0 auto; }
      .filter-list {
        display: flex;
        flex: 1;
        min-width: 0;
        gap: 4px;
        overflow-x: auto;
        scrollbar-width: thin;
        padding-bottom: 3px;
      }
      .facet { width: auto; flex: 0 0 auto; }
      .toolbar { order: 3; }
      .project-grid, .project-list { order: 4; grid-template-columns: 1fr; }
    }
    @media (max-width: 680px) {
      .topbar-inner, .layout {
        padding-left: 14px;
        padding-right: 14px;
      }
      .layout { padding-top: 28px; }
      .catalog-title { font-size: 28px; }
      .toolbar { align-items: stretch; }
      .toolbar-actions { width: 100%; justify-content: space-between; }
      .sort-select { width: auto; flex: 1; }
      .detail-grid { grid-template-columns: 1fr; }
      .project-main { padding: 17px 17px 12px; }
      .project-foot { padding: 0 17px 15px; }
      .nav-link { padding: 0 10px; }
      .nav-docs { display: none; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#" aria-label="Skills-Hub">
        <div class="mark">SH</div>
        <div>
          <h1 class="brand-title">Skills-Hub</h1>
          <div class="brand-meta" id="brandMeta">Agent Skills 目录</div>
        </div>
      </a>
      <div class="search-box">
        <span class="search-icon">⌕</span>
        <input id="searchInput" type="search" placeholder="搜索项目或 skill" autocomplete="off">
        <button class="clear-search" id="clearSearch" title="清空搜索" aria-label="清空搜索">×</button>
      </div>
      <div class="actions">
        <button class="nav-link" id="languageToggle" type="button" aria-label="Switch to English">EN</button>
        <a class="nav-link nav-docs" id="docsLink" href="https://github.com/Jst-Well-Dan/Skills-Hub/blob/main/docs/index.md">完整索引</a>
        <a class="nav-link" id="githubLink" href="https://github.com/Jst-Well-Dan/Skills-Hub" target="_blank" rel="noreferrer">项目 GitHub</a>
      </div>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar" id="sidebar" aria-label="分类筛选">
      <section class="filter-panel">
        <div class="filter-head"><h2 class="filter-title" id="filterTitle">分类</h2></div>
        <div class="filter-list" id="categoryFilters"></div>
      </section>
    </aside>

    <section class="workspace">
      <header class="catalog-intro">
        <h2 class="catalog-title" id="catalogTitle">找到合适的 Agent Skill</h2>
        <p class="catalog-copy" id="catalogCopy">按分类浏览，或搜索项目和能力。点击项目查看包含的 skills，也可以直接前往原始仓库。</p>
      </header>
      <div class="toolbar">
        <div class="result-meta" id="resultMeta"></div>
        <div class="toolbar-actions">
          <div class="segmented" id="viewModes" role="tablist" aria-label="展示模式">
            <button class="segment active" id="gridView" data-view="grid">网格</button>
            <button class="segment" id="listView" data-view="list">列表</button>
          </div>
          <select class="sort-select" id="sortSelect" aria-label="排序">
            <option value="name" id="sortName">按名称</option>
            <option value="skills" id="sortSkills">按 skill 数</option>
            <option value="updated" id="sortUpdated">按检查日期</option>
          </select>
        </div>
      </div>
      <div class="project-grid" id="projectGrid"></div>
    </section>
  </main>

  <div class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-backdrop" id="drawerBackdrop"></div>
    <section class="drawer-panel" id="drawerPanel" role="dialog" aria-modal="true" aria-label="项目详情">
      <div class="drawer-head">
        <div>
          <h2 class="drawer-title" id="drawerTitle"></h2>
          <p class="description" id="drawerDescription"></p>
        </div>
        <div class="drawer-head-actions">
          <button class="nav-link language-toggle" id="drawerLanguageToggle" type="button" aria-label="Switch to English">EN</button>
          <a class="primary-link" id="drawerSourceLink" href="#" target="_blank" rel="noreferrer">打开 GitHub</a>
          <button class="icon-button" id="closeDrawer" title="关闭" aria-label="关闭">×</button>
        </div>
      </div>
      <div class="drawer-body" id="drawerBody"></div>
    </section>
  </div>

  <script>

navigate Slack, send messages, extract data, find information, search conversations, or automate any Slack task. Triggers include \"check my Slack\", \"what channels have unreads\", \"send a message to\", \"search Slack for\", \"extract from Slack\", \"find who said\", or any task requiring programmatic Slack interaction.","added_at":"2026-05-17","extracted_path":"extracted-skills/agent-browser/slack","description_zh":"使用浏览器自动化与 Slack 工作区交互。当用户需要检查未读频道、浏览 Slack、发送消息、提取数据、查找信息、搜索对话或自动执行任何 Slack 任务时使用。触发语句包括“检查我的 Slack”“哪些频道有未读消息”“向……发送消息”“在 Slack 中搜索……”“从 Slack 提取……”“查找是谁说的……”，或任何需要以编程方式与 Slack 交互的任务。"},{"id":"vercel-sandbox","name":"vercel-sandbox","path":"libraries/agent-browser/skill-data/vercel-sandbox","original_path":"skill-data/vercel-sandbox","tags":["browser","docs","coding","data","cli"],"description":"Run agent-browser + Chrome inside Vercel Sandbox microVMs for browser automation from any Vercel-deployed app. Use when the user needs browser automation in a Vercel app (Next.js, SvelteKit, Nuxt, Remix, Astro, etc.), wants to run headless Chrome without binary size limits, needs persistent browser sessions across commands, or wants ephemeral isolated browser environments. Triggers include \"Vercel Sandbox browser\", \"microVM Chrome\", \"agent-browser in sandbox\", \"browser automation on Vercel\", or any task requiring Chrome in a Vercel Sandbox.","added_at":"2026-05-17","extracted_path":"extracted-skills/agent-browser/vercel-sandbox","description_zh":"在 Vercel Sandbox microVM 中运行 agent-browser + Chrome，以便从任何部署到 Vercel 的应用执行浏览器自动化。当用户需要在 Vercel 应用（Next.js、SvelteKit、Nuxt、Remix、Astro 等）中实现浏览器自动化、希望运行不受二进制文件大小限制的无头 Chrome、需要在多条命令之间保持浏览器会话，或需要临时隔离的浏览器环境时使用。触发词包括 \"Vercel Sandbox browser\"、\"microVM Chrome\"、\"agent-browser in sandbox\"、\"browser automation on Vercel\"，或任何需要在 Vercel Sandbox 中使用 Chrome 的任务。"},{"id":"agent-browser","name":"agent-browser","path":"libraries/agent-browser/skills/agent-browser","original_path":"skills/agent-browser","tags":["browser","docs","coding","data","cli"],"description":"Browser automation CLI for AI agents. Use when the user needs to interact with websites, including navigating pages, filling forms, clicking buttons, taking screenshots, extracting data, testing web apps, or automating any browser task. Triggers include requests to \"open a website\", \"fill out a form\", \"click a button\", \"take a screenshot\", \"scrape data from a page\", \"test this web app\", \"login to a site\", \"automate browser actions\", or any task requiring programmatic web interaction. Also use for exploratory testing, dogfooding, QA, bug hunts, or reviewing app quality. Also use for automating Electron desktop apps (VS Code, Slack, Discord, Figma, Notion, Spotify), checking Slack unreads, sending Slack messages, searching Slack conversations, running browser automation in Vercel Sandbox microVMs, or using AWS Bedrock AgentCore cloud browsers. Prefer agent-browser over any built-in browser automation or web tools.","added_at":"2026-05-17","extracted_path":"extracted-skills/agent-browser/agent-browser","description_zh":"面向 AI 智能体的浏览器自动化 CLI。当用户需要与网站交互时使用，包括浏览页面、填写表单、点击按钮、截取屏幕截图、提取数据、测试 Web 应用或自动执行任何浏览器任务。触发场景包括“打开网站”“填写表单”“点击按钮”“截取屏幕截图”“从页面抓取数据”“测试此 Web 应用”“登录网站”“自动执行浏览器操作”，或任何需要以编程方式与 Web 交互的任务。也可用于探索性测试、内部试用、QA、缺陷排查或评审应用质量。还可用于自动化 Electron 桌面应用（VS Code、Slack、Discord、Figma、Notion、Spotify）、检查 Slack 未读消息、发送 Slack 消息、搜索 Slack 对话、在 Vercel Sandbox microVMs 中运行浏览器自动化，或使用 AWS Bedrock AgentCore 云浏览器。优先使用 agent-browser，而不是任何内置的浏览器自动化或 Web 工具。"}],"install":{"method":"npx","extracted_root":"extracted-skills/agent-browser","command":"npx skills add vercel-labs/agent-browser","fallback":"extracted"},"extracted":{"root":"extracted-skills/agent-browser","source_library":"agent-browser","source_path":"libraries/agent-browser","last_extracted_commit":"7379f7dbea76ad8dbf47f177349c4c3ce9263dcb","skill_count":7},"category":"coding-tools","description_zh":"agent-browser 收录了 7 个 Agent Skills。"},{"id":"agent-skills","name":"agent-skills","path":"libraries/agent-skills","source":{"type":"github","repo":"supabase/agent-skills","ref":"main","commit":"1356046015476711a769601079262b5635929427"},"tags":["automation","cli","coding","data","docs","mcp"],"description":"Supabase Agent Skills","added_at":"2026-05-17","last_checked_at":"2026-06-25","last_synced_at":"2026-06-25","skill_count":2,"skills":[{"id":"supabase-postgres-best-practices","name":"supabase-postgres-best-practices","path":"libraries/agent-skills/skills/supabase-postgres-best-practices","original_path":"skills/supabase-postgres-best-practices","tags":["docs","coding","data","automation"],"description":"Postgres performance optimization and best practices from Supabase. Use this skill when writing, reviewing, or optimizing Postgres queries, schema designs, or database configurations.","added_at":"2026-05-17","version":"1.1.1","extracted_path":"extracted-skills/agent-skills/supabase-postgres-best-practices","description_zh":"来自 Supabase 的 Postgres 性能优化与最佳实践。在编写、审查或优化 Postgres 查询、模式设计或数据库配置时使用此技能。"},{"id":"supabase","name":"supabase","path":"libraries/agent-skills/skills/supabase","original_path":"skills/supabase","tags":["docs","coding","data","mcp","cli"],"description":"Use when doing ANY task involving Supabase. Triggers: Supabase products (Database, Auth, Edge Functions, Realtime, Storage, Vectors, Cron, Queues); client libraries and SSR integrations (supabase-js, @supabase/ssr) in Next.js, React, SvelteKit, Astro, Remix; auth issues (login, logout, sessions, JWT, cookies, getSession, getUser, getClaims, RLS); Supabase CLI or MCP server; schema changes, migrations, security audits, Postgres extensions (pg_graphql, pg_cron, pg_vector).","added_at":"2026-05-17","version":"0.1.2","extracted_path":"extracted-skills/agent-skills/supabase","description_zh":"用于处理任何涉及 Supabase 的任务。触发条件：Supabase 产品（Database、Auth、Edge Functions、Realtime、Storage、Vectors、Cron、Queues）；Next.js、React、SvelteKit、Astro、Remix 中的客户端库和 SSR 集成（supabase-js、@supabase/ssr）；身 f artifact that may benefit from having Anthropic's look-and-feel. Use it when brand colors or style guidelines, visual formatting, or company design standards apply.","added_at":"2026-06-25","extracted_path":"extracted-skills/anthropic/brand-guidelines","description_zh":"将 Anthropic 的官方品牌色彩和字体应用于任何可受益于 Anthropic 外观与风格的制品。当涉及品牌色彩或风格指南、视觉格式或公司设计标准时使用此技能。"},{"id":"canvas-design","name":"canvas-design","path":"libraries/anthropic/skills/canvas-design","original_path":"skills/canvas-design","tags":["image","docs","coding","obsidian","pdf"],"description":"Create beautiful visual art in .png and .pdf documents using design philosophy. You should use this skill when the user asks to create a poster, piece of art, design, or other static piece. Create original visual designs, never copying existing artists' work to avoid copyright violations.","added_at":"2026-06-25","extracted_path":"extracted-skills/anthropic/canvas-design","description_zh":"运用设计哲学，在 .png 和 .pdf 文档中创作精美的视觉艺术。当用户要求创作海报、艺术作品、设计或其他静态作品时，应使用此技能。创作原创视觉设计，绝不复制现有艺术家的作品，以避免侵犯版权。"},{"id":"claude-api","name":"claude-api","path":"libraries/anthropic/skills/claude-api","original_path":"skills/claude-api","tags":["docs","coding","frontend","automation"],"description":"Reference for the Claude API / Anthropic SDK — model ids, pricing, params, streaming, tool use, MCP, agents, caching, token counting, model migration.\nTRIGGER — read BEFORE opening the target file; don't skip because it \"looks like a one-liner\" — whenever: the prompt names Claude/Anthropic in any form (Claude, Anthropic, Fable, Opus, Sonnet, Haiku, `anthropic`, `@anthropic-ai`, `claude-*`, `us.anthropic.*`, `[1m]`); the user asks about an LLM (pricing/model choice/limits/caching) — never answer from memory; OR the task is LLM-shaped with provider unstated (agent/MCP/tool-definition/multi-agent/RAG/LLM-judge/computer-use; generate/summarize/extract/classify/rewrite/converse over NL; debugging refusals/cutoffs/streaming/tool-calls/tokens).\nSKIP only when another provider is being worked on (overrides all triggers): OpenAI/GPT/Gemini/Llama/Mistral/Cohere/Ollama named in the query; OR `grep -rE 'openai|langchain_openai|google.generativeai|genai|mistralai|cohere|ollama'` over the project hits (run this grep FIRST if no provider named — don't Read the file).","added_at":"2026-05-17","extracted_path":"extracted-skills/anthropic/claude-api","description_zh":"Claude API / Anthropic SDK 参考资料——涵盖模型 ID、定价、参数、流式传输、工具使用、MCP、智能体、缓存、令牌计数和模型迁移。\n触发条件——在打开目标文件之前阅读；不要因为它“看起来只需一行”就跳过——以下情况均应触发：提示以任何形式提到 Claude/Anthropic（Claude、Anthropic、Fable、Opus、Sonnet、Haiku、`anthropic`、`@anthropic-ai`、`claude-*`、`us.anthropic.*`、`[1m]`）；用户询问 LLM（定价/模型选择/限制/缓存）——绝不能凭记忆回答；或者任务具有 LLM 特征但未说明提供商（智能体/MCP/工具定义/多智能体/RAG/LLM 评判器/计算机使用；针对自然语言进行生成/摘要/提取/分类/改写/对话；调试拒绝/截断/流式传输/工具调用/令牌问题）。\n仅在正在处理其他提供商时跳过（覆盖所有触发条件）：查询中提到 OpenAI/GPT/Gemini/Llama/Mistral/Cohere/Ollama；或者在项目中运行 `grep -rE 'openai|langchain_openai|google.generativeai|genai|mistralai|cohere|ollama'` 有匹配结果（如果未指定提供商，首先运行此 grep——不要读取文件）。"},{"id":"doc-coauthoring","name":"doc-coauthoring","path":"libraries/anthropic/skills/doc-coauthoring","original_path":"skills/doc-coauthoring","tags":["docs","coding","workflow","frontend"],"description":"Guide users through a structured workflow for co-authoring documentation. Use when user wants to write documentation, proposals, technical specs, decision docs, or similar structured content. This workflow helps users efficiently transfer context, refine content through iteration, and verify the doc works for readers. Trigger when user mentions writing docs, creating proposals, drafting specs, or similar documentation tasks.","added_at":"2026-06-25","extracted_path":"extracted-skills/anthropic/doc-coauthoring","description_zh":"引导用户通过结构化工作流共同撰写文档。当用户希望编写文档、提案、技术规范、决策文档或类似的结构化内容时使用。此工作流帮助用户高效传递上下文、通过迭代完善内容，并验证文档对读者是否有效。当用户提到撰写文档、创建提案、起草规范或类似的文档任务时触发。"},{"id":"docx","name":"docx","path":"libraries/anthropic/skills/docx","original_path":"skills/docx","tags":["image","docs","coding","data","pdf"],"description":"Use this skill whenever the user wants to create, read, edit, or manipulate Word documents (.docx files). Triggers include: any mention of 'Word doc', 'word document', '.docx', or requests to produce professional documents with formatting like tables of contents, headings, page numbers, or letterheads. Also use when extracting or reorganizing content from .docx files, inserting or replacing images in documents, performing find-and-replace in Word files, working with tracked changes or comments, or converting content into a polished Word document. If the user asks for a 'report', 'memo', 'letter', 'template', or similar deliverable as a Word or .docx file, use this skill. Do NOT use for PDFs, spreadsheets, Google Docs, or general coding tasks unrelated to document generation.","added_at":"2026-06-25","extracted_path":"extracted-skills/anthropic/docx","description_zh":"当用户想要创建、读取、编辑或处理 Word 文档（.docx 文件）时，请使用此技能。触发条件包括：任何提及“Word 文档”“word document”或“.docx”的情况，或者要求制作带有目录、标题、页码或信头等格式的专业文档。还应在以下情况使用：从 .docx 文件中提取或重新组织内容、在文档中插入或替换图像、在 Word 文件中执行查找和替换、处理修订或批注，或者将内容转换为精美的 Word 文档。如果用户要求以 Word 或 .docx 文件形式交付“报告”“备忘录”“信函”“模板”或类似成果，请使用此技能。请勿将其用于 PDF、电子表格、Google Docs 或与文档生成无关的常规编码任务。"},{"id":"frontend-design","name":"frontend-design","path":"libraries/anthropic/skills/frontend-design","original_path":"skills/frontend-design","tags":["docs","coding","frontend"],"description":"Guidance for distinctive, intentional visual design when building new UI or reshaping an existing one. Helps with aesthetic direction, typography, and making choices that don't read as templated defaults.","added_at":"2026-06-25","extracted_path":"extracted-skills/anthropic/frontend-design","description_zh":"在构建新 UI 或重塑现有 UI 时，为打造独特且有明确意图的视觉设计提供指导。帮助确定美学方向、选择字体，并作出不会显得像模板默认方案的设计决策。"},{"id":"internal-comms","name":"internal-comms","path":"libraries/anthropic/skills/internal-comms","original_path":"skills/internal-comms","tags":["docs","coding"],"description":"A set of resources to help me write all kinds of internal communications, using the formats that my company likes to use. Claude should use this skill whenever asked to write some sort of internal communications (status reports, leadership updates, 3P updates, company newsletters, FAQs, incident reports, project updates, etc.).","added_at":"2026-06-25","extracted_path":"extracted-skills/anthropic/internal-comms","description_zh":"一套帮助我撰写各类内部沟通内容的资源，采用我公司惯用的格式。每当被要求撰写某种内部沟通内容（状态报告、管理层动态、3P 动态、公司简报、常见问题解答、事件报告、项目动态等）时，Claude 都应使用此技能。"},{"id":"mcp-builder","name":"mcp-builder","path":"libraries/anthropic/skills/mcp-builder","original_path":"skills/mcp-builder","tags":["docs","coding","mcp","frontend"],"description":"Guide for creating high-quality MCP (Model Context Protocol) servers that enable LLMs to interact with external services through well-designed tools. Use when building MCP servers to integrate external APIs or services, whether in Python (FastMCP) or Node/TypeScript (MCP SDK).","added_at":"2026-06-25","extracted_path":"extracted-skills/anthropic/mcp-builder","description_zh":"创建高质量 MCP（模型上下文协议）服务器的指南，使 LLM 能够通过精心设计的工具与外部服务交互。适用于构建 MCP 服务器以集成外部 API 或服务，无论使用 Python（FastMCP）还是 Node/TypeScript（MCP SDK）。"},{"id":"pdf","name":"pdf","path":"libraries/anthropic/skills/pdf","original_path":"skills/pdf","tags":["image","docs","coding","data","pdf"],"description":"Use this skill whenever the user wants to do anything with PDF files. This includes reading or extracting text/tables from PDFs, combining or merging multiple PDFs into one, splitting PDFs apart, rotating pages, adding watermarks, creating new PDFs, filling PDF forms, encrypting/decrypting PDFs, extracting images, and OCR on scanned PDFs to make them searchable. If the user mentions a .pdf file or asks to produce one, use this skill.","added_at":"2026-06-25","extracted_path":"extracted-skills/anthropic/pdf","description_zh":"每当用户想要对 PDF 文件执行任何操作时，都应使用此技能。这包括从 PDF 中读取或提取文本和表格、将多个 PDF 合并为一个、拆分 PDF、旋转页面、添加水印、创建新 PDF、填写 PDF 表单、加密或解密 PDF、提取图像，以及对扫描版 PDF 执行 OCR 以使其可搜索。如果用户提到 .pdf 文件或要求生成 PDF，请使用此技能。"},{"id":"pptx","name":"pptx","path":"libraries/anthropic/skills/pptx","original_path":"skills/pptx","tags":["docs","coding"],"description":"Use this skill any time a .pptx file is involved in any way — as input, output, or both. This includes: creating slide decks, pitch decks, or presentations; reading, parsing, or extracting text from any .pptx file (even if the extracted content will be used elsewhere, like in an email or summary); editing, modifying, or updating existing presentations; combining or splitting slide files; working with templates, layouts, speaker notes, or comments. Trigger whenever the user mentions \\\"deck,\\\" \\\"slides,\\\" \\\"presentation,\\\" or references a .pptx filename, regardless of what they plan to do with the content afterward. If a .pptx file needs to be opened, created, or touched, use this skill.","added_at":"2026-06-25","extracted_path":"extracted-skills/anthropic/pptx","description_zh":"只要以任何方式涉及 .pptx 文件——无论作为输入、输出，还是两者兼有——都应使用此技能。这包括：创建幻灯片、推介演示稿或演示文稿；读取、解析任何 .pptx 文件或从中提取文本（即使提取的内容将用于其他地方，例如电子邮件或摘要）；编辑、修改或更新现有演示文稿；合并或拆分幻灯片文件；使用模板、布局、演讲者备注或评论。当用户提到 \\\"deck\\\"、\\\"slides\\\"、\\\"presentation\\\"，或引用 .pptx 文件名时，无论他们之后打算如何使用其中的内容，都应触发此技能。如果需要打开、创建或处理 .pptx 文件，请使用此技能。"},{"id":"skill-creator","name":"skill-creator","path":"libraries/anthropic/skills/skill-creator","original_path":"skills/skill-creator","tags":["docs","coding"],"description":"Create new skills, modify and improve existing skills, and measure skill performance. Use when users want to create a skill from scratch, edit, or optimize an existing skill, run evals to test a skill, benchmark skill performance with variance analysis, or optimize a skill's description for better triggering accuracy.","added_at":"2026-06-25","extracted_path":"extracted-skills/anthropic/skill-creator","description_zh":"创建新技能、修改和改进现有技能，并衡量技能性能。当用户想从头创建技能、编辑或优化现有技能、运行 evals 来测试技能、通过方差分析对技能性能进行基准测试，或优化技能描述以提高触发准确率时使用。"},{"id":"slack-gif-creator","name":"slack-gif-creator","path":"libraries/anthropic/skills/slack-gif-creator","original_path":"skills/slack-gif-creator","tags":["image","docs","coding"],"description":"Knowledge and utilities for creating animated GIFs optimized for Slack. Provides constraints, validation tools, and animation concepts. Use when users request animated GIFs for Slack like \"make me a GIF of X doing Y for Slack.","added_at":"2026-06-25","extracted_path":"extracted-skills/anthropic/slack-gif-creator","description_zh":"用于创建针对 Slack 优化的动画 GIF 的知识和实用工具。提供约束条件、验证工具和动画概念。当用户请求为 Slack 制作动画 GIF 时使用，例如“为我制作一个 X 做 Y 的 GIF，用于 Slack。”"},{"id":"theme-factory","name":"theme-factory","path":"libraries/anthropic/skills/theme-factory","original_path":"skills/theme-factory","tags":["docs","coding"],"description":"Toolkit for styling artifacts with a theme. These artifacts can be slides, docs, reportings, HTML landing pages, etc. There are 10 pre-set themes with colors/fonts that you can apply to any artifact that has been creating, or can generate a new theme on-the-fly.","added_at":"2026-06-25","extracted_path":"extracted-skills/anthropic/theme-factory","description_zh":"使用主题为制品设置样式的工具包。这些制品可以是幻灯片、文档、报告、HTML 落地页等。内置 10 个带有颜色和字体的预设主题，可将其应用于任何已创建的制品，也可以即时生成新主题。"},{"id":"web-artifacts-builder","name":"web-artifacts-builder","path":"libraries/anthropic/skills/web-artifacts-builder","original_path":"skills/web-artifacts-builder","tags":["docs","coding","frontend"],"description":"Suite of tools for creating elaborate, multi-component claude.ai HTML artifacts using modern frontend web technologies (React, Tailwind CSS, shadcn/ui). Use for complex artifacts requiring state management, routing, or shadcn/ui components - not for simple single-file HTML/JSX artifacts.","added_at":"2026-06-25","extracted_path":"extracted-skills/anthropic/web-artifacts-builder","description_zh":"使用现代前端 Web 技术（React、Tailwind CSS、shadcn/ui）创建精美、多组件 claude.ai HTML 工件的工具套件。适用于需要状态管理、路由或 shadcn/ui 组件的复杂工件，不适用于简单的单文件 HTML/JSX 工件。"},{"id":"webapp-testing","name":"webapp-testing","path":"libraries/anthropic/skills/webapp-testing","original_path":"skills/webapp-testing","tags":["browser","docs","coding","frontend","automation"],"description":"Toolkit for interacting with and testing local web applications using Playwright. Supports verifying frontend functionality, debugging UI behavior, capturing browser screenshots, and viewing browser logs.","added_at":"2026-06-25","extracted_path":"extracted-skills/anthropic/webapp-testing","description_zh":"使用 Playwright 与本地 Web 应用程序交互并进行测试的工具包。支持验证前端功能、调试 UI 行为、捕获浏览器截图以及查看浏览器日志。"},{"id":"xlsx","name":"xlsx","path":"libraries/anthropic/skills/xlsx","original_path":"skills/xlsx","tags":["docs","coding","data"],"description":"Use this skill any time a spreadsheet file is the primary input or output. This means any task where the user wants to: open, read, edit, or fix an existing .xlsx, .xlsm, .csv, or .tsv file (e.g., adding columns, computing formulas, formatting, charting, cleaning messy data); create a new spreadsheet from scratch or from other data sources; or convert between tabular file formats. Trigger especially when the user references a spreadsheet file by name or path — even casually (like \\\"the xlsx in my downloads\\\") — and wants something done to it or produced from it. Also trigger for cleaning or restructuring messy tabular data files (malformed rows, misplaced headers, junk data) into proper spreadsheets. The deliverable must be a spreadsheet file. Do NOT trigger when the primary deliverable is a Word document, HTML report, standalone Python script, database pipeline, or Google Sheets API integration, even if tabular data is involved.","added_at":"2026-06-25","extracted_path":"extracted-skills/anthropic/xlsx","description_zh":"当电子表格文件是主要输入或输出时，均应使用此技能。这包括用户希望：打开、读取、编辑或修复现有的 .xlsx、.xlsm、.csv 或 .tsv 文件（例如添加列、计算公式、设置格式、制作图表、清理杂乱数据）；从头创建新电子表格或根据其他数据源创建电子表格；或者在表格文件格式之间进行转换。尤其是当用户提到电子表格文件的名称或路径时——即使只是随口提及（例如“我下载目录里的那个 xlsx”）——并希望对其进行处理或基于它生成内容，也应触发此技能。此外，将杂乱的表格数据文件（格式错误的行、错位的表头、垃圾数据）清理或重构为规范的电子表格时，也应触发此技能。交付物必须是电子表格文件。如果主要交付物是 Word 文档、HTML 报告、独立 Python 脚本、数据库管道或 Google Sheets API 集成，即使涉及表格数据，也不要触发此技能。"},{"id":"template-skill","name":"template-skill","path":"libraries/anthropic/template","original_path":"template","tags":["docs","coding"],"description":"Replace with description of the skill and when Claude should use it.","added_at":"2026-06-25","extracted_path":"extracted-skills/anthropic/template-skill","description_zh":"请替换为该 skill 的说明，以及 Claude 应在何时使用它。"}],"install":{"method":"extracted","extracted_root":"extracted-skills/anthropic"},"extracted":{"root":"extracted-skills/anthropic","source_library":"anthropic","source_path":"libraries/anthropic","last_extracted_commit":"57546260929473d4e0d1c1bb75297be2fdfa1949","skill_count":18},"category":"personal-collection","category_locked":true,"description_zh":"anthropic 收录了 18 个 Agent Skills。"},{"id":"baoyu-skills","name":"baoyu-skills","path":"libraries/baoyu-skills","source":{"type":"github","repo":"JimLiu/baoyu-skills","ref":"main","commit":"348dc826123c306999b511d8c0417e4642ea82eb"},"tags":["browser","cli","coding","data","docs","frontend","image","workflow"],"description":"baoyu-skills","added_at":"2026-05-17","last_checked_at":"2026-06-25","last_synced_at":"2026-06-25","skill_count":21,"skills":[{"id":"baoyu-article-illustrator","name":"baoyu-article-illustrator","path":"libraries/baoyu-skills/skills/baoyu-article-illustrator","original_path":"skills/baoyu-article-illustrator","tags":["image","docs","coding","frontend"],"description":"Analyzes article structure, identifies positions requiring visual aids, generates illustrations with Type × Style × Palette three-dimension approach. Use when user asks to \"illustrate article\", \"add images\", \"generate images for article\", or \"为文章配图\".","added_at":"2026-05-17","version":"1.117.4","extracted_path":"extracted-skills/baoyu-skills/baoyu-article-illustrator","description_zh":"分析文章结构，识别需要视觉辅助的位置，并采用「类型 × 风格 × 配色」三维方法生成插图。当用户要求“为文章配图”“添加图片”“为文章生成图片”或“为文章配图”时使用。"},{"id":"baoyu-comic","name":"baoyu-comic","path":"libraries/baoyu-skills/skills/baoyu-comic","original_path":"skills/baoyu-comic","tags":["image","docs","coding"],"description":"Knowledge comic creator supporting multiple art styles and tones. Creates original educational comics with detailed panel layouts and batch-capable image generation. Use when user asks to create \"知识漫画\", \"教育漫画\", \"biography comic\", \"tutorial comic\", or \"Logicomix-style comic\".","added_at":"2026-05-17","version":"1.117.4","extracted_path":"extracted-skills/baoyu-skills/baoyu-comic","description_zh":"支持多种艺术风格与基调的知识漫画创作工具。可创作原创教育漫画，提供详细的分镜布局，并支持批量生成图像。当用户要求创作“知识漫画”“教育漫画”“biography comic”“tutorial comic”或“Logicomix-style comic”时使用。"},{"id":"baoyu-compress-image","name":"baoyu-compress-image","path":"libraries/baoyu-skills/skills/baoyu-compress-image","original_path":"skills/baoyu-compress-image","tags":["image","docs","coding"],"description":"Compresses images to WebP (default) or PNG with automatic tool selection. Use when user asks to \"compress image\", \"optimize image\", \"convert to webp\", or reduce image file size.","added_at":"2026-05-17","version":"1.56.1","extracted_path":"extracted-skills/baoyu-skills/baoyu-compress-image","description_zh":"使用自动工具选择将图像压缩为 WebP（默认）或 PNG。当用户要求“压缩图像”“优化图像”“转换为 webp”或减小图像文件大小时使用。"},{"id":"baoyu-cover-image","name":"baoyu-cover-image","path":"libraries/baoyu-skills/skills/baoyu-cover-image","original_path":"skills/baoyu-cover-image","tags":["image","docs","coding"],"description":"Generates article cover images with 5 dimensions (type, palette, rendering, text, mood) combining 11 color palettes and 7 rendering styles. Supports cinematic (2.35:1), widescreen (16:9), and square (1:1) aspects. Use when user asks to \"generate cover image\", \"create article cover\", or \"make cover\".","added_at":"2026-05-17","version":"1.117.5","extracted_path":"extracted-skills/baoyu-skills/baoyu-cover-image","description_zh":"通过 5 个维度（类型、配色、渲染、文本、氛围）生成文章封面图，组合使用 11 种配色方案和 7 种渲染风格。支持电影画幅（2.35:1）、宽屏（16:9）和正方形（1:1）宽高比。当用户要求“生成封面图”“创建文章封面”或“制作封面”时使用。"},{"id":"baoyu-danger-gemini-web","name":"baoyu-danger-gemini-web","path":"libraries/baoyu-skills/skills/baoyu-danger-gemini-web","original_path":"skills/baoyu-danger-gemini-web","tags":["image","docs","coding"],"description":"Generates images and text via reverse-engineered Gemini Web API. Supports text generation, image generation from prompts, reference images for vision input, and multi-turn conversations. Use when other skills need image generation backend, or when user requests \"generate image with Gemini\", \"Gemini text generation\", or needs vision-capable AI generation.","added_at":"2026-05-17","version":"1.56.2","extracted_path":"extracted-skills/baoyu-skills/baoyu-danger-gemini-web","description_zh":"通过逆向工程的 Gemini Web API 生成图像和文本。支持文本生成、根据提示词生成图像、使用参考图像作为视觉输入，以及多轮对话。当其他技能需要图像生成后端，或用户请求“使用 Gemini 生成图像”“Gemini 文本生成”，或需要具备视觉能力的 AI 生成时使用。"},{"id":"baoyu-danger-x-to-markdown","name":"baoyu-danger-x-to-markdown","path":"libraries/baoyu-skills/skills/baoyu-danger-x-to-markdown","original_path":"skills/baoyu-danger-x-to-markdown","tags":["docs","coding","frontend"],"description":"Converts X (Twitter) tweets and articles to markdown with YAML front matter. Uses reverse-engineered API requiring user consent. Use when user mentions \"X to markdown\", \"tweet to markdown\", \"save tweet\", or provides x.com/twitter.com URLs for conversion.","added_at":"2026-05-17","version":"1.117.3","extracted_path":"extracted-skills/baoyu-skills/baoyu-danger-x-to-markdown","description_zh":"将 X（Twitter）推文和文章转换为带有 YAML 前置元数据的 Markdown。使用逆向工程 API，需要获得用户同意。当用户提及“X 转 Markdown”“推文转 Markdown”“保存推文”，或提供 x.com/twitter.com URL 进行转换时使用。"},{"id":"baoyu-diagram","name":"baoyu-diagram","path":"libraries/baoyu-skills/skills/baoyu-diagram","original_path":"skills/baoyu-diagram","tags":["image","docs","coding","data","workflow"],"description":"Create professional, dark-themed SVG diagrams of any type — architecture diagrams, flowcharts, sequence diagrams, structural diagrams, mind maps, timelines, illustrative/conceptual diagrams, and more. Use this skill whenever the user asks for any kind of technical or conceptual diagram, visualization of a system, process flow, data flow, component relationship, network topology, decision tree, org chart, state machine, or any visual representation of structure/logic/process. Also trigger when the user says \"画个图\" \"画一个架构图\" \"diagram\" \"flowchart\" \"sequence diagram\" \"draw me a ...\" or uploads content and asks to visualize it. Output is always a standalone .svg file.","added_at":"2026-05-17","version":"1.117.3","extracted_path":"extracted-skills/baoyu-skills/baoyu-diagram","description_zh":"创建任何类型的专业深色主题 SVG 图表——架构图、流程图、时序图、结构图、思维导图、时间线、说明性/概念图等。每当用户请求任何类型的技术图或概念图、系统可视化、流程、数据流、组件关系、网络拓扑、决策树、组织结构图、状态机，或任何结构/逻辑/过程的可视化表示时，都应使用此技能。当用户说“画个图”“画一个架构图”“diagram”“flowchart”“sequence diagram”“draw me a ...”，或上传内容并要求将其可视化时，也应触发此技能。输出始终是一个独立的 `.svg` 文件。"},{"id":"baoyu-electron-extract","name":"baoyu-electron-extract","path":"libraries/baoyu-skills/skills/baoyu-electron-extract","original_path":"skills/baoyu-electron-extract","tags":["docs","coding","frontend"],"description":"Extracts resources and JavaScript from any installed Electron app (`.asar` bundle), restoring original sources from `.js.map` files when available or formatting minified code with Prettier otherwise. Use when user wants to \"extract Electron app\", \"decompile Electron\", \"get the source code of <app>\", \"inspect app.asar\", \"看 Electron 应用源码\", \"提取 .asar\", or asks how a desktop Electron app is built. Skips `node_modules` and supports both macOS and Windows.","added_at":"2026-06-25","version":"1.119.0","extracted_path":"extracted-skills/baoyu-skills/baoyu-electron-extract","description_zh":"从任何已安装的 Electron 应用（`.asar` 包）中提取资源和 JavaScript；当存在 `.js.map` 文件时，从中还原原始源码，否则使用 Prettier 格式化  deck / turn this into a PDF / make this presentable / create a landing page\".","added_at":"2026-07-02","extracted_path":"extracted-skills/kami/kami-2","description_zh":"排版专业文档与产品落地页：简历、单页文档、白皮书、信件、作品集、幻灯片、落地页。暖色羊皮纸质感、墨蓝色强调、以衬线字体为主的层级。中文使用 TsangerJinKai02，英文使用 Charter，日文使用 YuMincho（尽力支持）。由 \"做 PDF / 排版 / 一页纸 / 白皮书 / 作品集 / 简历 / PPT / slides / Marp / markdown slides / マークダウンのスライド / 落地页 / 官网 / landing page / product page\"，或 \"build me a resume / make a one-pager / design a slide deck / turn this into a PDF / make this presentable / create a landing page\" 触发。"}],"install":{"method":"npx","extracted_root":"extracted-skills/kami","command":"npx skills add tw93/kami/plugins/kami/skills/kami -a '*' -g -y","fallback":"extracted"},"extracted":{"root":"extracted-skills/kami","source_library":"kami","source_path":"libraries/kami","last_extracted_commit":"594bfb8f2c62f26102a377c2e6cdb8cafa7d61f1","skill_count":2},"category":"document-data","category_locked":true,"description_zh":"kami 收录了 2 个 Agent Skills。"},{"id":"ljg-skills","name":"ljg-skills","path":"libraries/ljg-skills","source":{"type":"github","repo":"lijigang/ljg-skills","ref":"master","commit":"52d8ac25f243221c7cdfc99d04a3b1ad479497d1"},"tags":["automation","coding","data","docs","finance","frontend","pdf","research"],"description":"ljg-skills","added_at":"2026-05-17","last_checked_at":"2026-06-25","last_synced_at":"2026-06-25","skill_count":23,"skills":[{"id":"ljg-book","name":"ljg-book","path":"libraries/ljg-skills/skills/ljg-book","original_path":"skills/ljg-book","tags":["docs","coding","research"],"description":"拆一本书，以「问题」为轴心走一条线。五件事：作者在答什么问题（问题），这个问题之前各流派/社会共识怎么答（零点），作者带来什么独特洞见——公式/理论框架/模型/概念四选一——相对共识挪动了什么（位移/delta），落成哪句结论（落点），最后萃一个 takeaway 作为精神内核（行囊）。收尾画一张 ASCII 参考系图（千脑智能式）：各流派、旧共识、作者钉到同一张图的位置上，delta 是图上一段看得见的距离，再走两步做预测——看懂这本书在认知史里挪动了哪一步，还能拿它预测书外的新事。Use when user says '拆书', '拆这本', '分析这本书', '这本书在讲什么', '上帝之眼看这本书', '压缩一本书', 'book', or shares a book name wanting structural analysis. NOT FOR 章节摘要（用 Fabric extract_wisdom）、论文（用 ljg-paper）、单一观点深钻（用 ljg-think）、一个领域降秩（用 ljg-rank）.","added_at":"2026-06-25","extracted_path":"extracted-skills/ljg-skills/ljg-book","description_zh":"拆一本书，以「问题」为轴心走一条线。五件事：作者在答什么问题（问题），这个问题之前各流派/社会共识怎么答（零点），作者带来什么独特洞见——公式/理论框架/模型/概念四选一——相对共识挪动了什么（位移/delta），落成哪句结论（落点），最后萃一个 takeaway 作为精神内核（行囊）。收尾画一张 ASCII 参考系图（千脑智能式）：各流派、旧共识、作者钉到同一张图的位置上，delta 是图上一段看得见的距离，再走两步做预测——看懂这本书在认知史里挪动了哪一步，还能拿它预测书外的新事。用户说「拆书」「拆这本」「分析这本书」「这本书在讲什么」「上帝之眼看这本书」「压缩一本书」「book」，或给出书名并希望做结构分析时使用。不适用于章节摘要（用 Fabric extract_wisdom）、论文（用 ljg-paper）、单一观点深钻（用 ljg-think）、一个领域降秩（用 ljg-rank）。"},{"id":"ljg-card","name":"ljg-card","path":"libraries/ljg-skills/skills/ljg-card","original_path":"skills/ljg-card","tags":["docs","coding"],"description":"Content caster (铸). Transforms content into PNG visuals. Seven molds: -l (default) long reading card, -i infograph, -m multi-card reading cards (1080x1440), -v editorial sketchnote (problem→failure→pivot→insight→naming, magazine + archive layout), -c comic (manga-style B&W), -w whiteboard (marker-style board layout), -b big-fonts attachment card (1080x1440, weathered 碑刻 style for 小红书). Output to ~/Downloads/. Use when user says '铸', 'cast', '做成图', '做成卡片', '做成信息图', '做成海报', '视觉笔记', 'sketchnote', '杂志', 'editorial', '漫画', 'comic', 'manga', '白板', 'whiteboard', '大字', '附件图', 'big fonts', '小红书卡片'. Replaces ljg-cards and ljg-infograph.","added_at":"2026-05-17","version":"2.3.0","extracted_path":"extracted-skills/ljg-skills/ljg-card","description_zh":"内容铸造器（铸）。将内容转换为 PNG 视觉图。七种模具：-l（默认）长阅读卡，-i 信息图，-m 多张阅读卡（1080x1440），-v 编辑式视觉笔记（问题→失败→转折→顿悟→命名，杂志 + 档案布局），-c 漫画（日式黑白风格），-w 白板（马克笔风格白板布局），-b 大字附件卡（1080x1440，适合小红书的风化碑刻风格）。输出到 ~/Downloads/。当用户说‘铸’、‘cast’、‘做成图’、‘做成卡片’、‘做成信息图’、‘做成海报’、‘视觉笔记’、‘sketchnote’、‘杂志’、‘editorial’、‘漫画’、‘comic’、‘manga’、‘白板’、‘whiteboard’、‘大字’、‘附件图’、‘big fonts’、‘小红书卡片’时使用。取代 ljg-cards 和 ljg-infograph。"},{"id":"ljg-invest","name":"ljg-invest","path":"libraries/ljg-skills/skills/ljg-invest","original_path":"skills/ljg-invest","tags":["docs","finance","coding"],"description":"投资分析, 生成一份深度投资分析报告。不做传统投资分析——核心判断是项目是否是一台「秩序创造机器」。Use when user says '投资报告', '投资分析', '分析这个项目', '写投资报告', 'investment report', 'invest analysis', or provides entrepreneur conversation records wanting investment evaluation. Also trigger when user pastes or references meeting notes, pitch decks, or founder interviews and asks for analysis.","added_at":"2026-05-17","extracted_path":"extracted-skills/ljg-skills/ljg-invest","description_zh":"投资分析, 生成一份深度投资分析报告。不做传统投资分析——核心判断是项目是否是一台「秩序创造机器」。当用户说“投资报告”“投资分析”“分析这个项目”“写投资报告”“investment report”“invest analysis”，或提供创业者对话记录并希望获得投资评估时使用。当用户粘贴或引用会议记录、商业计划书或创始人访谈并要求分析时，也应触发。"},{"id":"ljg-learn","name":"ljg-learn","path":"libraries/ljg-skills/skills/ljg-learn","original_path":"skills/ljg-learn","tags":["docs","coding","frontend","research"],"description":"Deep concept anatomist that deconstructs any concept through 8 exploration dimensions (history, dialectics, phenomenology, linguistics, formalization, existentialism, aesthetics, meta-philosophy) and compresses insights into an epiphany. Use when user asks to explain, dissect, or deeply understand a concept, term, or idea. Triggers on '解剖概念', '概念解剖', 'explain concept', 'learn concept', '/ljg-learn'. Produces org-mode output.","added_at":"2026-05-17","extracted_path":"extracted-skills/ljg-skills/ljg-learn","description_zh":"深度概念解剖师，通过 8 个探索维度（历史、辩证法、现象学、语言学、形式化、存在主义、美学、元哲学）解构任何概念，并将洞见压缩为一句顿悟。当用户要求解释、剖析或深入理解某个概念、术语或思想时使用。触发词包括 '解剖概念'、'概念解剖'、'explain concept'、'learn concept'、'/ljg-learn'。生成 org-mode 输出。"},{"id":"ljg-library","name":"ljg-library","path":"libraries/ljg-skills/skills/ljg-library","original_path":"skills/ljg-library","tags":["docs","coding"],"description":"一本书 → 一幅清晰的「取景框」意向画面 → 一张 2050 图书馆借书卡（PNG）。取景框 = 作者从哪个角度看什么问题、看到了哪幅画面；卡上有真实封面、作者头像、书目信息。取景框 block 用费曼式讲解把这幅意向画面讲得通俗又准确；图解 block 用 AI 生图把这幅画面画出来，继刚是固定主角（从其墨像参考生成、认得出的他）。两种风格 mold：默认 -a 动物森友会（暖萌治愈），可选 -c pixel+cyber-hacker（暗黑霓虹）。浅色光学玻璃卡身、强调色从封面动态提取、宽高自适应。合上书记住这幅画面，就没白读。Use when user says '取景框卡', '图书馆卡', 'library card', '书卡', '铸书卡', '一本书一句话一张卡', '/ljg-library', or provides a book name and wants it distilled into one collectible card. 风格：默认 -a 动森，加 -c 走 cyber。NOT FOR 拆书结构分析（用 ljg-book）、纯文字金句（用 ljg-card -b）、信息图（用 ljg-card -i）、视觉笔记（用 ljg-card -v）。","added_at":"2026-06-25","version":"3.0.0","extracted_path":"extracted-skills/ljg-skills/ljg-library","description_zh":"一本书 → 一幅清晰的「取景框」意向画面 → 一张 2050 图书馆借书卡（PNG）。取景框 = 作者从哪个角度看什么问题、看到了哪幅画面；卡上有真实封面、作者头像、书目信息。取景框 block 用费曼式讲解把这幅意向画面讲得通俗又准确；图解 block 用 AI 生图把这幅画面画出来，继刚是固定主角（从其墨像参考生成、认得出的他）。两种风格 mold：默认 -a 动物森友会（暖萌治愈），可选 -c pixel+cyber-hacker（暗黑霓虹）。浅色光学玻璃卡身、强调色从封面动态提取、宽高自适应。合上书记住这幅画面，就没白读。当用户说「取景框卡」「图书馆卡」「library card」「书卡」「铸书卡」「一本书一句话一张卡」「/ljg-library」，或提供书名并希望将其提炼成一张收藏卡时使用。风格：默认 -a 动森，加 -c 走 cyber。不适用于拆书结构分析（用 ljg-book）、纯文字金句（用 ljg-card -b）、信息图（用 ljg-card -i）、视觉笔记（用 ljg-card -v）。"},{"id":"ljg-map","name":"ljg-map","path":"libraries/ljg-skills/skills/ljg-map","original_path":"skills/ljg-map","tags":["docs","finance","coding","research"],"description":"一个行业 → 一张生态地形图卡（PNG）。以《千脑智能》参考系理论为地基：把行业摊成一张可俯瞰的「生态地形」——价值像河一样流过地貌，再在地形上标出两处——「瓶颈」（流量/产能在此收窄的隘口/水坝）和「价值捕获点」（利润在此沉淀的宝藏堆）。地形让权力结构一眼可见：卡流量的地方常常不是钱沉淀的地方。配三个关键指标的 base rate（刻度）+ 三个「大问题」（前沿）。deep research 真联网，图用 AI 生图（默认 -a 动物森友会暖萌风，可选 -c pixel+cyber），继刚作小测量员立在地形上俯瞰。Use when user says '行业地图', '产业地图', '生态地形图', '画一下这个行业', 'industry map', 'map this industry', '行业版图', '产业链地图', '/ljg-map', or gives an industry/领域 name wanting its terrain mapped. 风格：默认 -a 动森，加 -c 走 cyber。NOT FOR 一个领域降秩找生成器（用 ljg-rank）、拆一本书（用 ljg-book）、单个项目投资分析（用 ljg-invest）、一个概念深钻（用 ljg-think）。","added_at":"2026-06-25","version":"2.0.0","extracted_path":"extracted-skills/ljg-skills/ljg-map","description_zh":"一个行业 → 一张生态地形图卡（PNG）。以《千脑智能》参考系理论为地基：把行业摊成一张可俯瞰的「生态地形」——价值像河一样流过地貌，再在地形上标出两处——「瓶颈」（流量/产能在此收窄的隘口/水坝）和「价值捕获点」（利润在此沉淀的宝藏堆）。地形让权力结构一眼可见：卡流量的地方常常不是钱沉淀的地方。配三个关键指标的基准率（刻度）+ 三个「大问题」（前沿）。深度研究真实联网，图用 AI 生图（默认 -a 动物森友会暖萌风，可选 -c 像素+赛博风），继刚作小测量员立在地形上俯瞰。当用户说「行业地图」「产业地图」「生态地形图」「画一下这个行业」「industry map」「map this industry」「行业版图」「产业链地图」「/ljg-map」，或给出一个行业/领域名称并希望绘制其地形时使用。风格：默认 -a 动森，加 -c 走赛博风。不适用于给一个领域降秩找生成器（用 ljg-rank）、拆一本书（用 ljg-book）、单个项目投资分析（用 ljg-invest）、一个概念深钻（用 ljg-think）。"},{"id":"ljg-paper-flow","name":"ljg-paper-flow","path":"libraries/ljg-skills/skills/ljg-paper-flow","original_path":"skills/ljg-paper-flow","tags":["docs","coding","workflow","pdf","research"],"description":"Paper workflow: read papers + cast 取景框 library cards in one go. Takes one or more arxiv links, paper URLs, PDFs, or paper names. For each paper, runs ljg-paper (generates org analysis) then ljg-library (distills the paper's 取景框 into a 2050 library card PNG). Use when user says '论文流', 'paper flow', '读论文并做卡片', '论文卡片', or provides multiple papers wanting both analysis and cards.","added_at":"2026-05-17","version":"1.1.0","extracted_path":"extracted-skills/ljg-skills/ljg-paper-flow","description_zh":"论文工作流：一站式阅读论文并铸造取景框借书卡。接收一个或多个 arxiv 链接、论文 URL、PDF 或论文名称。针对每篇论文，先运行 ljg-paper（生成 org 分析），再运行 ljg-library（将论文的取景框提炼成一张 2050 借书卡 PNG）。当用户说“论文流”、“paper flow”、“读论文并做卡片”、“论文卡片”，或提供多篇论文并希望同时获得分析和卡片时使用。"},{"id":"ljg-paper-river","name":"ljg-paper-river","path":"libraries/ljg-skills/skills/ljg-paper-river","original_path":"skills/ljg-paper-river","tags":["docs","coding","research"],"description":"论文倒读法：给一篇论文，递归找出它批判和改进的前序论文（最多5层），再找它之后的最新进展，从源头正向讲述问题演化史。以问题为轴，费曼式讲解每篇论文看到的问题和解法创新。Use when user shares a paper and wants to understand its intellectual lineage, citation chain, problem evolution, or says '倒读', '论文溯源', '论文脉络', 'paper river', 'paper connects', 'trace back', '这篇论文的来龙去脉', '论文演化'. Also trigger when user wants to understand how a research problem evolved across multiple papers.","added_at":"2026-05-17","version":"1.0.0","extracted_path":"extracted-skills/ljg-skills/ljg-paper-river","description_zh":"论文倒读法：给一篇论文，递归找出它批判和改进的前序论文（最多5层），再找它之后的最新进展，从源头正向讲述问题演化史。以问题为轴，费曼式讲解每篇论文看到的问题和解法创新。当用户分享一篇论文，并希望了解它的思想谱系、引用链、问题演化，或提到 '倒读'、'论文溯源'、'论文脉络'、'paper river'、'paper connects'、'trace back'、'这篇论文的来龙去脉'、'论文演化' 时使用。当用户希望了解一个研究问题如何在多篇论文中演化时，也应触发。"},{"id":"ljg-paper","name":"ljg-paper","path":"libraries/ljg-skills/skills/ljg-paper","original_path":"skills/ljg-paper","tags":["docs","coding","pdf","research"],"description":"Paper reader for non-academics. Reads a paper and tells it back as one continuous story — the life of the paper's core proposition (命题), told on a seven-beat spine (主角 / 困境 / 旧路 / 转折 / 解法 / 结局 / 内核): born in a bind on a base-rate ruler, crystallized as a bold conjecture, argued through mechanism and evidence, distilled into a new way of seeing, then walked out of the paper — life-tested and cashed into falsifiable predictions (检验). Output opens with a scannable 速读 card (一句话 / 大想法 / 只记三件事) that compresses the whole story three ways for the time-poor reader and the six-months-later self, then tells the full story. The job is storytelling that makes the paper land, not academic critique. Use when user shares an arxiv link, paper URL, PDF, or asks to analyze a research paper. Trigger words: '读论文', '讲论文', '把这篇讲给我听', '分析论文', 'paper', or when user shares an academic paper.","added_at":"2026-05-17","version":"6.1.0","extracted_path":"extracted-skills/ljg-skills/ljg-paper","description_zh":"面向非学术读者的论文阅读器。它读完一篇论文，再把论文讲成一个连贯的故事——以论文核心命题的一生为主线，沿七拍脊柱展开（主角 / 困境 / 旧路 / 转折 / 解法 / 结局 / 内核）：命题在两难中诞生，以基础比率为标尺，凝结成一个大胆猜想，由机制和证据完成论证，提炼为一种新的观察方式，最后走出论文——接受生活检验，并兑现为可证伪的预测（检验）。输出先用一张便于扫读的速读卡开场（一句话 / 大想法 / 只记三件事），从三个角度压缩整个故事，服务于时间紧张的读者和半年后的自己，然后再讲完整故事。任务是用故事让论文真正落地，而不是进行学术批评。当用户分享 arxiv 链接、论文 URL、PDF，或要求分析研究论文时使用。触发词：'读论文'、'讲论文'、'把这篇讲给我听'、'分析论文'、'paper'，或用户分享学术论文时。"},{"id":"ljg-plain","name":"ljg-plain","path":"libraries/ljg-skills/skills/ljg-plain","original_path":"skills/ljg-plain","tags":["docs","coding"],"description":"Cognitive atom: Plain (白). Rewrites any content so a smart 12-year-old groks it. Structure-free — form follows content. Use when user says '白话说', '说人话', '解释一下', 'plain', 'grok'.","added_at":"2026-05-17","version":"5.0.0","extracted_path":"extracted-skills/ljg-skills/ljg-plain","description_zh":"认知原子：白。把任何内容改写到聪明的 12 岁孩子也能真正弄懂。不限定结构——形式跟着内容走。用户说「白话说」「说人话」「解释一下」「plain」「grok」时使用。"},{"id":"ljg-present","name":"ljg-present","path":"libraries/ljg-skills/skills/ljg-present","original_path":"skills/ljg-present","tags":["docs","coding"],"description":"演讲铸造器（Outline-Faithful）。基于 orgmode/markdown outline 层级 1:1 视觉化呈现——色块大字、ultra-bold 错位，原文不动只做美化。三档主题色 black/red/yellow（默认 black 或按 filetags 推断），可用 -r/-b/-y 显式覆盖；可用 --cyber 走黑底绿字 cyber-hacker 风。使用时用户会说：'讲这个'、'present'、'做成演讲'、'呈现一下'、'铸成演示'、'做个 slides'、'标语流'、'宣言体'、'slogan'、'manifesto'、'按 outline 美化'。输出单文件 HTML 到 ~/Downloads/。","added_at":"2026-05-17","version":"3.0.0","extracted_path":"extracted-skills/ljg-skills/ljg-present","description_zh":"演讲铸造器（大纲忠实型）。基于 Org Mode/Markdown 大纲层级进行 1:1 视觉化呈现——色块大字、超粗体错位，原文不动，只做美化。提供 black/red/yellow 三档主题色（默认 black，或按 filetags 推断），可用 -r/-b/-y 显式覆盖；可用 --cyber 启用黑底绿字的赛博黑客风格。使用时用户会说：'讲这个'、'present'、'做成演讲'、'呈现一下'、'铸成演示'、'做个 slides'、'标语流'、'宣言体'、'slogan'、'manifesto'、'按 outline 美化'。输出单文件 HTML 到 ~/Downloads/。"},{"id":"ljg-push","name":"ljg-push","path":"libraries/ljg-skills/skills/ljg-push","original_path":"skills/ljg-push","tags":["docs","coding"],"description":"把 ~/.claude/skills/ljg-* 里所有更新过的 skills 同步到 github repo (ljg-skills)，先推 master 分支（org-mode 输出风格），再切 md 分支（markdown 输出风格）做基础 markdown 化后推。Use when user says '/ljg-push', 'push skills', '推送 skills', '同步 skills', 'sync ljg', or whenever ljg-* skills get updated and need shipping. NOT FOR pushing non-ljg skills or arbitrary git repos.","added_at":"2026-05-17","extracted_path":"extracted-skills/ljg-skills/ljg-push","description_zh":"把 ~/.claude/skills/ljg-* 里所有更新过的 skills 同步到 github repo (ljg-skills)，先推 master 分支（org-mode 输出风格），再切 md 分支（markdown 输出风格）做基础 markdown 化后推。当用户说 '/ljg-push'、'push skills'、'推送 skills'、'同步 skills'、'sync ljg'，或每当 ljg-* skills 更新后需要发布时使用。不用于推送非 ljg skills 或任意 git repo。"},{"id":"ljg-qa","name":"ljg-qa","path":"libraries/ljg-skills/skills/ljg-qa","original_path":"skills/ljg-qa","tags":["docs","coding","frontend","research"],"description":"信息提问机。给一篇文章/论文/书，把核心观点抽成 Q-A 对——Question 切要害，不教科书；Answer 简洁清晰，有形式化收口，逻辑链完整。读者顺 Q 链走过，每个 A 砸下一枚钉子，复现作者整套推理。Use when user says '问答', 'Q&A', 'QA', '提问', '抽取问题', '/ljg-qa', or shares an article/paper/book and asks for Q-A extraction. Triggers when the user wants ideas extracted not as a summary but as a sequence of incisive questions with answered. NOT FOR FAQ generation, glossary creation, or comprehension quizzes — this is intellectual scaffolding, not study aids.","added_at":"2026-05-17","extracted_path":"extracted-skills/ljg-skills/ljg-qa","description_zh":"信息提问机。给一篇文章/论文/书，把核心观点抽成 Q-A 对——Question 切要害，不教科书；Answer 简洁清晰，有形式化收口，逻辑链完整。读者顺 Q 链走过，每个 A 砸下一枚钉子，复现作者整套推理。当用户说“问答”“Q&A”“QA”“提问”“抽取问题”“/ljg-qa”，或分享一篇文章/论文/书并要求提取 Q-A 时使用。当用户希望将思想提取为一系列尖锐且有答案的问题，而非摘要时触发。不适用于生成 FAQ、创建术语表或阅读理解测验——这是思想脚手架，不是学习辅助工具。"},{"id":"ljg-rank","name":"ljg-rank","path":"libraries/ljg-skills/skills/ljg-rank","original_path":"skills/ljg-rank","tags":["docs","coding"],"description":"给一个领域，找出背后真正撑着它的几根独立的力。十几个现象砍到不可再少的生成器——砍完能把现象一个个生回来，才算数。Use when user says '降秩', '找秩', '秩是什么', '这个领域靠什么撑着', '背后是什么', or wants to decompose any domain to its irreducible generators.","added_at":"2026-05-17","extracted_path":"extracted-skills/ljg-skills/ljg-rank","description_zh":"给一个领域，找出背后真正撑着它的几根独立的力。十几个现象砍到不可再少的生成器——砍完能把现象一个个生回来，才算数。当用户说“降秩”“找秩”“秩是什么”“这个领域靠什么撑着”“背后是什么”，或者想把任何领域分解为不可约的生成器时使用。"},{"id":"ljg-read","name":"ljg-read","path":"libraries/ljg-skills/skills/ljg-read","original_path":"skills/ljg-read","tags":["docs","coding","frontend","automation","research"],"description":"Reading companion agent. Accompanies user through any text (books, articles, essays, papers, news) with translation, structural annotation, deep questioning, and cross-domain insights. Detects language, translates English to Chinese (faithfulness-expressiveness-elegance), guides reader to understand the author and encounter real questions. Use when user says '伴读', '陪我读', '读这篇', 'read with me', 'companion read', or shares a text/URL wanting guided reading.","added_at":"2026-05-17","version":"1.0.0","extracted_path":"extracted-skills/ljg-skills/ljg-read","description_zh":"伴读智能体。通过翻译、结构标注、深度提问和跨领域洞见，陪伴用户阅读任何文本（书籍、文章、随笔、论文、新闻）。检测语言，将英文翻译为中文（信、达、雅），引导读者理解作者并遭遇真实问题。当用户说「伴读」「陪我读」「读这篇」「read with me」「companion read」，或分享文本/URL 并希望获得引导式阅读时使用。"},{"id":"ljg-relationship","name":"ljg-relationship","path":"libraries/ljg-skills/skills/ljg-relationship","original_path":"skills/ljg-relationship","tags":["docs","coding"],"description":"Relationship analyst combining structural diagnostics (5-layer framework) with psychoanalytic depth (transference, unconscious patterns, resistance). Guides users through dialogue to \"see\" the real structure of their relationship issues. Use when user says \"关系分析\", \"分析关系\", \"relationship\", \"人际关系\", or describes a specific relationship problem they want to understand.","added_at":"2026-05-17","extracted_path":"extracted-skills/ljg-skills/ljg-relationship","description_zh":"关系分析师，将结构诊断（五层框架）与精神分析深度 （移情、无意识模式、阻抗）相结合。 通过对话引导用户“看见”其关系问题的真实结构。 当用户说“关系分析”“分析关系”“relationship”“人际关系”， 或描述一个他们想要理解的具体关系问题时使用。"},{"id":"ljg-roundtable","name":"ljg-roundtable","path":"libraries/ljg-skills/skills/ljg-roundtable","original_path":"skills/ljg-roundtable","tags":["docs","coding","data"],"description":"Structured roundtable discussion framework with a truth-seeking moderator who invites representative figures for dialectical debate on any topic. Use when user says \"圆桌讨论\", \"圆桌\", \"roundtable\", \"辩论\", or wants to explore a topic through multi-perspective structured debate.","added_at":"2026-05-17","extracted_path":"extracted-skills/ljg-skills/ljg-roundtable","description_zh":"结构化圆桌讨论框架，由一位求真务实的主持人邀请代表性人物， 围绕任何议题展开辩证辩论。 当用户提到“圆桌讨论”、“圆桌”、“roundtable”、“辩论”， 或希望通过多视角的结构化辩论探索某个议题时使用。"},{"id":"ljg-skill-map","name":"ljg-skill-map","path":"libraries/ljg-skills/skills/ljg-skill-map","original_path":"skills/ljg-skill-map","tags":["docs","coding"],"description":"Skill map viewer. Scans all installed skills and renders a visual overview — name, version, description, category at a glance. Use when user says 'skills', '技能', '技能地图', 'skill map', '我有哪些技能', '看看技能', '列出技能', 'list skills'. Also trigger when user asks what skills are available or installed.","added_at":"2026-05-17","version":"1.0.0","extracted_path":"extracted-skills/ljg-skills/ljg-skill-map","description_zh":"技能地图查看器。扫描所有已安装的技能，并呈现可视化概览——名称、版本、描述、类别一目了然。当用户说 'skills'、'技能'、'技能地图'、'skill map'、'我有哪些技能'、'看看技能'、'列出技能'、'list skills' 时使用。当用户询问有哪些可用或已安装的技能时，也应触发。"},{"id":"ljg-think","name":"ljg-think","path":"libraries/ljg-skills/skills/ljg-think","original_path":"skills/ljg-think","tags":["docs","coding"],"description":"追本之箭——纵向深钻思维工具。给一个观点、现象或问题，像箭一样一路向下钻到不可再分的本质。Use when user says '想透', '追本', '本质是什么', '为什么会这样', '深挖', '钻到底', 'think deep', 'drill down', or wants to trace any idea/phenomenon vertically to its irreducible root. Also trigger when user provides a statement and wants depth analysis, not breadth survey.","added_at":"2026-05-17","extracted_path":"extracted-skills/ljg-skills/ljg-think","description_zh":"追本之箭——纵向深钻思维工具。给一个观点、现象或问题，像箭一样一路向下钻到不可再分的本质。当用户说“想透”“追本”“本质是什么”“为什么会这样”“深挖”“钻到底”“think deep”“drill down”，或想要纵向追溯任何观点或现象至其不可再分的根源时使用。当用户提出一个说法，并希望进行深度分析而非广度综述时，也应触发。"},{"id":"ljg-travel","name":"ljg-travel","path":"libraries/ljg-skills/skills/ljg-travel","original_path":"skills/ljg-travel","tags":["docs","coding","data","workflow","research"],"description":"Deep travel research workflow for museums and ancient architecture. Input a city name, auto-generates structured knowledge document (org-mode) + portable reference cards (PNG). Covers historical background, museum highlights, archaeological significance, and architectural heritage. Use when user says '旅行研究', '博物馆功课', '古建功课', 'travel research', '出发前功课', or provides a city name with intent to do deep cultural travel preparation.","added_at":"2026-05-17","version":"1.0.0","extracted_path":"extracted-skills/ljg-skills/ljg-travel","description_zh":"面向博物馆与古代建筑的深度旅行研究工作流。输入城市名称，自动生成结构化知识文档（org-mode）和便携参考卡片（PNG）。涵盖历史背景、博物馆亮点、考古意义与建筑遗产。当用户提到「旅行研究」「博物馆功课」「古建功课」「travel research」「出发前功课」，或提供城市名称并表达进行深度文化旅行准备的意图时使用。"},{"id":"ljg-word-flow","name":"ljg-word-flow","path":"libraries/ljg-skills/skills/ljg-word-flow","original_path":"skills/ljg-word-flow","tags":["docs","coding","workflow"],"description":"Word flow: deep-dive word analysis + infograph card in one go. Takes one or more English words, runs ljg-word (generates deep semantics analysis) then ljg-card -i (generates infograph PNG). Use when user says '词卡', 'word card', 'word flow', or provides English words wanting both analysis and visual card.","added_at":"2026-05-17","version":"1.0.1","extracted_path":"extracted-skills/ljg-skills/ljg-word-flow","description_zh":"单词流：一次完成深度单词分析与信息图卡片生成。接收一个或多个英文单词，先运行 ljg-word（生成深层语义分析），再运行 ljg-card -i（生成信息图 PNG）。当用户说“词卡”“word card”“word flow”，或提供英文单词并希望同时获得分析和可视化卡片时使用。"},{"id":"ljg-word","name":"ljg-word","path":"libraries/ljg-skills/skills/ljg-word","original_path":"skills/ljg-word","tags":["docs","coding"],"description":"Deep-dive English word mastery tool. Deconstructs a single English word into core semantics and epiphany. Use when user asks to explain/master a specific English word.","added_at":"2026-05-17","version":"1.0.1","extracted_path":"extracted-skills/ljg-skills/ljg-word","description_zh":"深度掌握英语单词的工具。将单个英语单词解构为核心语义与顿悟。适用于用户要求解释或掌握某个特定英语单词的场景。"},{"id":"ljg-writes","name":"ljg-writes","path":"libraries/ljg-skills/skills/ljg-writes","original_path":"skills/ljg-writes","tags":["docs","coding"],"description":"写作引擎。像手术刀剖开一个观点，一层层剥到底。1000-1500 字。","added_at":"2026-05-17","version":"6.3.0","extracted_path":"extracted-skills/ljg-skills/ljg-writes","description_zh":"写作引擎。像手术刀剖开一个观点，一层层剥到底。1000-1500 字。"}],"install":{"method":"npx","extracted_root":"extracted-skills/ljg-skills","command":"npx skills add lijigang/ljg-skills -g --all","fallback":"extracted"},"extracted":{"root":"extracted-skills/ljg-skills","source_library":"ljg guages including Chinese, English, Japanese, Korean, Arabic, and more. Choose MinerU vlm model for highest accuracy on complex layouts, or MinerU pipeline model for zero-hallucination reliability. Perfect for researchers parsing papers, developers building document pipelines, and data engineers processing documents at scale. MinerU文档提取工具，PDF转Markdown、扫描件OCR、表格识别、公式识别、批量PDF处理、Word转Markdown、Excel转Markdown、网页爬取、图片OCR、学术论文解析。MinerU支持PDF、Word、PPT、Excel（XLS/XLSX）、图片等多格式文档智能转换，命令行一键提取，免登录快速模式或高精度专业模式。","added_at":"2026-05-17","extracted_path":"extracted-skills/mineru/mineru-document-extractor","description_zh":"MinerU 文档提取——将 PDF、扫描文档、图片、Word（DOC/DOCX）、PowerPoint（PPT/PPTX）、Excel（XLS/XLSX）和网页转换为整洁的 Markdown、HTML、LaTeX 或 DOCX。MinerU 是一款一体化 CLI 工具和智能体技能，可实现可靠、高保真的文档解析。 是否正为无法阅读的 PDF、混乱的表格格式或转换后乱码的公式而苦恼？MinerU 通过两种提取模式解决这些问题：MinerU flash-extract 可即时进行零配置转换，支持表格识别、公式识别和 OCR（无需令牌、无需登录、无需配置——运行即可获得结果）；MinerU precision extract 则提供基于 VLM 的版面分析、多种输出格式，以及数百个文件的批量处理能力。 当你需要以下功能时，请使用 MinerU：“如何从这个 PDF 中提取文本”“我想把 PDF 转换为 Markdown”“能否解析这篇包含表格和公式的学术论文”“我需要对扫描文档进行 OCR”“批量转换我的所有 PDF”“把这个 Word 文档转换为 Markdown”“将网页抓取为 Markdown”“从这个文档中提取表格”。MinerU 支持 80 多种语言，包括中文、英语、日语、韩语、阿拉伯语等。 对于复杂版面，可选择 MinerU vlm 模型以获得最高准确率；对于零幻觉的可靠性，可选择 MinerU pipeline 模型。非常适合解析论文的研究人员、构建文档处理流水线的开发者，以及大规模处理文档的数据工程师。 MinerU文档提取工具，PDF转Markdown、扫描件OCR、表格识别、公式识别、批量PDF处理、Word转Markdown、Excel转Markdown、网页爬取、图片OCR、学术论文解析。MinerU支持PDF、Word、PPT、Excel（XLS/XLSX）、图片等多格式文档智能转换，命令行一键提取，免登录快速模式或高精度专业模式。"}],"install":{"method":"extracted","extracted_root":"extracted-skills/mineru"},"extracted":{"root":"extracted-skills/mineru","source_library":"mineru","source_path":"libraries/mineru","last_extracted_commit":"5733c03b3d53cb01c0361bb6acecda3f554c8c12","skill_count":1},"category":"daily-tools","category_locked":true,"description_zh":"MinerU 文档提取——将 PDF、扫描文档、图片、Word（DOC/DOCX）、PowerPoint（PPT/PPTX）、Excel（XLS/XLSX）和网页转换为整洁的 Markdown、HTML、LaTeX 或 DOCX。MinerU 是一款一体化 CLI 工具和智能体技能，可实现可靠、高保真的文档解析。 是否正为无法阅读的 PDF、混乱的表格格式或转换后乱码的公式而苦恼？MinerU 通过两种提取模式解决这些问题 il-review，但扫描整个代码库而不是 差异：按优先级排列可删除、简化或替换为标准库/原生等效实现的内容。 当用户说“审计这个代码库”“审计过度工程”“这个仓库里有什么可以删除” “查找臃肿内容”“ponytail-audit”或“/ponytail-audit”时使用。生成一次性报告， 不应用修复。"},{"id":"ponytail-debt","name":"ponytail-debt","path":"libraries/ponytail/ponytail-debt","original_path":"libraries/ponytail/ponytail-debt","tags":["docs","coding"],"description":"Harvest every `ponytail:` comment in the codebase into a debt ledger, so the deliberate shortcuts and deferrals ponytail leaves behind get tracked instead of rotting into \"later means never\". Use when the user says \"ponytail debt\", \"/ponytail-debt\", \"what did ponytail defer\", \"list the shortcuts\", \"ponytail ledger\", or \"what did we mark to do later\". One-shot report, changes nothing.","added_at":"2026-07-15","extracted_path":"extracted-skills/ponytail/ponytail-debt","description_zh":"将代码库中的每一条 `ponytail:` 注释汇总到技术债台账中，从而跟踪 ponytail 有意留下的捷径和延期事项，而不是让它们腐化成“以后就等于永远不做”。 当用户说“ponytail 技术债”、“/ponytail-debt”、“ponytail 延期了什么”、 “列出捷径”、“ponytail 台账”或“我们标记了哪些以后再做的事项”时使用。 一次性报告，不做任何更改。"},{"id":"ponytail-gain","name":"ponytail-gain","path":"libraries/ponytail/ponytail-gain","original_path":"libraries/ponytail/ponytail-gain","tags":["docs","coding"],"description":"Show ponytail's measured impact as a compact scoreboard: less code, less cost, more speed, from the benchmark medians. One-shot display, not a persistent mode, and not a per-repo number. Trigger: /ponytail-gain, \"ponytail gain\", \"what does ponytail save\", \"show ponytail impact\", \"ponytail scoreboard\".","added_at":"2026-07-15","extracted_path":"extracted-skills/ponytail/ponytail-gain","description_zh":"以紧凑记分板展示 ponytail 经测量的影响：更少代码、更低成本、 更快速度，数据取自基准测试中位数。一次性展示，并非 持久模式，也不是针对单个仓库的数值。触发方式：/ponytail-gain、 \"ponytail 收益\"、\"ponytail 节省了什么\"、\"展示 ponytail 的影响\"、 \"ponytail 记分板\"。"},{"id":"ponytail-help","name":"ponytail-help","path":"libraries/ponytail/ponytail-help","original_path":"libraries/ponytail/ponytail-help","tags":["docs","coding","cli","frontend"],"description":"Quick
