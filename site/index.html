步回 AI Engineer Europe 2026 的 Accelevents 时使用。"},{"id":"antislop-codebase","name":"antislop-codebase","path":"libraries/swyxio-skills/antislop-codebase","original_path":"antislop-codebase","tags":["docs","coding","automation"],"description":"Analyze and transform messy, prototype, overgrown, slop-prone, or hard-to-maintain software repositories into maintainable product-shaped codebases while preserving existing product behavior. Use when the user asks to antislop a codebase, clean up a messy repo, run a maintainability migration, write a refactor plan, modernize structure, improve TypeScript/type boundaries, harden tests, reduce large files, clean architecture, coordinate subagent-driven refactors, or produce a final migration audit/report/microsite. Do not use for broader production-readiness specialties such as security audits, observability/logging programs, compliance hardening, SRE/runbook work, or reliability engineering unless the user explicitly scopes those as part of the maintainability refactor.","added_at":"2026-06-25","extracted_path":"extracted-skills/swyxio-skills/antislop-codebase","description_zh":"在保留现有产品行为的同时，分析并改造混乱、原型化、过度膨胀、容易产生低质量代码或难以维护的软件仓库，使其成为可维护、具备产品形态的代码库。当用户要求清理代码库中的低质量代码、整理混乱的仓库、执行可维护性迁移、编写重构计划、现代化项目结构、改进 TypeScript/类型边界、强化测试、缩减大型文件、清理架构、协调由子代理驱动的重构，或生成最终迁移审计/报告/微型网站时使用。除非用户明确将其纳入可维护性重构范围，否则不要将此技能用于更广泛的生产就绪专项，例如安全审计、可观测性/日志计划、合规加固、SRE/运行手册工作或可靠性工程。"},{"id":"app-ux-paradigms","name":"app-ux-paradigms","path":"libraries/swyxio-skills/app-ux-paradigms","original_path":"app-ux-paradigms","tags":["browser","docs","coding","cli","frontend"],"description":"Applies standard web app UX for keyboard shortcuts, modals, overlays, forms, and interaction patterns. Use when building UI, dialogs, menus, hotkeys, help text, accessibility, or when the user asks about Esc, shortcuts, modal close, backdrop click, or common desktop-app expectations.","added_at":"2026-06-25","extracted_path":"extracted-skills/swyxio-skills/app-ux-paradigms","description_zh":"应用标准的 Web 应用用户体验规范，涵盖键盘快捷键、模态框、浮层、表单 和交互模式。适用于构建 UI、对话框、菜单、快捷键、帮助文本、 无障碍功能，或用户询问 Esc、快捷键、关闭模态框、点击背景遮罩 以及常见桌面应用操作习惯时。"},{"id":"autoreview","name":"autoreview","path":"libraries/swyxio-skills/autoreview","original_path":"autoreview","tags":["docs","coding"],"description":"Run structured closeout code review after non-trivial code edits, branch or PR work, or commits using an autoreview helper. Use when the user asks for autoreview, Codex review, Claude review, second-model review, or a final review before commit, ship, merge, or release.","added_at":"2026-06-25","extracted_path":"extracted-skills/swyxio-skills/autoreview","description_zh":"在进行非平凡的代码编辑、分支或 PR 工作或提交后，使用 autoreview 辅助工具执行结构化收尾代码审查。当用户要求 autoreview、Codex 审查、Claude 审查、第二模型审查，或要求在提交、交付、合并或发布前进行最终审查时使用。"},{"id":"claude-session-introspect","name":"claude-session-introspect","path":"libraries/swyxio-skills/claude-session-introspect","original_path":"claude-session-introspect","tags":["docs","coding","data"],"description":"Inspect Claude Code session JSONL files at ~/.claude/projects/ to extract real conversation telemetry: token counts (input/output/cache reads/cache writes), assistant turn counts, human prompt counts, tool-use counts, compaction boundaries, and the contents of compaction summaries. Use this skill when the user asks \"how many tokens did this session use\", \"how many prompts have I sent\", \"show me the stats for this conversation\", \"what got compacted\", \"where are the compaction boundaries\", \"introspect the session\", \"do brain surgery on the JSONL\", or wants any data point that lives inside the on-disk session log rather than the live context window. Inspired by Tal Raviv's \"I wanted to know how compaction works\" article.","added_at":"2026-06-25","version":"1.0","extracted_path":"extracted-skills/swyxio-skills/claude-session-introspect","description_zh":"检查位于 ~/.claude/projects/ 的 Claude Code 会话 JSONL 文件，以提取真实的对话遥测数据：令牌计数（输入/输出/缓存读取/缓存写入）、助手轮次、人工提示数、工具使用次数、压缩边界以及压缩摘要的内容。当用户询问“这个会话使用了多少令牌”“我发送了多少条提示”“显示这次对话的统计信息”“哪些内容被压缩了”“压缩边界在哪里”“自省会话”“对 JSONL 做脑部手术”，或需要任何存在于磁盘会话日志而非实时上下文窗口中的数据点时，请使用此技能。灵感来自 Tal Raviv 的文章《I wanted to know how compaction works》。"},{"id":"codebase-maintainability-guardrails","name":"codebase-maintainability-guardrails","path":"libraries/swyxio-skills/codebase-maintainability-guardrails","original_path":"codebase-maintainability-guardrails","tags":["docs","coding","frontend"],"description":"Use for most substantial coding work, especially frontend/fullstack apps, greenfield apps built from scratch, production refactors, UI migrations, and feature work where Codex should preserve maintainable code style: small typed feature-owned files, thin entrypoints, pure domain logic, centralized contracts, behavior-preserving refactors, protected persisted state, feature-owned CSS/Tailwind, focused tests, and real viewport visual QA.","added_at":"2026-06-25","extracted_path":"extracted-skills/swyxio-skills/codebase-maintainability-guardrails","description_zh":"适用于大多数重要的编码工作，尤其是前端/全栈应用、从零构建的全新应用、生产环境重构、UI 迁移，以及需要 Codex 保持代码可维护性的功能开发：由功能归属的小型类型化文件、轻量入口点、纯领域逻辑、集中式契约、保持行为不变的重构、受保护的持久化状态、由功能归属的 CSS/Tailwind、聚焦测试，以及真实视口下的可视化质量检查。"},{"id":"conference-developer-endpoints","name":"conference-developer-endpoints","path":"libraries/swyxio-skills/conference-developer-endpoints","original_path":"conference-developer-endpoints","tags":["docs","coding","data","mcp"],"description":"Use when adding or reviewing developer and AI-facing conference data endpoints such as llms.txt, sessions.json, speakers.json, and MCP routes across AI Engineer conference pages.","added_at":"2026-06-25","extracted_path":"extracted-skills/swyxio-skills/conference-developer-endpoints","description_zh":"用于在 AI Engineer 大会页面中添加或审查面向开发者和 AI 的大会数据端点，例如 llms.txt、sessions.json、speakers.json 和 MCP 路由。"},{"id":"conference-transcribe","name":"conference-transcribe","path":"libraries/swyxio-skills/conference-transcribe","original_path":"conference-transcribe","tags":["docs","coding"],"description":"Transcribe a multi-talk conference livestream or long YouTube video into separate per-talk transcripts. Parses timestamps from the video description to split talks, downloads audio/video, transcribes each segment, then uses an LLM to clean up and format the transcripts with key takeaways and frequent timestamps. Use when user says \"transcribe this conference\", \"split this livestream into talks\", \"transcribe each talk separately\", or provides a YouTube URL of a multi-hour event stream with chapter timestamps.","added_at":"2026-06-25","version":"1.0","extracted_path":"extracted-skills/swyxio-skills/conference-transcribe","description_zh":"将包含多场演讲的会议直播或较长的 YouTube 视频转录为按演讲拆分的独立文本。解析视频描述中的时间戳以拆分演讲，下载音频/视频，转录每个片段，然后使用 LLM 清理并格式化转录文本，添加关键要点和密集时间戳。当用户说“转录这场会议”“将此直播拆分为多场演讲”“分别转录每场演讲”，或提供带章节时间戳的数小时活动直播 YouTube URL 时使用。"},{"id":"data-chatbots","name":"data-chatbots","path":"libraries/swyxio-skills/data-chatbots","original_path":"data-chatbots","tags":["docs","coding","data","workflow","cli"],"description":"Design and implement AI copilots that analyze structured data and propose mutations for human approval (draft → apply), not direct writes. Covers prompting, multistep compound requests (remove + add in one turn), FIFO client queuing for long agent loops, validation, session memory, optimistic versioning UX, copilot panel/surface ergonomics (floating-dockable panel, summon-hotkey size state machine), LLM tracing/observability (OpenInference + OTLP session.id grouping, orphan-span fixes, human thumbs up/down feedback annotations), and test matrices. Use when building scheduling/admin chatbots, proposal workflows, human-in-the-loop agents, or reviewing aiebot-style features.","added_at":"2026-06-25","extracted_path":"extracted-skills/swyxio-skills/data-chatbots","description_zh":"设计并实现可分析结构化数据、提出变更并交由人工批准（草稿 → 应用）的 AI 副驾驶，而不是直接写入。涵盖提示、多步骤复合请求（单轮中删除 + 添加）、 面向长时间智能体循环的 FIFO 客户端队列、验证、会话记忆、乐观版本控制 UX、 副驾驶面板/界面的人体工学设计（浮动可停靠面板、唤出快捷键尺寸状态机）、 LLM 追踪/可观测性（OpenInference + OTLP session.id 分组、孤立 span 修复、 人工点赞/点踩反馈注释）以及测试矩阵。适用于构建排程/管理聊天机器人、 提案工作流、人在回路中的智能体，或审查 aiebot 风格的功能。"},{"id":"download-video","name":"download-video","path":"libraries/swyxio-skills/download-video","original_path":"download-video","tags":["docs","coding","frontend"],"description":"Downloads embedded videos from web pages. Fetches the page, identifies the video hosting service (Vimeo, YouTube, etc.), resolves the correct embed/player URL, and downloads using yt-dlp. Handles private/unlisted videos that require referer headers or embed URLs. Use this skill when someone says \"download this video\", \"save this video\", \"grab the video from this page\", \"rip this video\", or provides a URL and asks to download media from it. Also trigger when someone pastes a URL to a page with an embedded video and wants the video file locally.","added_at":"2026-06-25","version":"1.1","extracted_path":"extracted-skills/swyxio-skills/download-video","description_zh":"从网页下载嵌入式视频。获取页面，识别视频托管服务（Vimeo、YouTube 等），解析正确的嵌入/播放器 URL，然后使用 yt-dlp 下载。支持需要 referer 请求头或嵌入 URL 的私有/不公开列出视频。当有人说“下载这个视频”“保存这个视频”“从这个页面获取视频”“抓取这个视频”，或者提供一个 URL 并要求从中下载媒体时，请使用此技能。当有人粘贴包含嵌入式视频的页面 URL，并希望将视频文件保存到本地时，也应触发此技能。"},{"id":"download-x-video","name":"download-x-video","path":"libraries/swyxio-skills/download-x-video","original_path":"download-x-video","tags":["docs","coding"],"description":"Download video from X/Twitter posts using yt-dlp. Use when the user wants to \"download this X video\", \"save this tweet video\", \"grab video from Twitter\", or provides an x.com/twitter.com status URL with a video. Handles HLS streams and uses --print after_move:filepath for reliable path detection.","added_at":"2026-06-25","extracted_path":"extracted-skills/swyxio-skills/download-x-video","description_zh":"使用 yt-dlp 下载 X/Twitter 帖子中的视频。当用户想要“下载这个 X 视频”“保存这个推文视频”“从 Twitter 获取视频”，或提供包含视频的 x.com/twitter.com 状态 URL 时使用。支持 HLS 流，并使用 --print after_move:filepath 可靠地检测路径。"},{"id":"europe-developer-api","name":"europe-developer-api","path":"libraries/swyxio-skills/europe-developer-api","original_path":"europe-developer-api","tags":["docs","coding","data","mcp","cli"],"description":"Use when working with AI Engineer Europe 2026 developer-facing endpoints, public schedule JSON, speakers JSON, llms.txt files, MCP access, and the local aieng CLI.","added_at":"2026-06-25","extracted_path":"extracted-skills/swyxio-skills/europe-developer-api","description_zh":"在使用 AI Engineer Europe 2026 面向开发者的端点、公开日程 JSON、演讲者 JSON、llms.txt 文件、MCP 访问以及本地 aieng CLI 时使用。"},{"id":"media-transform","name":"media-transform","path":"libraries/swyxio-skills/media-transform","original_path":"media-transform","tags":["image","docs","coding","research"],"description":"Generic media transformation orchestrator — download videos from any source (X/Twitter, Zoom, YouTube, web embeds), upload to YouTube, transcribe with timestamps, generate chapters, create thumbnails with GPT-Image-2, and A/B test titles. Use when the user wants to move a video from one platform to another, or asks to \"download and upload this video to YouTube\", \"publish this recording\", \"save and transcribe this\", or any video pipeline task. Encodes learned best practices and preferences for each stage.","added_at":"2026-06-25","extracted_path":"extracted-skills/swyxio-skills/media-transform","description_zh":"通用媒体转换编排器——从任何来源（X/Twitter、Zoom、YouTube、网页嵌入）下载视频，上传到 YouTube，生成带时间戳的转录、章节，使用 GPT-Image-2 创建缩略图，并对标题进行 A/B 测试。当用户希望将视频从一个平台迁移到另一个平台，或提出“下载此视频并上传到 YouTube”“发布此录像”“保存并转录此内容”或任何视频流水线任务时使用。包含每个阶段中总结出的最佳实践和偏好。"},{"id":"multimodal-extraction","name":"multimodal-extraction","path":"libraries/swyxio-skills/multimodal-extraction","original_path":"multimodal-extraction","tags":["image","docs","coding"],"description":"Given a local video or video URL, downloads the media if needed, extracts slide frames and key moments, transcribes the audio, and writes a Markdown timeline that interleaves screenshots with the transcript at the associated timestamps. Use when asked to turn a video into a multimodal notes file, slide-synced transcript, screenshot-enhanced transcript, or talk recap with images.","added_at":"2026-06-25","version":"0.1.0","extracted_path":"extracted-skills/swyxio-skills/multimodal-extraction","description_zh":"给定本地视频或视频 URL，在需要时下载媒体，提取幻灯片帧和关键时刻，转录音频，并编写一个 Markdown 时间线，将截图与对应时间戳处的转录文本交错排列。适用于将视频转换为多模态笔记文件、与幻灯片同步的转录稿、带截图的转录稿，或包含图片的演讲回顾。"},{"id":"new-mac-setup","name":"new-mac-setup","path":"libraries/swyxio-skills/new-mac-setup","original_path":"new-mac-setup","tags":["docs","coding","cli","frontend"],"description":"Fully automated new Mac setup for fullstack web developers and AI engineers. Generates and executes idempotent shell scripts to install dev tools, CLI utilities, GUI apps, AI/ML tooling, shell config, and macOS preferences — all via Homebrew, fnm, uv, and defaults commands. Use this skill whenever someone says \"set up my Mac\", \"new Mac setup\", \"configure my dev machine\", \"install my dev tools\", \"fresh Mac install\", \"developer environment setup\", or anything about bootstrapping a macOS machine for development. Also trigger when someone mentions setting up Homebrew, Oh-My-ZSH, Node.js, Python, Docker, or terminal configuration on a new Mac — even if they don't call it a \"setup\". This skill is opinionated and based on real-world experience setting up M-series Macs for fullstack JS/TS + Python + AI development.","added_at":"2026-06-25","version":"2.0","extracted_path":"extracted-skills/swyxio-skills/new-mac-setup","description_zh":"面向全栈 Web 开发者和 AI 工程师的全自动新 Mac 配置。生成并执行幂等 Shell 脚本，通过 Homebrew、fnm、uv 和 defaults 命令安装开发工具、CLI 实用程序、GUI 应用、AI/ML 工具、Shell 配置和 macOS 偏好设置。只要有人说“配置我的 Mac”“新 Mac 配置”“配置我的开发机器”“安装我的开发工具”“全新安装 Mac”“开发环境配置”，或提到任何为开发用途初始化 macOS 机器的内容，就使用此技能。当有人提到在新 Mac 上配置 Homebrew、Oh-My-ZSH、Node.js、Python、Docker 或终端配置时，也应触发此技能——即使他们没有将其称为“配置”。此技能具有明确的偏好取向，基于为全栈 JS/TS + Python + AI 开发配置 M 系列 Mac 的真实经验。"},{"id":"observability-hardening","name":"observability-hardening","path":"libraries/swyxio-skills/observability-hardening","original_path":"observability-hardening","tags":["docs","coding"],"description":"Make a production application observable and debuggable with privacy-safe telemetry. Use when the user asks for structured logging, error classes, request IDs, traces, metrics, dashboards, alerts, product analytics, LLM/media operation visibility, user-visible operation status, or production debugging improvements.","added_at":"2026-06-25","extracted_path":"extracted-skills/swyxio-skills/observability-hardening","description_zh":"通过隐私安全的遥测，使生产应用具备可观测性和可调试性。当用户要求改进结构化日志、错误类、请求 ID、追踪、指标、仪表板、告警、产品分析、LLM/媒体操作可见性、用户可见的操作状态或生产环境调试时使用。"},{"id":"podcast-publishing-assistant","name":"podcast-publishing-assistant","path":"libraries/swyxio-skills/podcast-publishing-assistant","original_path":"podcast-publishing-assistant","tags":["docs","coding","workflow"],"description":"Transcribe long-form audio, YouTube videos, podcasts, interviews, or panels; summarize them; extract chapter markers; and draft publishing assets like titles, YouTube descriptions, show notes, and tweet/X copy. Use when a user shares a YouTube link or audio/video file and asks for transcription, diarization, summaries with timestamps, chapter markers, show notes, titles, descriptions, promo copy, or social posts. Especially use for Whisper-based workflows, source-audio-first podcast processing, and any request to turn a recorded conversation into publishable assets.","added_at":"2026-06-25","extracted_path":"extracted-skills/swyxio-skills/podcast-publishing-assistant","description_zh":"转录长篇音频、YouTube 视频、播客、访谈或专题讨论；总结内容；提取章节标记；并起草标题、YouTube 简介、节目笔记和推文/X 文案等发布素材。当用户分享 YouTube 链接或音频/视频文件，并要求转录、说话人区分、带时间戳的摘要、章节标记、节目笔记、标题、简介、推广文案或社交媒体帖子时使用。尤其适用于基于 Whisper 的工作流、音源优先的播客处理，以及任何将录制对话转化为可发布素材的请求。"},{"id":"productionize-app-with-services","name":"productionize-app-with-services","path":"libraries/swyxio-skills/productionize-app-with-services","original_path":"productionize-app-with-services","tags": reable. Use when building or changing frontend routing, filters, tabs, modals, deep links, browser back/forward, or when the user asks to remember navigation in the URL, sync state to query params, or make screens linkable.","added_at":"2026-06-25","extracted_path":"extracted-skills/swyxio-skills/sync-url-navigation","description_zh":"将 URL 查询参数与应用导航、标签页和筛选状态同步，使视图可添加书签并可共享。构建或更改前端路由、 筛选器、标签页、模态框、深层链接、浏览器后退/前进功能时，或当用户要求 在 URL 中记住导航、将状态同步到查询参数，或使页面 可通过链接访问时使用。"},{"id":"test-strategy-hardening","name":"test-strategy-hardening","path":"libraries/swyxio-skills/test-strategy-hardening","original_path":"test-strategy-hardening","tags":["docs","coding","frontend"],"description":"Audit and harden a repository test suite so tests carry their weight. Use when the user asks whether tests are useful, flaky, duplicated, slow, under-covering critical behavior, missing contract/regression coverage, or when a codebase needs a test strategy before major refactors, releases, security work, or production hardening.","added_at":"2026-06-25","extracted_path":"extracted-skills/swyxio-skills/test-strategy-hardening","description_zh":"审计并强化仓库测试套件，使测试充分发挥作用。当用户询问测试是否有用、是否不稳定、重复、缓慢、对关键行为覆盖不足、缺少契约或回归覆盖时，或者代码库在进行重大重构、发布、安全工作或生产环境强化之前需要制定测试策略时使用。"},{"id":"testing-schedule-preview","name":"testing-schedule-preview","path":"libraries/swyxio-skills/testing-schedule-preview","original_path":"testing-schedule-preview","tags":["docs","coding","data","workflow","automation"],"description":"Use when testing the AI Engineer Europe internal Bun schedule preview or public schedule page, including tooltip, modal, CFP metadata, and local preview workflows.","added_at":"2026-06-25","extracted_path":"extracted-skills/swyxio-skills/testing-schedule-preview","description_zh":"用于测试 AI Engineer Europe 内部 Bun 日程预览或公开日程页面，包括工具提示、模态框、CFP 元数据和本地预览工作流。"},{"id":"thumbnail-extraction","name":"thumbnail-extraction","path":"libraries/swyxio-skills/thumbnail-extraction","original_path":"thumbnail-extraction","tags":["docs","coding"],"description":"Extracts the most interesting frames from video files for thumbnail compositing. Detects faces, expressions, smiles, and presentation slides. Outputs full frames, face crops, and transparent cutouts. Use when asked to extract thumbnails, find interesting frames, grab screenshots from video, or create thumbnail candidates from recordings.","added_at":"2026-06-25","version":"0.1.0","extracted_path":"extracted-skills/swyxio-skills/thumbnail-extraction","description_zh":"从视频文件中提取最有趣的帧，用于合成缩略图。检测人脸、表情、微笑和演示文稿幻灯片。输出完整帧、人脸裁剪图和透明抠图。当用户要求提取缩略图、查找有趣的帧、从视频中截取画面或从录像中创建缩略图候选素材时使用。"},{"id":"transcribe-anything","name":"transcribe-anything","path":"libraries/swyxio-skills/transcribe-anything","original_path":"transcribe-anything","tags":["docs","coding","workflow","cli"],"description":"Transcribes audio and video files to text using pluggable ASR backends. Default backend is local whisper CLI (openai-whisper). Supports whisperX (with diarization), insanely-fast-whisper, faster-whisper, whisper.cpp, OpenAI Whisper API, Groq Whisper API, Deepgram, AssemblyAI, Gemini, and Hugging Face models. Handles very long files (1-8+ hours) by preprocessing with ffmpeg: extracts audio from video, converts to optimal ASR format, detects and skips silence, and chunks for API size limits. Supports speaker diarization, word-level timestamps, custom vocabulary, and multiple output formats. Use this skill when someone says \"transcribe this\", \"convert to text\", \"speech to text\", \"get the transcript\", \"transcribe this video/audio/podcast/recording\", or provides a media file and wants text output.","added_at":"2026-06-25","version":"1.0","extracted_path":"extracted-skills/swyxio-skills/transcribe-anything","description_zh":"使用可插拔的 ASR 后端将音频和视频文件转录为文本。默认后端是本地 whisper CLI（openai-whisper）。支持 whisperX（含说话人分离）、insanely-fast-whisper、faster-whisper、whisper.cpp、OpenAI Whisper API、Groq Whisper API、Deepgram、AssemblyAI、Gemini 和 Hugging Face 模型。通过使用 ffmpeg 进行预处理来处理超长文件（1–8 小时以上）：从 ning, premium mockups, art-directed imagery, and flexible grid layouts.","added_at":"2026-07-15","extracted_path":"extracted-skills/taste-skill/brandkit","description_zh":"用于创建高端品牌规范展示板、Logo 系统、视觉识别提案和品牌视觉世界演示的高级品牌套件图像生成技能。专为极简、电影感、编辑风、暗黑科技、奢华、文化、安全、游戏、开发者工具及消费级应用品牌系统而训练。针对有意图的 Logo 构思、精致构图、克制排版、强烈象征意义、高级样机、艺术指导图像和灵活网格布局进行了优化。"},{"id":"industrial-brutalist-ui","name":"industrial-brutalist-ui","path":"libraries/taste-skill/brutalist-skill","original_path":"libraries/taste-skill/brutalist-skill","tags":["docs","coding","data","cli","frontend"],"description":"Raw mechanical interfaces fusing Swiss typographic print with military terminal aesthetics. Rigid grids, extreme type scale contrast, utilitarian color, analog degradation effects. For data-heavy dashboards, portfolios, or editorial sites that need to feel like declassified blueprints.","added_at":"2026-07-15","extracted_path":"extracted-skills/taste-skill/industrial-brutalist-ui","description_zh":"融合瑞士字体印刷与军用终端美学的原始机械界面。刚性网格、极端的字体尺度对比、实用主义色彩、模拟退化效果。适用于需要呈现解密蓝图质感的数据密集型仪表盘、作品集或编辑类网站。"},{"id":"gpt-taste","name":"gpt-taste","path":"libraries/taste-skill/gpt-tasteskill","original_path":"libraries/taste-skill/gpt-tasteskill","tags":["image","docs","coding","frontend","animation"],"description":"Elite UX/UI & Advanced GSAP Motion Engineer. Enforces Python-driven true randomization for layout variance, strict AIDA page structure, wide editorial typography (bans 6-line wraps), gapless bento grids, strict GSAP ScrollTriggers (pinning, stacking, scrubbing), inline micro-images, and massive section spacing.","added_at":"2026-07-15","extracted_path":"extracted-skills/taste-skill/gpt-taste","description_zh":"顶尖 UX/UI 与高级 GSAP 动效工程师。强制使用 Python 驱动的真正随机化来实现布局变化，采用严格的 AIDA 页面结构、宽幅编辑式排版（禁止标题换行至 6 行）、无空隙便当网格、严格的 GSAP ScrollTrigger（固定、堆叠、擦洗），并使用行内微型图片和超大区块间距。"},{"id":"image-to-code","name":"image-to-code","path":"libraries/taste-skill/image-to-code-skill","original_path":"libraries/taste-skill/image-to-code-skill","tags":["image","docs","coding","frontend"],"description":"Elite website image-to-code skill for Codex. For visually important web tasks, it must first generate the design image(s) itself, deeply analyze them, then implement the website to match them as closely as possible. In Codex, it must prefer large, readable, section-specific images instead of tiny compressed boards, generate fresh standalone images for sections or detail views instead of cropping old ones, avoid lazy under-generation, avoid cards-inside-cards-inside-cards UI, and keep the hero clean, spacious, readable, and visible on a small laptop.","added_at":"2026-07-15","extracted_path":"extracted-skills/taste-skill/image-to-code","description_zh":"面向 Codex 的顶级网站图像转代码技能。对于视觉效果至关重要的 Web 任务，必须先自行生成设计图像，对其进行深入分析，然后实现与图像尽可能一致的网站。在 Codex 中，必须优先使用大型、清晰、针对具体区块的图像，而不是微小的压缩拼板；应为区块或细节视图生成全新的独立图像，而不是裁剪旧图像；避免偷懒少生成图像；避免卡片套卡片再套卡片的 UI；并确保首屏主视觉简洁、宽敞、易读，且在小型笔记本电脑上清晰可见。"},{"id":"imagegen-frontend-mobile","name":"imagegen-frontend-mobile","path":"libraries/taste-skill/imagegen-frontend-mobile","original_path":"libraries/taste-skill/imagegen-frontend-mobile","tags":["image","docs","coding","workflow","frontend"],"description":"Elite mobile app image-generation skill for creating premium, app-native screen concepts and flows. Designed for iOS, Android, and cross-platform mobile products. Prioritizes clean hierarchy, comfortably readable text, strong multi-screen consistency, controlled color palettes, non-generic creative direction, textured surfaces, image-led composition, tasteful custom iconography, and clean phone mockup framing. By default, screens should be shown inside a subtle premium iPhone or similar phone mockup with a visible frame, while the main focus stays on the app content itself. This skill generates images only. It does not write code.","added_at":"2026-07-15","extracted_path":"extracted-skills/taste-skill/imagegen-frontend-mobile","description_zh":"用于创建高端、原生应用风格屏幕概念与流程的顶级移动应用图像生成技能。专为 iOS、Android 和跨平台移动产品设计。优先确保清晰的层级、舒适易读的文字、强大的多屏一致性、受控的配色方案、非通用的创意方向、富有质感的表面、图像主导的构图、雅致的自定义图标系统，以及简洁的手机样机框架。默认情况下，屏幕应展示在带有可见边框的低调高端 iPhone 或类似手机样机中，同时让应用内容本身始终成为视觉重点。本技能仅生成图像，不编写代码。"},{"id":"imagegen-frontend-web","name":"imagegen-frontend-web","path":"libraries/taste-skill/imagegen-frontend-web","original_path":"libraries/taste-skill/imagegen-frontend-web","tags":["image","docs","finance","coding","frontend"],"description":"Elite frontend image-direction skill for generating premium, conversion-aware website design references. CRITICAL OUTPUT RULE — generate ONE separate horizontal image FOR EVERY section. A landing page with 8 sections produces 8 images. Never compress multiple sections into one image. Enforces composition variety (not always left-text / right-image), background-image freedom, varied CTAs, varied hero scales (giant / mid / mini minimalist), narrative concept spine, second-read moments, and a single consistent palette across all images. Optimized for landing pages, marketing sites, and product comps that developers or coding models can accurately recreate.","added_at":"2026-07-15","extracted_path":"extracted-skills/taste-skill/imagegen-frontend-web","description_zh":"用于生成高端、兼顾转化的网站设计参考图的一流前端图像指导技能。关键输出规则——每个区块都要生成一张独立的横向图像。包含 8 个区块的落地页应生成 8 张图像。绝不能把多个区块压缩到一张图像中。强制要求构图多样性（不能总是左文右图）、自由使用背景图、多样化 CTA、多样化首屏尺度（巨型 / 中型 / 迷你极简）、贯穿始终的叙事概念主线、二次阅读亮点，以及所有图像使用同一套一致的配色。针对落地页、营销网站和产品设计稿进行优化，使开发者或编程模型能够准确复刻。"},{"id":"minimalist-ui","name":"minimalist-ui","path":"libraries/taste-skill/minimalist-skill","original_path":"libraries/taste-skill/minimalist-skill","tags":["browser","docs","coding","frontend"],"description":"Clean editorial-style interfaces. Warm monochrome palette, typographic contrast, flat bento grids, muted pastels. No gradients, no heavy shadows.","added_at":"2026-07-15","extracted_path":"extracted-skills/taste-skill/minimalist-ui","description_zh":"简洁的编辑风格界面。暖色单色调色板、鲜明的字体对比、扁平便当网格、柔和低饱和的粉彩色。不使用渐变，不使用厚重阴影。"},{"id":"full-output-enforcement","name":"full-output-enforcement","path":"libraries           <h4 class="review-title">${t("reviews")}</h4>
          ${record.reviews.map((review) => `
            <a class="review-link" href="${REPO_URL}/blob/main/docs/reviews/${encodeURIComponent(review.slug)}.md" target="_blank" rel="noreferrer">
              <span>${escapeHtml(review.title)}</span>
              <span class="review-meta">${escapeHtml(review.type_label)} →</span>
            </a>
          `).join("")}
        </section>
      ` : "";
      panel.innerHTML = `${notice}<pre class="skill-content"></pre>${reviews}`;
      setContentLanguage(panel);
    }

    function closeDrawer() {
      el("drawer").classList.remove("open");
      el("drawer").setAttribute("aria-hidden", "true");
      state.selected = null;
    }

    function render() {
      const projects = sortProjects(data.projects.filter(matches));
      renderCategories();
      renderProjects(projects);
      el("resultMeta").textContent = state.query || state.category !== "all"
        ? `${projects.length} / ${data.summary.project_count} ${t("projects")}`
        : `${data.summary.project_count} ${t("projects")} · ${data.summary.skill_count} skills`;
      document.querySelectorAll(".segment").forEach((button) => {
        button.classList.toggle("active", button.dataset.view === state.view);
      });
    }

    function applyLanguage() {
      const zh = state.language === "zh";
      const expandedSkills = [...document.querySelectorAll('[data-skill-path][aria-expanded="true"]')]
        .map((button) => button.dataset.skillPath);
      document.documentElement.lang = zh ? "zh-CN" : "en";
      document.title = zh ? "Skills-Hub - Agent Skills 目录" : "Skills-Hub - Agent Skills Directory";
      el("brandMeta").textContent = t("brandMeta");
      el("searchInput").placeholder = t("search");
      el("clearSearch").title = el("clearSearch").ariaLabel = t("clear");
      document.querySelectorAll(".language-toggle, #languageToggle").forEach((button) => {
        button.textContent = zh ? "EN" : "中";
        button.ariaLabel = zh ? "Switch to English" : "切换到中文";
      });
      el("docsLink").textContent = t("docs");
      el("githubLink").textContent = t("github");
      el("filterTitle").textContent = t("filter");
      el("catalogTitle").textContent = t("title");
      el("catalogCopy").textContent = t("intro");
      el("gridView").textContent = t("grid");
      el("listView").textContent = t("list");
      el("sortName").textContent = t("sortName");
      el("sortSkills").textContent = t("sortSkills");
      el("sortUpdated").textContent = t("sortUpdated");
      el("sidebar").ariaLabel = t("filters");
      el("viewModes").ariaLabel = t("viewModes");
      el("sortSelect").ariaLabel = t("sort");
      el("drawerPanel").ariaLabel = t("projectDetails");
      el("closeDrawer").title = el("closeDrawer").ariaLabel = t("close");
      render();
      if (state.selected) {
        renderDrawer(data.projects.find((project) => project.id === state.selected));
        document.querySelectorAll("[data-skill-path]").forEach((button) => {
          if (expandedSkills.includes(button.dataset.skillPath)) button.click();
        });
      }
    }

    document.addEventListener("click", async (event) => {
      const skillButton = event.target.closest("[data-skill-path]");
      if (skillButton) {
        const panel = el(skillButton.dataset.panelId);
        if (!panel.hidden) {
          panel.hidden = true;
          skillButton.textContent = t("viewContent");
          skillButton.setAttribute("aria-expanded", "false");
          return;
        }
        skillButton.textContent = t("loading");
        skillButton.disabled = true;
        try {
          const docs = await loadSkillContent();
          const record = docs[skillButton.dataset.skillPath];
          if (!record) throw new Error("missing content");
          renderSkillPanel(panel, record);
          panel.hidden = false;
          skillButton.textContent = t("collapseContent");
          skillButton.setAttribute("aria-expanded", "true");
        } catch {
          skillButton.textContent = t("loadFailed");
        } finally {
          skillButton.disabled = false;
        }
        return;
      }
      const category = event.target.closest("[data-category]");
      if (category) {
        state.category = category.dataset.category;
        render();
        return;
      }
      const projectButton = event.target.closest("[data-project-id]");
      if (projectButton) {
        renderDrawer(data.projects.find((project) => project.id === projectButton.dataset.projectId));
      }
    });

    el("searchInput").addEventListener("input", (event) => {
      state.query = event.target.value;
      render();
    });
    el("clearSearch").addEventListener("click", () => {
      state.query = "";
      el("searchInput").value = "";
      render();
    });
    el("sortSelect").addEventListener("change", (event) => {
      state.sort = event.target.value;
      render();
    });
    document.querySelectorAll(".language-toggle, #languageToggle").forEach((button) => {
      button.addEventListener("click", () => {
        state.language = state.language === "zh" ? "en" : "zh";
        localStorage.setItem("skill-hub-language", state.language);
        applyLanguage();
      });
    });
    document.querySelectorAll(".segment").forEach((button) => {
      button.addEventListener("click", () => {
        state.view = button.dataset.view;
        render();
      });
    });
    el("closeDrawer").addEventListener("click", closeDrawer);
    el("drawerBackdrop").addEventListener("click", closeDrawer);
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") closeDrawer();
    });

    applyLanguage();
  </script>
</body>
</html>
