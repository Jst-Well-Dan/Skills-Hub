<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="浏览、筛选并直达优质 Agent Skills 的开源目录。">
  <title>Skills-Hub - Agent Skills 目录</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,ital,wght@9..144,0,700;9..144,1,700&family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#0F1A14;--paper:#F4EFE6;--line:#E8E0D1;--grid:#EDE7DA;--orange:#D86C3A;--moss:#3A7D6B;--muted:#6B7A74;--cream:#FFFFFF;--sans:Inter,sans-serif;--mono:IBM Plex Mono,monospace;--display:Fraunces,serif;--ease:cubic-bezier(.16,1,.3,1)}
    *{box-sizing:border-box}body{margin:0;min-width:320px;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;padding-bottom:0}
    body.admin-b2{padding-bottom:86px}
    a{color:inherit;text-decoration:none}button,input,select{font:inherit}:focus-visible{outline:2px solid var(--orange);outline-offset:3px}
    .topbar{position:sticky;top:0;z-index:30;border-bottom:1px solid var(--line);background:color-mix(in srgb, var(--paper) 96%, white);backdrop-filter:blur(10px)}
    .topbar-inner{max-width:1240px;margin:0 auto;padding:12px 24px;display:grid;grid-template-columns:220px minmax(280px,1fr) auto;gap:16px;align-items:center}
    .brand{display:flex;align-items:center;gap:12px;min-width:0}
    .mark{width:32px;height:32px;border:1.4px solid var(--ink);background:var(--cream);color:var(--ink);display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:13px}
    .brand-title{margin:0;color:var(--ink);font-size:16px;font-weight:700;letter-spacing:-.02em}
    .brand-meta{margin-top:1px;color:var(--muted);font-family:var(--mono);font-size:11px;letter-spacing:.08em}
    .search-box{position:relative;min-width:0}
    .search-box input{width:100%;height:40px;padding:0 40px 0 38px;border:1px solid var(--line);background:var(--cream);color:var(--ink);outline:none}
    .search-box input::placeholder{color:var(--muted)}
    .search-box input:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(216,108,58,.12)}
    .search-icon,.clear-search{position:absolute;top:50%;transform:translateY(-50%);color:var(--muted)}
    .search-icon{left:12px}.clear-search{right:6px;width:28px;height:28px;border:0;background:transparent;cursor:pointer}
    .clear-search:hover{color:var(--orange)}
    .actions{display:flex;align-items:center;gap:8px}
    .nav-link{min-height:36px;padding:0 12px;border:1px solid var(--line);background:var(--cream);color:var(--ink);font-family:var(--mono);font-size:12px;letter-spacing:.04em;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center}
    .nav-link:hover{border-color:var(--ink)}
    .icon-button{width:36px;height:36px;border:1px solid var(--line);background:var(--cream);display:grid;place-items:center;cursor:pointer;color:var(--ink)}
    /* admin bar B2 dual-mode */
    .admin-bar{display:none;position:sticky;top:56px;z-index:29;background:var(--ink);color:var(--paper);border-bottom:1px solid var(--ink);padding:0;justify-content:center}
    .admin-bar.open{display:flex}
    .admin-bar-inner{max-width:1240px;width:100%;margin:0 auto;padding:10px 24px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
    .admin-bar-left{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
    .admin-bar strong{color:var(--paper);font-family:var(--mono);font-size:11px;letter-spacing:.08em;font-weight:600}
    .admin-hint{color:rgba(244,239,230,.72);font-family:var(--mono);font-size:11px;line-height:1.4}
    .segmented{display:inline-grid;grid-auto-flow:column;gap:3px;padding:3px;background:rgba(244,239,230,.14);border-radius:9px}
    .segment{min-width:84px;height:30px;padding:0 14px;border:0;border-radius:7px;background:transparent;color:rgba(244,239,230,.72);cursor:pointer;font-family:var(--mono);font-size:11px;transition:all .18s var(--ease)}
    .segment.active{background:var(--cream);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.18)}
    .segment:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
    .admin-chip{min-height:36px;padding:0 12px;border:1px solid var(--line);background:var(--cream);color:var(--ink);font-family:var(--mono);font-size:12px;cursor:pointer;transition:border-color .15s var(--ease), background .15s var(--ease), color .15s var(--ease)}
    .admin-bar .admin-chip{background:transparent;border-color:rgba(244,239,230,.22);color:var(--paper)}
    .admin-bar .admin-chip option{color:var(--ink);background:var(--cream)}
    .admin-bar .admin-chip:hover{border-color:var(--paper);background:rgba(244,239,230,.08)}
    .admin-bar .admin-chip:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
    .admin-chip:hover{border-color:var(--ink);background:var(--paper)}
    .admin-chip:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
    .admin-chip:active{background:var(--grid)}
    .admin-chip:disabled{opacity:.45;cursor:not-allowed}
    .admin-chip.primary{background:var(--orange);color:white;border-color:var(--orange)}
    .admin-chip.primary:hover{background:#C45A2A;border-color:#C45A2A}
    .admin-bar .admin-chip.primary{background:var(--orange);border-color:var(--orange);color:white}
    .admin-bar .admin-chip.primary:hover{background:#C45A2A;border-color:#C45A2A}
    .layout{max-width:1240px;margin:0 auto;padding:28px 24px 48px;display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px}
    .sidebar{align-self:start;position:sticky;top:72px}
    body.admin-b2 .sidebar{top:110px}
    .filter-panel{border:1px solid var(--line);background:var(--cream)}
    .filter-head{padding:11px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
    .filter-title{margin:0;font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--ink)}
    .filter-list{display:grid}
    .facet{width:100%;min-height:38px;padding:9px 12px;border:0;border-bottom:1px solid var(--grid);background:var(--cream);display:flex;justify-content:space-between;gap:8px;align-items:center;text-align:left;cursor:pointer;color:var(--ink);font-size:13px}
    .facet:hover{background:var(--paper)}
    .facet.active{background:var(--ink);color:white}
    .facet.active .count{background:rgba(255,255,255,.15);color:white;border-color:rgba(255,255,255,.2)}
    .count{min-width:22px;padding:2px 6px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--muted);font-family:var(--mono);font-size:11px;text-align:center}
    .facet.drag-over{background:rgba(216,108,58,.08);outline:2px dashed var(--orange);outline-offset:-2px}
    .facet-row{display:contents}
    .mode-organize .facet-row{display:flex;align-items:center;gap:0;border-bottom:1px solid var(--grid)}
    .mode-organize .facet-row .facet{flex:1;border-bottom:0}
    .facet-actions{display:none;gap:6px;align-items:center;padding:4px 6px 4px 0}
    .mode-organize .facet-actions{display:inline-flex}
    .facet-actions button{min-height:28px;padding:0 8px;border:1px solid var(--ink);background:var(--paper);color:var(--ink);font-family:var(--mono);font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap}
    .facet-actions button:hover{background:var(--ink);color:var(--paper);border-color:var(--ink)}
    .facet-actions button[data-act="delete"]{border-color:var(--orange);color:var(--orange)}
    .facet-actions button[data-act="delete"]:hover{background:var(--orange);color:white;border-color:var(--orange)}
    .facet-actions button:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
    .workspace{min-width:0;display:grid;gap:16px}
    .catalog-intro{position:relative;overflow:hidden;background:var(--paper);border:1px solid var(--line);padding:20px 18px 16px}
    .catalog-intro::before{content:"";position:absolute;width:220px;height:220px;left:-40px;bottom:-60px;border:1px solid rgba(58,125,107,.18);border-radius:50%;pointer-events:none}
    .catalog-intro::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg, transparent 30%, var(--paper) 92%);pointer-events:none}
    .catalog-intro>*{position:relative;z-index:1}
    .catalog-title{margin:0;font-family:var(--display);font-size:30px;line-height:1.1;letter-spacing:-.03em;color:var(--ink)}
    .catalog-title i{font-style:italic;color:var(--orange)}
    .catalog-copy{margin:8px 0 0;max-width:65ch;color:var(--muted);font-size:13px;line-height:1.6}
    .toolbar{padding:10px 0 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .toolbar-actions{display:flex;align-items:center;gap:8px}
    .sort-select{height:36px;border:1px solid var(--line);background:var(--cream);color:var(--ink);padding:0 10px;font-family:var(--mono);font-size:12px}
    .result-meta{color:var(--ink);font-family:var(--mono);font-size:12px;letter-spacing:.06em}
    .project-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
    .project-list{display:grid;grid-template-columns:1fr;gap:10px}
    .project-card{position:relative;border:1px solid var(--line);background:var(--cream);overflow:hidden;transition:transform .16s var(--ease), box-shadow .16s var(--ease)}
    .project-card:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(15,26,20,.08)}
    .project-card.selected{outline:2px solid var(--ink);outline-offset:-2px}
    .project-card.dragging{opacity:.55;transform:rotate(.6deg);box-shadow:0 12px 24px rgba(15,26,20,.18)}
    .project-card.has-check .project-main{padding-left:44px}
    .admin-check-wrap{position:absolute;top:0;left:0;width:44px;height:44px;display:grid;place-items:center;z-index:5;cursor:pointer}
    .admin-checkbox{width:18px;height:18px;accent-color:var(--ink);cursor:pointer;margin:0}
    .stamp{position:absolute;top:10px;right:10px;transform:rotate(7deg);border:1.6px solid var(--orange);color:var(--orange);font-family:var(--mono);font-size:10px;letter-spacing:.12em;padding:3px 6px;opacity:.9;pointer-events:none}
    .project-main{width:100%;border:0;background:transparent;color:inherit;padding:16px 16px 12px;text-align:left;cursor:pointer;display:grid;gap:8px}
    .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--moss);display:flex;gap:6px;align-items:center}
    .eyebrow::before{content:"\25C9";color:var(--orange);font-size:9px}
    .project-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start}
    .project-name{margin:0;color:var(--ink);font-size:16px;line-height:1.25;font-weight:700;overflow-wrap:anywhere}
    .badge{display:inline-flex;align-items:center;min-height:22px;padding:3px 7px;border:1px solid var(--line);background:var(--paper);color:var(--muted);font-family:var(--mono);font-size:11px;white-space:nowrap}
    .description{margin:0;color:var(--muted);line-height:1.6;font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:42px}
    .project-foot{padding:0 16px 14px;display:flex;justify-content:space-between;gap:12px;align-items:center;border-top:1px dashed var(--line);margin:0 16px;padding-top:10px;font-family:var(--mono);font-size:11px;color:var(--muted)}
    .card-tags{display:flex;gap:6px;flex-wrap:wrap}
    .card-tags span{padding:3px 6px;border:1px solid var(--line);background:var(--paper);font-size:11px}
    .gh-icon{width:32px;height:32px;border:1px solid var(--line);background:var(--cream);display:grid;place-items:center;color:var(--ink);flex:0 0 auto;transition:border-color .15s var(--ease), background .15s var(--ease), color .15s var(--ease)}
    .gh-icon:hover{border-color:var(--ink);background:var(--paper);color:var(--orange)}
    .gh-icon.small{width:28px;height:28px}
    .gh-icon svg{width:18px;height:18px;fill:currentColor;display:block}
    .gh-icon.small svg{width:14px;height:14px}
    .gh-icon--topbar{width:36px;height:36px}
    .gh-icon--topbar svg{width:18px;height:18px}
    .empty{border:1px dashed var(--line);background:var(--cream);padding:32px;text-align:center;color:var(--muted)}
    .drawer{position:fixed;inset:0;z-index:40;pointer-events:none}
    .drawer.open{pointer-events:auto}
    .drawer-backdrop{position:absolute;inset:0;background:rgba(15,26,20,.24);opacity:0;transition:opacity .18s}
    .drawer.open .drawer-backdrop{opacity:1}
    .drawer-panel{position:absolute;top:0;right:0;width:min(760px,100vw);height:100%;background:var(--paper);border-left:1px solid var(--ink);transform:translateX(100%);transition:transform .2s var(--ease);display:grid;grid-template-rows:auto 1fr}
    .drawer.open .drawer-panel{transform:translateX(0)}
    .drawer-head{padding:18px;border-bottom:1px solid var(--line);background:var(--cream);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px}
    .drawer-head-actions{display:flex;gap:8px;align-items:center}
    .drawer-title{margin:0;color:var(--ink);font-family:var(--display);font-size:26px;line-height:1.2}
    .drawer-body{overflow:auto;padding:18px;display:grid;gap:16px;align-content:start}
    .detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .detail{border-bottom:1px solid var(--line);padding:10px 0}
    .detail-label{color:var(--muted);font-family:var(--mono);font-size:11px;letter-spacing:.08em;margin-bottom:4px}
    .detail-value{font-size:13px;overflow-wrap:anywhere}
    .section-title{margin:0;font-family:var(--display);font-size:18px}
    .skill-list{display:grid;gap:8px}
    .skill-item{border:1px solid var(--line);background:var(--cream);padding:12px;display:grid;gap:6px}
    .skill-name{font-weight:700;color:var(--ink)}
    .skill-description{margin:0;color:var(--muted);font-size:13px;line-height:1.6}
    .links{display:flex;gap:8px;flex-wrap:wrap}
    .text-link{border:0;background:transparent;color:var(--orange);font-family:var(--mono);font-size:12px;font-weight:600;cursor:pointer}
    .skill-panel{margin-top:6px;padding-top:10px;border-top:1px solid var(--line);display:grid;gap:10px}
    .skill-panel[hidden]{display:none}
    .skill-content{margin:0;max-height:520px;overflow:auto;padding:12px;border:1px solid var(--line);background:var(--paper);font:12px/1.65 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere}
    .related-reviews{padding-top:10px;border-top:1px solid var(--line);display:grid;gap:2px}
    .review-title{margin:0 0 6px;color:var(--ink);font-family:var(--display);font-size:16px}
    .review-link{min-height:40px;padding:8px 0;display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid var(--line);color:var(--ink);font-weight:600}
    .review-meta{color:var(--muted);font-family:var(--mono);font-size:11px;white-space:nowrap}
    #languageToggle,#drawerLanguageToggle{display:none !important}
    /* bottom dock B2 - floating card */
    .bottom-dock{position:fixed;left:50%;bottom:20px;z-index:45;background:var(--cream);border:1px solid var(--ink);border-radius:16px;box-shadow:0 20px 40px rgba(15,26,20,.18), 0 4px 12px rgba(15,26,20,.10);transform:translateX(-50%) translateY(calc(100% + 28px)) scale(.97);opacity:0;transition:transform .36s var(--ease), opacity .28s var(--ease);display:flex;align-items:center;gap:10px;padding:14px 16px;flex-wrap:wrap;width:min(760px, calc(100vw - 32px));max-width:92vw;pointer-events:none}
    .bottom-dock.open{transform:translateX(-50%) translateY(0) scale(1);opacity:1;pointer-events:auto}
    .bottom-dock::before{content:"";position:absolute;top:6px;left:50%;transform:translateX(-50%);width:36px;height:4px;border-radius:999px;background:var(--line);opacity:.9}
    .bottom-dock strong{font-family:var(--mono);font-size:12px}
    .bottom-dock .hint{font-family:var(--mono);font-size:11px;color:var(--muted)}
    .bottom-dock input[type="text"]{height:36px;border:1px solid var(--line);background:var(--cream);padding:0 10px;font-family:var(--mono);font-size:12px;min-width:200px;flex:1}
    .bottom-dock select{height:36px;border:1px solid var(--line);background:var(--cream);padding:0 8px;font-family:var(--mono);font-size:12px}
    .flash{animation:flash .9s var(--ease)}
    @keyframes flash{0%{background:rgba(216,108,58,.18)}100%{background:var(--cream)}}
    .admin-modal{position:fixed;inset:0;z-index:50;display:none;place-items:center;background:rgba(15,26,20,.38);padding:16px}
    .admin-modal.open{display:grid}
    .admin-modal-box{width:min(440px,92vw);background:var(--cream);border:1px solid var(--ink);padding:20px;display:grid;gap:14px}
    .admin-modal-box h3{margin:0;font-family:var(--sans);font-size:16px;font-weight:700;color:var(--ink)}
    .admin-modal-box input{height:40px;border:1px solid var(--line);background:var(--paper);padding:0 12px;color:var(--ink);font-family:var(--sans);font-size:13px}
    .admin-modal-box input:focus{border-color:var(--ink);outline:2px solid rgba(216,108,58,.18);outline-offset:0}
    .admin-modal-actions{display:flex;gap:8px;justify-content:flex-end}
    @media(max-width:980px){.topbar-inner{grid-template-columns:1fr auto}.search-box{grid-column:1 / -1;order:3}.layout{display:flex;flex-direction:column;gap:18px}.layout .sidebar{order:2;position:static}.workspace{display:contents}.catalog-intro{order:1}.toolbar{order:3}.project-grid,.project-list{order:4;grid-template-columns:1fr}.filter-panel{display:flex;align-items:center;gap:10px}.filter-head{flex:0 0 auto;border:0;padding:0 8px}.filter-list{display:flex;flex:1;min-width:0;gap:6px;overflow:auto;padding-bottom:4px}.facet{flex:0 0 auto;white-space:nowrap}.mode-organize .facet-row{flex:0 0 auto;border-bottom:0;border-right:1px solid var(--grid)}}
    @media(max-width:680px){.topbar-inner,.layout{padding-left:14px;padding-right:14px}.catalog-title{font-size:26px}.bottom-dock{bottom:12px;padding:12px 14px;border-radius:14px;width:calc(100vw - 16px);max-width:calc(100vw - 16px)}}
    @media(prefers-reduced-motion:reduce){.drawer-panel,.bottom-dock,.project-card{transition:none}.bottom-dock{transform:translateX(-50%) translateY(calc(100% + 28px));opacity:0}.bottom-dock.open{transform:translateX(-50%) translateY(0);opacity:1}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#" aria-label="Skills-Hub">
        <div class="mark" aria-hidden="true"><svg viewBox="0 0 32 32" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="7" width="20" height="5.5" rx="1.1"/><rect x="6" y="13.2" width="20" height="5.5" rx="1.1"/><rect x="6" y="19.5" width="20" height="5.5" rx="1.1"/><path d="M10 9.7h3M10 16h5.5M10 22.2h7" opacity=".85"/></svg></div>
        <div>
          <h1 class="brand-title">Skills-Hub</h1>
          <div class="brand-meta" id="brandMeta">CATALOG</div>
        </div>
      </a>
      <div class="search-box">
        <span class="search-icon">⌕</span>
        <input id="searchInput" type="search" placeholder="搜索项目或 skill" autocomplete="off">
        <button class="clear-search" id="clearSearch" title="清空搜索" aria-label="清空搜索">×</button>
      </div>
      <div class="actions">
        <button class="nav-link" id="languageToggle" type="button">EN</button>
        <a class="gh-icon gh-icon--topbar" id="githubLink" href="https://github.com/Jst-Well-Dan/Skills-Hub" target="_blank" rel="noreferrer" aria-label="Skills-Hub 本体仓库" title="Skills-Hub 本体仓库（GitHub）"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg></a>
      </div>
    </div>
  </header>
  <div class="admin-bar" id="adminBar" role="tablist" aria-label="管理模式">
    <div class="admin-bar-inner">
      <div class="admin-bar-left">
        <strong>ADMIN 模式</strong>
        <div class="segmented" id="modeSwitch">
          <button class="segment active" data-mode="organize" role="tab" aria-selected="true">整理模式</button>

st this app/site/platform\", or review the quality of a web application. Produces a structured report with full reproduction evidence -- step-by-step screenshots, repro videos, and detailed repro steps for every issue -- so findings can be handed directly to the responsible teams.","added_at":"2026-05-17","extracted_path":"extracted-skills/agent-browser/dogfood","description_zh":"系统化探索并测试 Web 应用程序，以发现缺陷、用户体验问题及其他问题。当用户要求“dogfood”“QA”“探索性测试”“查找问题”“缺陷搜寻”“测试此应用/网站/平台”或评审 Web 应用程序质量时使用。生成包含完整复现证据的结构化报告——包括分步截图、复现视频，以及每个问题的详细复现步骤——以便将发现直接移交给负责团队。"},{"id":"electron","name":"electron","path":"libraries/agent-browser/skill-data/electron","original_path":"skill-data/electron","tags":["browser","docs","coding","data","frontend"],"description":"Automate Electron desktop apps (VS Code, Slack, Discord, Figma, Notion, Spotify, etc.) using agent-browser via Chrome DevTools Protocol. Use when the user needs to interact with an Electron app, automate a desktop app, connect to a running app, control a native app, or test an Electron application. Triggers include \"automate Slack app\", \"control VS Code\", \"interact with Discord app\", \"test this Electron app\", \"connect to desktop app\", or any task requiring automation of a native Electron application.","added_at":"2026-05-17","extracted_path":"extracted-skills/agent-browser/electron","description_zh":"使用 agent-browser 通过 Chrome DevTools Protocol 自动化 Electron 桌面应用（VS Code、Slack、Discord、Figma、Notion、Spotify 等）。当用户需要与 Electron 应用交互、自动化桌面应用、连接到正在运行的应用、控制原生应用或测试 Electron 应用程序时使用。触发场景包括“自动化 Slack 应用”“控制 VS Code”“与 Discord 应用交互”“测试此 Electron 应用”“连接到桌面应用”，或任何需要自动化原生 Electron 应用程序的任务。"},{"id":"slack","name":"slack","path":"libraries/agent-browser/skill-data/slack","original_path":"skill-data/slack","tags":["browser","docs","coding","data","frontend"],"description":"Interact with Slack workspaces using browser automation. Use when the user needs to check unread channels, navigate Slack, send messages, extract data, find information, search conversations, or automate any Slack task. Triggers include \"check my Slack\", \"what channels have unreads\", \"send a message to\", \"search Slack for\", \"extract from Slack\", \"find who said\", or any task requiring programmatic Slack interaction.","added_at":"2026-05-17","extracted_path":"extracted-skills/agent-browser/slack","description_zh":"使用浏览器自动化与 Slack 工作区交互。当用户需要检查未读频道、浏览 Slack、发送消息、提取数据、查找信息、搜索对话或自动执行任何 Slack 任务时使用。触发语句包括“检查我的 Slack”“哪些频道有未读消息”“向……发送消息”“在 Slack 中搜索……”“从 Slack 提取……”“查找是谁说的……”，或任何需要以编程方式与 Slack 交互的任务。"},{"id":"vercel-sandbox","name":"vercel-sandbox","path":"libraries/agent-browser/skill-data/vercel-sandbox","original_path":"skill-data/vercel-sandbox","tags":["browser","docs","coding","data","cli"],"description":"Run agent-browser + Chrome inside Vercel Sandbox microVMs for browser automation from any Vercel-deployed app. Use when the user needs browser automation in a Vercel app (Next.js, SvelteKit, Nuxt, Remix, Astro, etc.), wants to run headless Chrome without binary size limits, needs persistent browser sessions across commands, or wants ephemeral isolated browser environments. Triggers include \"Vercel Sandbox browser\", \"microVM Chrome\", \"agent-browser in sandbox\", \"browser automation on Vercel\", or any task requiring Chrome in a Vercel Sandbox.","added_at":"2026-05-17","extracted_path":"extracted-skills/agent-browser/vercel-sandbox","description_zh":"在 Vercel Sandbox microVM 中运行 agent-browser + Chrome，以便从任何部署到 Vercel 的应用执行浏览器自动化。当用户需要在 Vercel 应用（Next.js、SvelteKit、Nuxt、Remix、Astro 等）中实现浏览器自动化、希望运行不受二进制文件大小限制的无头 Chrome、需要在多条命令之间保持浏览器会话，或需要临时隔离的浏览器环境时使用。触发词包括 \"Vercel Sandbox browser\"、\"microVM Chrome\"、\"agent-browser in sandbox\"、\"browser automation on Vercel\"，或任何需要在 Vercel Sandbox 中使用 Chrome 的任务。"},{"id":"agent-browser","name":"agent-browser","path":"libraries/agent-browser/skills/agent-browser","original_path":"skills/agent-browser","tags":["browser","docs","coding","data","cli"],"description":"Browser automation CLI for AI agents. Use when the user needs to interact with websites, including navigating pages, filling forms, clicking buttons, taking screenshots, extracting data, testing web apps, or automating any browser task. Triggers include requests to \"open a website\", \"fill out a form\", \"click a button\", \"take a screenshot\", \"scrape data from a page\", \"test this web app\", \"login to a site\", \"automate browser actions\", or any task requiring programmatic web interaction. Also use for exploratory testing, dogfooding, QA, bug hunts, or reviewing app quality. Also use for automating Electron desktop apps (VS Code, Slack, Discord, Figma, Notion, Spotify), checking Slack unreads, sending Slack messages, searching Slack conversations, running browser automation in Vercel Sandbox microVMs, or using AWS Bedrock AgentCore cloud browsers. Prefer agent-browser over any built-in browser automation or web tools.","added_at":"2026-05-17","extracted_path":"extracted-skills/agent-browser/agent-browser","description_zh":"面向 AI 智能体的浏览器自动化 CLI。当用户需要与网站交互时使用，包括浏览页面、填写表单、点击按钮、截取屏幕截图、提取数据、测试 Web 应用或自动执行任何浏览器任务。触发场景包括“打开网站”“填写表单”“点击按钮”“截取屏幕截图”“从页面抓取数据”“测试此 Web 应用”“登录网站”“自动执行浏览器操作”，或任何需要以编程方式与 Web 交互的任务。也可用于探索性测试、内部试用、QA、缺陷排查或评审应用质量。还可用于自动化 Electron 桌面应用（VS Code、Slack、Discord、Figma、Notion、Spotify）、检查 Slack 未读消息、发送 Slack 消息、搜索 Slack 对话、在 Vercel Sandbox microVMs 中运行浏览器自动化，或使用 AWS Bedrock AgentCore 云浏览器。优先使用 agent-browser，而不是任何内置的浏览器自动化或 Web 工具。"}],"install":{"method":"npx","extracted_root":"extracted-skills/agent-browser","command":"npx skills add vercel-labs/agent-browser","fallback":"extracted"},"extracted":{"root":"extracted-skills/agent-browser","source_library":"agent-browser","source_path":"libraries/agent-browser","last_extracted_commit":"6ede7a9470ac4b681cabf838af8668b9aa99e957","skill_count":7},"category":"coding-tools","description_zh":"agent-browser 收录了 7 个 Agent Skills。"},{"id":"agent-skills","name":"agent-skills","path":"libraries/agent-skills","source":{"type":"github"," ase 的 Postgres 性能优化与最佳实践。在编写、审查或优化 Postgres 查询、模式设计或数据库配置时使用此技能。"}],"install":{"method":"npx","extracted_root":"extracted-skills/agent-skills","command":"npx skills add supabase/agent-skills","fallback":"extracted"},"extracted":{"root":"extracted-skills/agent-skills","source_library":"agent-skills","source_path":"libraries/agent-skills","last_extracted_commit":"1ad9aaeb49caafd9e95c0a91116f71890eebbc53","skill_count":2},"category":"coding-tools","description_zh":"agent-skills 收录了 2 个 Agent Skills。"},{"id":"anthropic","name":"anthropic","path":"libraries/anthropic","source":{"type":"github","repo":"anthropics/skills","ref":"main","commit":"fa0fa64bdc967915dc8399e803be67759e1e62b8"},"tags":["automation","browser","coding","data","docs","frontend","image","mcp"],"description":"ALGORITHMIC PHILOSOPHY CREATION","added_at":"2026-05-17","last_checked_at":"2026-07-18","last_synced_at":"2026-07-18","skill_count":18,"skills":[{"id":"algorithmic-art","name":"algorithmic-art","path":"libraries/anthropic/skills/algorithmic-art","original_path":"skills/algorithmic-art","tags":["docs","coding","workflow"],"description":"Creating algorithmic art using p5.js with seeded randomness and interactive parameter exploration. Use this when users request creating art using code, generative art, algorithmic art, flow fields, or particle systems. Create original algorithmic art rather than copying existing artists' work to avoid copyright violations.","added_at":"2026-06-25","extracted_path":"extracted-skills/anthropic/algorithmic-art","description_zh":"使用 p5.js，通过带种子的随机性和交互式参数探索来创作算法艺术。当用户请求使用代码创作艺术、生成艺术、算法艺术、流场或粒子系统时使用此技能。应创作原创算法艺术，而不是复制现有艺术家的作品，以避免侵犯版权。"},{"id":"brand-guidelines","name":"brand-guidelines","path":"libraries/anthropic/skills/brand-guidelines","original_path":"skills/brand-guidelines","tags":["docs","coding","frontend"],"description":"Applies Anthropic's official brand colors and typography to any sort of artifact that may benefit from having Anthropic's look-and-feel. Use it when brand colors or style guidelines, visual formatting, or company design standards apply.","added_at":"2026-06-25","extracted_path":"extracted-skills/anthropic/brand-guidelines","description_zh":"将 Anthropic 的官方品牌色彩和字体应用于任何可受益于 Anthropic 外观与风格的制品。当涉及品牌色彩或风格指南、视觉格式或公司设计标准时使用此技能。"},{"id":"canvas-design","name":"canvas-design","path":"libraries/anthropic/skills/canvas-design","original_path":"skills/canvas-design","tags":["image","docs","coding","obsidian","pdf"],"description":"Create beautiful visual art in .png and .pdf documents using design philosophy. You should use this skill when the user asks to create a poster, piece of art, design, or other static piece. Create original visual designs, never copying existing artists' work to avoid copyright violations.","added_at":"2026-06-25","extracted_path":"extracted-skills/anthropic/canvas-design","description_zh":"运用设计哲学，在 .png 和 .pdf 文档中创作精美的视觉艺术。当用户要求创作海报、艺术作品、设计或其他静态作品时，应使用此技能。创作原创视觉设计，绝不复制现有艺术家的作品，以避免侵犯版权。"},{"id":"claude-api","name":"claude-api","path":"libraries/anthropic/skills/claude-api","original_path":"skills/claude-api","tags":["docs","coding","frontend","automation"],"description":"Reference for the Claude API / Anthropic SDK — model ids, pricing, params, streaming, tool use, MCP, agents, caching, token counting, model migration.\nTRIGGER — read BEFORE opening the target file; don't skip because it \"looks like a one-liner\" — whenever: the prompt names Claude/Anthropic in any form (Claude, Anthropic, Fable, Opus, Sonnet, Haiku, `anthropic`, `@anthropic-ai`, `claude-*`, `us.anthropic.*`, `[1m]`); the user asks about an LLM (pricing/model choice/limits/caching) — never answer from memory; OR the task is LLM-shaped with provider unstated (agent/MCP/tool-definition/multi-agent/RAG/LLM-judge/computer-use; generate/summarize/extract/classify/rewrite/converse over NL; debugging refusals/cutoffs/streaming/tool-calls/tokens).\nSKIP only when another provider is being worked on (overrides all triggers): OpenAI/GPT/Gemini/Llama/Mistral/Cohere/Ollama named in the query; OR `grep -rE 'openai|langchain_openai|google.generativeai|genai|mistralai|cohere|ollama'` over the project hits (run this grep FIRST if no provider named — don't Read the file).","added_at":"2026-05-17","extracted_path":"extracted-skills/anthropic/claude-api","description_zh":"Claude API / Anthropic SDK 参考资料——涵盖模型 ID、定价、参数、流式传输、工具使用、MCP、智能体、缓存、Token 计数和模型迁移。\n触发条件——在打开目标文件之前阅读；不要因为它“看起来只有一行”就跳过——适用于以下任何情况：提示以任何形式提及 Claude/Anthropic（Claude、Anthropic、Fable、Opus、Sonnet、Haiku、`anthropic`、`@anthropic-ai`、`claude-*`、`us.anthropic.*`、`[1m]`）；用户询问 LLM（定价/模型选择/限制/缓存）——绝不要凭记忆回答；或者任务具有 LLM 特征但未说明提供商（智能体/MCP/工具定义/多智能体/RAG/LLM 评判器/计算机使用；对自然语言进行生成/总结/提取/分类/改写/对话；调试拒绝/截断/流式传输/工具调用/Token）。\n仅在处理其他提供商时跳过（优先于所有触发条件）：查询中提及 OpenAI/GPT/Gemini/Llama/Mistral/Cohere/Ollama；或者对项目运行 `grep -rE 'openai|langchain_openai|google.generativeai|genai|mistralai|cohere|ollama'` 有匹配结果（如果未指定提供商，先运行此 grep——不要读取文件）。"},{"id":"doc-coauthoring","name":"doc-coauthoring","path":"libraries/anthropic/skills/doc-coauthoring","original_path":"skills/doc-coauthoring","tags":["docs","coding","workflow","frontend"],"description":"Guide users through a structured workflow for co-authoring documentation. Use when user wants to write documentation, proposals, technical specs, decision docs, or similar structured content. This workflow helps users efficiently transfer context, refine content through iteration, and verify the doc works for readers. Trigger when user mentions writing docs, creating proposals, drafting specs, or similar documentation tasks.","added_at":"2026-06-25","extracted_path":"extracted-skills/anthropic/doc-coauthoring","description_zh":"引导用户通过结构化工作流共同撰写文档。当用户希望编写文档、提案、技术规范、决策文档或类似的结构化内容时使用。此工作流帮助用户高效传递上下文、通过迭代完善内容，并验证文档对读者是否有效。当用户提到撰写文档、创建提案、起草规范或类似的文档任务时触发。"},{"id":"docx","name":"docx","path":"libraries/anthropic/skills/docx","original_path":"skills/docx","tags":["image","docs","coding","data","pdf"],"description":"Use this skill whenever the user wants to create, read, edit, or manipulate Word documents (.docx files) or Word templates (.dotx files). Triggers include: any mention of 'Word doc', 'word document', '.docx', '.dotx', or requests to produce professional documents with formatting like tables of contents, headings, page numbers, or letterheads. Also use when extracting or reorganizing content from .docx or .dotx files, inserting or replacing images in documents, performing find-and-replace in Word files, working with tracked changes or comments, or converting content into a polished Word document. If the user asks for a 'report', 'memo', 'letter', 'template', or similar deliverable as a Word or .docx file, use this skill. Do NOT use for PDFs, spreadsheets, Google Docs, or general coding tasks unrelated to document generation.","added_at":"2026-06-25","extracted_path":"extracted-skills/anthropic/docx","description_zh":"当用户想要创建、读取、编辑或处理 Word 文档（.docx 文件）或 Word 模板（.dotx 文件）时，请使用此技能。触发条件包括：任何对 'Word doc'、'word document'、'.docx'、'.dotx' 的提及，或要求制作带有目录、标题、页码、信头等格式的专业文档。还应在以下情况使用：从 .docx 或 .dotx 文件中提取或重新组织内容、在文档中插入或替换图片、在 Word 文件中执行查找和替换、处理修订或批注，或将内容转换为精美的 Word 文档。如果用户要求以 Word 或 .docx 文件形式交付 'report'、'memo'、'letter'、'template' 或类似成果，请使用此技能。不要将其用于 PDF、电子表格、Google Docs，或与文档生成无关的通用编码任务。"},{"id":"frontend-design","name":"frontend-design","path":"libraries/anthropic/skills/frontend-design","original_path":"skills/frontend-design","tags":["docs","coding","frontend"],"description":"Guidance for distinctive, intentional visual design when building new UI or reshaping an existing one. Helps with aesthetic direction, typography, and making choices that don't read as templated defaults.","added_at":"2026-06-25","extracted_path":"extracted-skills/anthropic/frontend-design","description_zh":"在构建新 UI 或重塑现有 UI 时，为打造独特且有明确意图的视觉设计提供指导。帮助确定美学方向、选择字体，并作出不会显得像模板默认方案的设计决策。"},{"id":"internal-comms","name":"internal-comms","path":"libraries/anthropic/skills/internal-comms","original_path":"skills/internal-comms","tags":["docs","coding"],"description":"A set of resources to help me write all kinds of internal communications, using the formats that my company likes to use. Claude should use this skill whenever asked to write some sort of internal communications (status reports, leadership updates, 3P updates, company newsletters, FAQs, incident reports, project updates, etc.).","added_at":"2026-06-25","extracted_path":"extracted-skills/anthropic/internal-comms","description_zh":"一套帮助我撰写各类内部沟通内容的资源，采用我公司惯用的格式。每当被要求撰写某种内部沟通内容（状态报告、管理层动态、3P 动态、公司简报、常见问题解答、事件报告、项目动态等）时，Claude 都应使用此技能。"},{"id":"mcp-builder","name":"mcp-builder","path":"libraries/anthropic/skills/mcp-builder","original_path":"skills/mcp-builder","tags":["docs","coding","mcp","frontend"],"description":"Guide for creating high-quality MCP (Model Context Protocol) servers that enable LLMs to interact with external services through well-designed tools. Use when building MCP servers to integrate external APIs or services, whether in Python (FastMCP) or Node/TypeScript (MCP SDK).","added_at":"2026-06-25","extracted_path":"extracted-skills/anthropic/mcp-builder","description_zh":"创建高质量 MCP（模型上下文协议）服务器的指南，使 LLM 能够通过精心设计的工具与外部服务交互。适用于构建 MCP 服务器以集成外部 API 或服务，无论使用 Python（FastMCP）还是 Node/TypeScript（MCP SDK）。"},{"id":"pdf","name":"pdf","path":"libraries/anthropic/skills/pdf","original_path":"skills/pdf","tags":["image","docs","coding","data","pdf"],"description":"Use this skill whenever the user wants to do anything with PDF files. This includes reading or extracting text/tables from PDFs, combining or merging multiple PDFs into one, splitting PDFs apart, rotating pages, adding watermarks, creating new PDFs, filling PDF forms, encrypting/decrypting PDFs, extracting images, and OCR on scanned PDFs to make them searchable. If the user mentions a .pdf file or asks to produce one, use this skill.","added_at":"2026-06-25","extracted_path":"extracted-skills/anthropic/pdf","description_zh":"每当用户想要对 PDF 文件执行任何操作时，都应使用此技能。这包括从 PDF 中读取或提取文本和表格、将多个 PDF 合并为一个、拆分 PDF、旋转页面、添加水印、创建新 PDF、填写 PDF 表单、加密或解密 PDF、提取图像，以及对扫描版 PDF 执行 OCR 以使其可搜索。如果用户提到 .pdf 文件或要求生成 PDF，请使用此技能。"},{"id":"pptx","name":"pptx","path":"libraries/anthropic/skills/pptx","original_path":"skills/pptx","tags":["docs","coding"],"description":"Use this skill any time a .pptx or .potx file is involved in any way — as input, output, or both. This includes: creating slide decks, pitch decks, or presentations; reading, parsing, or extracting text from any .pptx or .potx file (even if the extracted content will be used elsewhere, like in an email or summary); editing, modifying, or updating existing presentations; combining or splitting slide files; working with templates (.potx), layouts, speaker notes, or comments. Trigger whenever the user mentions \\\"deck,\\\" \\\"slides,\\\" \\\"presentation,\\\" or references a .pptx or .potx filename, regardless of what they plan to do with the content afterward. If a .pptx or .potx file needs to be opened, created, or touched, use this skill.","added_at":"2026-06-25","extracted_path":"extracted-skills/anthropic/pptx","description_zh":"只要以任何方式涉及 `.pptx` 或 `.potx` 文件——无论作为输入、输出还是两者兼有——都使用此技能。这包括：创建幻灯片、路演材料或演示文稿；读取、解析或提取任何 `.pptx` 或 `.potx` 文件中的文本（即使提取的内容随后会用于其他地方，例如电子邮件或摘要）；编辑、修改或更新现有演示文稿；合并或拆分幻灯片文件；处理模板（`.potx`）、版式、演讲者备注或评论。只要用户提到“deck”“slides”“presentation”，或引用 `.pptx` 或 `.potx` 文件名，无论之后计划如何处理其内容，都应触发此技能。如果需要打开、创建或改动 `.pptx` 或 `.potx` 文件，请使用此技能。"},{"id":"skill-creator","name":"skill-creator","path":"libraries/anthropic/skills/skill-creator","original_path":"skills/skill-creator","tags":["docs","coding"],"description":"Create new skills, modify and improve existing skills, and measure skill performance. Use when users want to create a skill from scratch, edit, or optimize an existing skill, run evals to test a skill, benchmark skill performance with variance analysis, or optimize a skill's description for better triggering accuracy.","added_at":"2026-06-25","extracted_path":"extracted-skills/anthropic/skill-creator","description_zh":"创建新技能、修改和改进现有技能，并衡量技能性能。当用户想从头创建技能、编辑或优化现有技能、运行 evals 来测试技能、通过方差分析对技能性能进行基准测试，或优化技能描述以提高触发准确率时使用。"},{"id":"slack-gif-creator","name":"slack-gif-creator","path":"libraries/anthropic/skills/slack-gif-creator","original_path":"skills/slack-gif-creator","tags":["image","docs","coding"],"description":"Knowledge and utilities for creating animated GIFs optimized for Slack. Provides constraints, validation tools, and animation concepts. Use when users request animated GIFs for Slack like \"make me a GIF of X doing Y for Slack.","added_at":"2026-06-25","extracted_path":"extracted-skills/anthropic/slack-gif-creator","description_zh":"用于创建针对 Slack 优化的动画 GIF 的知识和实用工具。提供约束条件、验证工具和动画概念。当用户请求为 Slack 制作动画 GIF 时使用，例如“为我制作一个 X 做 Y 的 GIF，用于 Slack。”"},{"id":"theme-factory","name":"theme-factory","path":"libraries/anthropic/skills/theme-factory","original_path":"skills/theme-factory","tags":["docs","coding"],"description":"Toolkit for styling artifacts with a theme. These artifacts can be slides, docs, reportings, HTML landing pages, etc. There are 10 pre-set themes with colors/fonts that you can apply to any artifact that has been creating, or can generate a new theme on-the-fly.","added_at":"2026-06-25","extracted_path":"extracted-skills/anthropic/theme-factory","description_zh":"使用主题为制品设置样式的工具包。这些制品可以是幻灯片、文档、报告、HTML 落地页等。内置 10 个带有颜色和字体的预设主题，可将其应用于任何已创建的制品，也可以即时生成新主题。"},{"id":"web-artifacts-builder","name":"web-artifacts-builder","path":"libraries/anthropic/skills/web-artifacts-builder","original_path":"skills/web-artifacts-builder","tags":["docs","coding","frontend"],"description":"Suite of tools for creating elaborate, multi-component claude.ai HTML artifacts using modern frontend web technologies (React, Tailwind CSS, shadcn/ui). Use for complex artifacts requiring state management, routing, or shadcn/ui components - not for simple single-file HTML/JSX artifacts.","added_at":"2026-06-25","extracted_path":"extracted-skills/anthropic/web-artifacts-builder","description_zh":"使用现代前端 Web 技术（React、Tailwind CSS、shadcn/ui）创建精美、多组件 claude.ai HTML 工件的工具套件。适用于需要状态管理、路由或 shadcn/ui 组件的复杂工件，不适用于简单的单文件 HTML/JSX 工件。"},{"id":"webapp-testing","name":"webapp-testing","path":"libraries/anthropic/skills/webapp-testing","original_path":"skills/webapp-testing","tags":["browser","docs","coding","frontend","automation"],"description":"Toolkit for interacting with and testing local web applications using Playwright. Supports verifying frontend functionality, debugging UI behavior, capturing browser screenshots, and viewing browser logs.","added_at":"2026-06-25","extracted_path":"extracted-skills/anthropic/webapp-testing","description_zh":"使用 Playwright 与本地 Web 应用程序交互并进行测试的工具包。支持验证前端功能、调试 UI 行为、捕获浏览器截图以及查看浏览器日志。"},{"id":"xlsx","name":"xlsx","path":"libraries/anthropic/skills/xlsx","original_path":"skills/xlsx","tags":["docs","coding","data"],"description":"Use this skill any time a spreadsheet file is the primary input or output. This means any task where the user wants to: open, read, edit, or fix an existing .xlsx, .xlsm, .xltx, .csv, or .tsv file (e.g., adding columns, computing formulas, formatting, charting, cleaning messy data); create a new spreadsheet from scratch or from other data sources; or convert between tabular file formats. Trigger especially when the user references a spreadsheet file by name or path — even casually (like \\\"the xlsx in my downloads\\\") — and wants something done to it or produced from it. Also trigger for cleaning or restructuring messy tabular data files (malformed rows, misplaced headers, junk data) into proper spreadsheets. The deliverable must be a spreadsheet file. Do NOT trigger when the primary deliverable is a Word document, HTML report, standalone Python script, database pipeline, or Google Sheets API integration, even if tabular data is involved.","added_at":"2026-06-25","extracted_path":"extracted-skills/anthropic/xlsx","description_zh":"当电子表格文件是主要输入或输出时，请使用此技能。这包括用户希望：打开、读取、编辑或修复现有的 .xlsx、.xlsm、.xltx、.csv 或 .tsv 文件（例如添加列、计算公式、设置格式、创建图表、清理杂乱数据）；从头创建新电子表格或基于其他数据源创建电子表格；或者在表格文件格式之间进行转换的任何任务。尤其是在用户提到电子表格文件的名称或路径时触发——即使只是随口提及（例如“下载目录里的那个 xlsx”）——并希望对其执行操作或基于它生成内容。对于将杂乱的表格数据文件（格式错误的行、错位的表头、垃圾数据）清理或重构为规范电子表格的任务，也应触发。交付物必须是电子表格文件。如果主要交付物是 Word 文档、HTML 报告、独立 Python 脚本、数据库管道或 Google Sheets API 集成，即使其中涉及表格数据，也不要触发。"},{"id":"template-skill","name":"template-skill","path":"libraries/anthropic/template","original_path":"template","tags":["docs","coding"],"description":"Replace with description of the skill and when Claude should use it.","added_at":"2026-06-25","extracted_path":"extracted-skills/anthropic/template-skill","description_zh":"请替换为该 skill 的说明，以及 Claude 应在何时使用它。"}],"install":{"method":"extracted","extracted_root":"extracted-skills/anthropic"},"extracted":{"root":"extracted-skills/anthropic","source_library":"anthropic","source_path":"libraries/anthropic","last_extracted_commit":"fa0fa64bdc967915dc8399e803be67759e1e62b8","skill_count":18},"category":"personal-collection","category_locked":true,"description_zh":"anthropic 收录了 18 个 Agent Skills。"},{"id":"baoyu-skills","name":"baoyu-skills","path":"libraries/baoyu-skills","source":{"type":"github","repo":"JimLiu/baoyu-skills","ref":"main","commit":"6b7a2e417500561a5ecdd0b168332f4142584617"},"tags":["browser","cli","coding","data","docs","frontend","image","workflow"],"description":"baoyu-skills","added_at":"2026-05-17","last_checked_at":"2026-07-18","last_synced_at":"2026-07-18","skill_count":21,"skills":[{"id":"baoyu-article-illustrator","name":"baoyu-article-illustrator","path":"libraries/baoyu-skills/skills/baoyu-article-illustrator","original_path":"skills/baoyu-article-illustrator","tags":["image","docs","coding","frontend"],"description":"Analyzes article structure, identifies positions requiring visual aids, generates illustrations with Type × Style × Palette three-dimension approach. Use when user asks to \"illustrate article\", \"add images\", \"generate images for article\", or \"为文章配图\".","added_at":"2026-05-17","version":"1.117.4","extracted_path":"extracted-skills/baoyu-skills/baoyu-article-illustrator","description_zh":"分析文章结构，识别需要视觉辅助的位置，并采用「类型 × 风格 × 配色」三维方法生成插图。当用户要求“为文章配图”“添加图片”“为文章生成图片”或“为文章配图”时使用。"},{"id":"baoyu-comic","name":"baoyu-comic","path":"libraries/baoyu-skills/skills/baoyu-comic","original_path":"skills/baoyu-comic","tags":["image","docs","coding"],"description":"Knowledge comic creator supporting multiple art styles and tones. Creates original educational comics with detailed panel layouts and batch-capable image generation. Use when user asks to create \"知识漫画\", \"教育漫画\", \"biography comic\", \"tutorial comic\", or \"Logicomix-style comic\".","added_at":"2026-05-17","version":"1.117.4","extracted_path":"extracted-skills/baoyu-skills/baoyu-comic","description_zh":"支持多种艺术风格与基调的知识漫画创作工具。可创作原创教育漫画，提供详细的分镜布局，并支持批量生成图像。当用户要求创作“知识漫画”“教育漫画”“biography comic”“tutorial comic”或“Logicomix-style comic”时使用。"},{"id":"baoyu-compress-image","name":"baoyu-compress-image","path":"libraries/baoyu-skills/skills/baoyu-compress-image","original_path":"skills/baoyu-compress-image","tags":["image","docs","coding"],"description":"Compresses images to WebP (default) or PNG with automatic tool selection. Use when user asks to \"compress image\", \"optimize image\", \"convert to webp\", or reduce image file size.","added_at":"2026-05-17","version":"1.56.1","extracted_path":"extracted-skills/baoyu-skills/baoyu-compress-image","description_zh":"使用自动工具选择将图像压缩为 WebP（默认）或 PNG。当用户要求“压缩图像”“优化图像”“转换为 webp”或减小图像文件大小时使用。"},{"id":"baoyu-cover-image","name":"baoyu-cover-image","path":"libraries/baoyu-skills/skills/baoyu-cover-image","original_path":"skills/baoyu-cover-image","tags":["image","docs","coding"],"description":"Generates article cover images with 5 dimensions (type, palette, rendering, text, mood) combining 11 color palettes and 7 rendering styles. Supports cinematic (2.35:1), widescreen (16:9), and square (1:1) aspects. Use when user asks to \"generate cover image\", \"create article cover\", or \"make cover\".","added_at":"2026-05-17","version":"1.117.5","extracted_path":"extracted-skills/baoyu-skills/baoyu-cover-image","description_zh":"通过 5 个维度（类型、配色、渲染、文本、氛围）生成文章封面图，组合使用 11 种配色方案和 7 种渲染风格。支持电影画幅（2.35:1）、宽屏（16:9）和正方形（1:1）宽高比。当用户要求“生成封面图”“创建文章封面”或“制作封面”时使用。"},{"id":"baoyu-danger-gemini-web","name":"baoyu-danger-gemini-web","path":"libraries/baoyu-skills/skills/baoyu-danger-gemini-web","original_path":"skills/baoyu-danger-gemini-web","tags":["image","docs","coding"],"description":"Generates images and text via reverse-engineered Gemini Web API. Supports text generation, image generation from prompts, reference images for vision input, and multi-turn conversations. Use when other skills need image generation backend, or when user requests \"generate image with Gemini\", \"Gemini text generation\", or needs vision-capable AI generation.","added_at":"2026-05-17","version":"1.56.2","extracted_path":"extracted-skills/baoyu-skills/baoyu-danger-gemini-web","description_zh":"通过逆向工程的 Gemini Web API 生成图像和文本。支持文本生成、根据提示词生成图像、使用参考图像作为视觉输入，以及多轮对话。当其他技能需要图像生成后端，或用户请求“使用 Gemini 生成图像”“Gemini 文本生成”，或需要具备视觉能力的 AI 生成时使用。"},{"id":"baoyu-danger-x-to-markdown","name":"baoyu-danger-x-to-markdown","path":"libraries/baoyu-skills/skills/baoyu-danger-x-to-markdown","original_path":"skills/baoyu-danger-x-to-markdown","tags":["docs","coding","frontend"],"description":"Converts X (Twitter) tweets and articles to markdown with YAML front matter. Uses reverse-engineered API requiring user consent. Use when user mentions \"X to markdown\", \"tweet to markdown\", \"save tweet\", or provides x.com/twitter.com URLs for conversion.","added_at":"2026-05-17","version":"1.117.3","extracted_path":"extracted-skills/baoyu-skills/baoyu-danger-x-to-markdown","description_zh":"将 X（Twitter）推文和文章转换为带有 YAML 前置元数据的 Markdown。使用逆向工程 API，需要获得用户同意。当用户提及“X 转 Markdown”“推文转 Markdown”“保存推文”，或提供 x.com/twitter.com URL 进行转换时使用。"},{"id":"baoyu-diagram","name":"baoyu-diagram","path":"libraries/baoyu-skills/skills/baoyu-diagram","original_path":"skills/baoyu-diagram","tags":["image","docs","coding","data","workflow"],"description":"Create professional, dark-themed SVG diagrams of any type — architecture diagrams, flowcharts, sequence diagrams, structural diagrams, mind maps, timelines, illustrative/conceptual diagrams, and more. Use this skill whenever the user asks for any kind of technical or conceptual diagram, visualization of a system, process flow, data flow, component relationship, network topology, decision tree, org chart, state machine, or any visual representation of structure/logic/process. Also trigger when the user says \"画个图\" \"画一个架构图\" \"diagram\" \"flowchart\" \"sequence diagram\" \"draw me a ...\" or uploads content and asks to visualize it. Output is always a standalone .svg file.","added_at":"2026-05-17","version":"1.117.3","extracted_path":"extracted-skills/baoyu-skills/baoyu-diagram","description_zh":"创建任何类型的专业深色主题 SVG 图表——架构图、流程图、时序图、结构图、思维导图、时间线、说明性/概念图等。每当用户请求任何类型的技术图或概念图、系统可视化、流程、数据流、组件关系、网络拓扑、决策树、组织结构图、状态机，或任何结构/逻辑/过程的可视化表示时，都应使用此技能。当用户说“画个图”“画一个架构图”“diagram”“flowchart”“sequence diagram”“draw me a ...”，或上传内容并要求将其可视化时，也应触发此技能。输出始终是一个独立的 `.svg` 文件。"},{"id":"baoyu-electron-extract","name":"baoyu-electron-extract","path":"libraries/baoyu-skills/skills/baoyu-electron-extract","original_path":"skills/baoyu-electron-extract","tags":["docs","coding","frontend"],"description":"Extracts resources and JavaScript from any installed Electron app (`.asar` bundle), restoring original sources from `.js.map` files when available or formatting minified code with Prettier otherwise. Use when user wants to \"extract Electron app\", \"decompile Electron\", \"get the source code of <app>\", \"inspect app.asar\", \"看 Electron 应用源码\", \"提取 .asar\", or asks how a desktop Electron app is built. Skips `node_modules` and supports both macOS and Windows.","added_at":"2026-06-25","version":"1.119.0","extracted_path":"extracted-skills/baoyu-skills/baoyu-electron-extract","description_zh":"从任何已安装的 Electron 应用（`.asar` 包）中提取资源和 JavaScript；当存在 `.js.map` 文件时，从中还原原始源码，否则使用 Prettier 格式化压缩代码。当用户想要“提取 Electron 应用”“反编译 Electron”“获取 <app> 的源代码”“检查 app.asar”“看 Electron 应用源码”“提取 .asar”，或询问某个 Electron 桌面应用是如何构建的时使用。跳过 `node_modules`，同时支持 macOS 和 Windows。"},{"id":"baoyu-format-markdown","name":"baoyu-format-markdown","path":"libraries/baoyu-skills/skills/baoyu-format-markdown","original_path":"skills/baoyu-format-markdown","tags":["docs","coding"],"description":"Formats plain text or markdown files with frontmatter, titles, summaries, headings, bold, lists, and code blocks. Use when user asks to \"format markdown\", \"beautify article\", \"add formatting\", or improve article layout. Outputs to {filename}-formatted.md.","added_at":"2026-05-17","version":"1.57.0","extracted_path":"extracted-skills/baoyu-skills/baoyu-format-markdown","description_zh":"使用 frontmatter、标题、摘要、各级标题、粗体、列表和代码块格式化纯文本或 Markdown 文件。当用户要求“格式化 Markdown”“美化文章”“添加格式”或改善文章布局时使用。输出到 {filename}-formatted.md。"},{"id":"baoyu-image-gen","name":"baoyu-image-gen","path":"libraries/baoyu-skills/skills/baoyu-image-gen","original_path":"skills/baoyu-image-gen","tags":["image","docs","coding","data"],"description":"AI image generation with OpenAI GPT Image 2, Azure OpenAI, Google, OpenRouter, DashScope, Z.AI GLM-Image, MiniMax, Jimeng, Seedream, Replicate and Agnes APIs. Supports text-to-image, reference images, aspect ratios, and batch generation from saved prompt files. Sequential by default; use batch parallel generation when the user already has multiple prompts or wants stable multi-image throughput. Use when user asks to generate, create, or draw images.","added_at":"2026-05-17","version":"2.1.0","extracted_path":"extracted-skills/baoyu-skills/baoyu-image-gen","description_zh":"使用 OpenAI GPT Image 2、Azure OpenAI、Google、OpenRouter、DashScope、Z.AI GLM-Image、MiniMax、Jimeng、Seedream、Replicate 和 Agnes API 进行 AI 图像生成。支持文生图、参考图、宽高比以及从已保存的提示词文件批量生成。默认按顺序生成；当用户已有多个提示词或需要稳定的多图吞吐量时，使用批量并行生成。当用户要求生成、创建或绘制图像时使用。"},{"id":"baoyu-infographic","name":"baoyu-infographic","path":"libraries/baoyu-skills/skills/baoyu-infographic","original_path":"skills/baoyu-infographic","tags":["docs","coding"],"description":"Generate professional infographics with 21 layout types and 22 visual styles. Analyzes content, recommends layout×style combinations, and generates publication-ready infographics. Use when user asks to create \"infographic\", \"信息图\", \"visual summary\", \"可视化\", or \"高密度信息大图\".","added_at":"2026-05-17","version":"1.117.4","extracted_path":"extracted-skills/baoyu-skills/baoyu-infographic","description_zh":"使用 21 种布局类型和 22 种视觉风格生成专业信息图。分析内容、推荐布局×风格组合，并生成可直接发布的信息图。当用户要求创建“infographic”“信息图”“visual summary”“可视化”或“高密度信息大图”时使用。"},{"id":"baoyu-markdown-to-html","name":"baoyu-markdown-to-html","path":"libraries/baoyu-skills/skills/baoyu-markdown-to-html","original_path":"skills/baoyu-markdown-to-html","tags":["docs","coding"],"description":"Converts Markdown to styled HTML with WeChat-compatible themes. Supports code highlighting, math, Mermaid (rendered to PNG via headless Chrome), PlantUML, footnotes, alerts, infographics, and optional bottom citations for external links. Use when user asks for \"markdown to html\", \"convert md to html\", \"md 转 html\", \"微信外链转底部引用\", or needs styled HTML output from markdown.","added_at":"2026-05-17","version":"1.117.3","extracted_path":"extracted-skills/baoyu-skills/baoyu-markdown-to-html","description_zh":"将 Markdown 转换为带样式的 HTML，并提供兼容微信的主题。支持代码高亮、数学公式、Mermaid（通过无头 Chrome 渲染为 PNG）、PlantUML、脚注、提示块、信息图，以及可选的外部链接底部引用。当用户要求“markdown to html”“convert md to html”“md 转 html”“微信外链转底部引用”，或需要从 Markdown 生成带样式的 HTML 输出时使用。"},{"id":"baoyu-post-to-wechat","name":"baoyu-post-to-wechat","path":"libraries/baoyu-skills/skills/baoyu-post-to-wechat","original_path":"skills/baoyu-post-to-wechat","tags":["browser","image","docs","coding","workflow"],"description":"Posts content to WeChat Official Account (微信公众号) via API or Chrome CDP. Supports article posting (文章) with HTML, markdown, or plain text input, and image-text posting (贴图, formerly 图文) with multiple images. Markdown article workflows default to converting ordinary external links into bottom citations for WeChat-friendly output. Use when user mentions \"发布公众号\", \"post to wechat\", \"微信公众号\", or \"贴图/图文/文章\".","added_at":"2026-05-17","version":"1.118.2","extracted_path":"extracted-skills/baoyu-skills/baoyu-post-to-wechat","description_zh":"通过 API 或 Chrome CDP 将内容发布到微信公众号。支持以 HTML、markdown 或纯文本作为输入发布文章，以及包含多张图片的贴图（原称图文）发布。Markdown 文章工作流默认将普通外部链接转换为底部引用，以生成更适合微信的内容。用户提到“发布公众号”、“post to wechat”、“微信公众号”或“贴图/图文/文章”时使用。"},{"id":"baoyu-post-to-weibo","name":"baoyu-post-to-weibo","path":"libraries/baoyu-skills/skills/baoyu-post-to-weibo","original_path":"skills/baoyu-post-to-weibo","tags":["browser","image","docs","coding"],"description":"Posts content to Weibo (微博). Supports regular posts with text, images, and videos, and headline articles (头条文章) with Markdown input via Chrome CDP. Use when user asks to \"post to Weibo\", \"发微博\", \"发布微博\", \"publish to Weibo\", \"share on Weibo\", \"写微博\", or \"微博头条文章\".","added_at":"2026-05-17","version":"1.117.3","extracted_path":"extracted-skills/baoyu-skills/baoyu-post-to-weibo","description_zh":"将内容发布到微博。支持包含文本、图片和视频的普通微博，以及通过 Chrome CDP 使用 Markdown 输入发布头条文章。当用户要求“post to Weibo”、“发微博”、“发布微博”、“publish to Weibo”、“share on Weibo”、“写微博”或“微博头条文章”时使用。"},{"id":"baoyu-post-to-x","name":"baoyu-post-to-x","path":"libraries/baoyu-skills/skills/baoyu-post-to-x","original_path":"skills/baoyu-post-to-x","tags":["browser","image","docs","coding","workflow"],"description":"Posts content and articles to X (Twitter). Supports regular posts with images/videos and X Articles (long-form Markdown). In Codex, honor explicit requests for the Codex Chrome plugin/@chrome by using the Chrome Extension workflow; otherwise use Chrome Computer Use when available and fall back to real Chrome CDP scripts only when allowed. Use when user asks to \ e filled contacts sheet'. Also trigger when the user says something like 'I filled in the contacts file, now import it' or 'here is my contacts spreadsheet, please upload it to TRES'. Do NOT trigger for exporting or extracting unidentified addresses — that's the export-3rd-party-contacts skill. Do NOT trigger for viewing or searching the existing address book."},{"id":"tres-invoice-bill-matching","name":"tres-invoice-bill-matching","path":"libraries/claude-plugins-community/tres-finance-plugin/skills/tres-invoice-bill-matching","original_path":"tres-finance-plugin/skills/tres-invoice-bill-matching","tags":["docs","finance","coding","frontend"],"description":"Match TRES ledger transactions to ERP invoices/bills (AP/AR) and optionally sync them to the connected ERP (Xero, QuickBooks Online, NetSuite). Trigger this skill whenever the user wants to match, link, close, reconcile, or sync an invoice or bill against a blockchain transaction — even if they don't say \"skill\" or use those exact words. Trigger phrases include: \"match this invoice to a transaction\", \"match a bill to tx\", \"close invoice INV-123\", \"close bill 9988\", \"link this tx to a bill\", \"pay this invoice from this transaction\", \"set up this tx as AP\", \"set up this tx as AR\", \"sync this transaction as AP/AR\", \"match AP/AR\", \"find the invoice/bill for this hash\", \"what bill does this tx pay\". Trigger ONLY for explicit AP/AR matching/closing intent — do NOT trigger for general transaction explanations (use tres-tx-story), for ingesting an explorer link into the ledger (use tres-explorer-tx-to-ledger), or for ERP connection setup itself (use tres-settings-management).","added_at":"2026-09-01","extracted_path":"extracted-skills/claude-plugins-community/tres-invoice-bill-matching","description_zh":"Match TRES ledger transactions to ERP invoices/bills (AP/AR) and optionally sync them to the connected ERP (Xero, QuickBooks Online, NetSuite). Trigger this skill whenever the user wants to match, link, close, reconcile, or sync an invoice or bill against a blockchain transaction — even if they don't say \"skill\" or use those exact words. Trigger phrases include: \"match this invoice to a transaction\", \"match a bill to tx\", \"close invoice INV-123\", \"close bill 9988\", \"link this tx to a bill\", \"pay this invoice from this transaction\", \"set up this tx as AP\", \"set up this tx as AR\", \"sync this transaction as AP/AR\", \"match AP/AR\", \"find the invoice/bill for this hash\", \"what bill does this tx pay\". Trigger ONLY for explicit AP/AR matching/closing intent — do NOT trigger for general transaction explanations (use tres-tx-story), for ingesting an explorer link into the ledger (use tres-explorer-tx-to-ledger), or for ERP connection setup itself (use tres-settings-management)."},{"id":"tres-ledger-link","name":"tres-ledger-link","path":"libraries/claude-plugins-community/tres-finance-plugin/skills/tres-ledger-link","original_path":"tres-finance-plugin/skills/tres-ledger-link","tags":["docs","finance","coding","data","frontend"],"description":"Build a TRES Finance dashboard ledger URL (Transactions tab) with a precise filter set — date range, wallets, assets, tags, status, amount, and more — so it can be shared with a customer or reused. Use whenever the user asks for a \"ledger link\", \"dashboard link\", \"filter URL\", or \"send <customer> a link to <some filtered view>\". Scoped to the Transactions tab only (not Accounting, Roll Forward, Pivot Tables, Cost Basis, or Trial Balances).","added_at":"2026-09-01","extracted_path":"extracted-skills/claude-plugins-community/tres-ledger-link","description_zh":"Build a TRES Finance dashboard ledger URL (Transactions tab) with a precise filter set — date range, wallets, assets, tags, status, amount, and more — so it can be shared with a customer or reused. Use whenever the user asks for a \"ledger link\", \"dashboard link\", \"filter URL\", or \"send <customer> a link to <some filtered view>\". S y, or ledger browsing. Covers the full workflow: confirming the target date, optionally filtering by asset, fetching gap data, enriching with fiat and on-chain balances, rendering an HTML dashboard where each gap row has copy-prompt buttons (Plug / Auto-fill) — clicking copies a ready-to-paste Claude prompt for that gap. The user pastes it in the chat and Claude executes the action. Ends with a data collect once the user is done."},{"id":"tres-report-advisor","name":"tres-report-advisor","path":"libraries/claude-plugins-community/tres-finance-plugin/skills/tres-report-advisor","original_path":"tres-finance-plugin/skills/tres-report-advisor","tags":["docs","finance","coding","data"],"description":"Recommend the right TRES Finance report for any user question. Trigger this skill whenever a user asks which report to use, what report contains certain data, how to get specific information out of TRES, or compares two reports. Also trigger when the user describes a goal (e.g. \"month-end close\", \"auditor needs proof\", \"tax filing\", \"reconciliation\") without naming a specific report. Trigger phrases include \"which report\", \"what report\", \"how do I export\", \"where can I find\", \"I need a report for\", \"what's the difference between\", \"best report for\", \"auditor asked for\", or any question about getting data out of TRES Finance.","added_at":"2026-09-01","extracted_path":"extracted-skills/claude-plugins-community/tres-report-advisor","description_zh":"Recommend the right TRES Finance report for any user question. Trigger this skill whenever a user asks which report to use, what report contains certain data, how to get specific information out of TRES, or compares two reports. Also trigger when the user describes a goal (e.g. \"month-end close\", \"auditor needs proof\", \"tax filing\", \"reconciliation\") without naming a specific report. Trigger phrases include \"which report\", \"what report\", \"how do I export\", \"where can I find\", \"I need a report for\", \"what's the difference between\", \"best report for\", \"auditor asked for\", or any question about getting data out of TRES Finance."},{"id":"tres-report-analyzer","name":"tres-report-analyzer","path":"libraries/claude-plugins-community/tres-finance-plugin/skills/tres-report-analyzer","original_path":"tres-finance-plugin/skills/tres-report-analyzer","tags":["docs","finance","coding","data"],"description":"Analyze any TRES Finance report XLSX and produce an automatic findings summary. Trigger this skill whenever a user uploads a .xlsx file that came from TRES Finance and asks to \"analyze\", \"summarize\", \"review\", \"check\", \"audit\", \"look at\", \"what does this show\", \"any issues\", \"anything interesting\", or \"walk me through\" the report. Also trigger when the user uploads an Excel file and mentions TRES, reconciliation, balances, transactions, cost basis, roll forward, or ERP sync. The skill identifies the report type from the file structure, runs targeted analysis based on report-specific logic, and produces a clear findings summary highlighting anomalies, key metrics, and action items.","added_at":"2026-09-01","extracted_path":"extracted-skills/claude-plugins-community/tres-report-analyzer","description_zh":"Analyze any TRES Finance report XLSX and produce an automatic findings summary. Trigger this skill whenever a user uploads a .xlsx file that came from TRES Finance and asks to \"analyze\", \"summarize\", \"review\", \"check\", \"audit\", \"look at\", \"what does this show\", \"any issues\", \"anything interesting\", or \"walk me through\" the report. Also trigger when the user uploads an Excel file and mentions TRES, reconciliation, balances, transactions, cost basis, roll forward, or ERP sync. The skill identifies the report type from the file structure, runs targeted analysis based on report-specific logic, and produces a clear findings summary highlighting anomalies, key metrics, and action items."},{"id":"tres-report-create","name" nce-plugin/skills/tres-request-skill-update","tags":["docs","finance","coding","data","workflow"],"description":"Submit feedback about the TRES Claude plugin — bug reports, feature requests, skill improvements, new skill ideas, MCP issues, workflow friction, or positive feedback about what's working well. Use this skill whenever the user wants to share any kind of feedback about the plugin, its skills, or the TRES MCP. Trigger phrases include: \"submit feedback\", \"report a bug\", \"request a feature\", \"suggest an improvement\", \"I have an idea\", \"something is broken\", \"the skill isn't working\", \"I love this skill\", \"this worked great\", \"the MCP is returning wrong data\", \"the flow is confusing\", \"can you fix the skill\", \"file a skill request\", \"give feedback\", \"this could be better\". Also trigger proactively when the conversation appears to be wrapping up — e.g. the user says \"thanks\", \"that's all\", \"looks good\", \"we're done\", \"nothing else\", or any other signal that the task is complete. In that case, offer a brief feedback prompt instead of launching the full guided flow. Do NOT trigger for general questions about how a skill works — only when the user wants to submit feedback or the conversation is ending.","added_at":"2026-09-01","extracted_path":"extracted-skills/claude-plugins-community/tres-request-skill-update","description_zh":"Submit feedback about the TRES Claude plugin — bug reports, feature requests, skill improvements, new skill ideas, MCP issues, workflow friction, or positive feedback about what's working well. Use this skill whenever the user wants to share any kind of feedback about the plugin, its skills, or the TRES MCP. Trigger phrases include: \"submit feedback\", \"report a bug\", \"request a feature\", \"suggest an improvement\", \"I have an idea\", \"something is broken\", \"the skill isn't working\", \"I love this skill\", \"this worked great\", \"the MCP is returning wrong data\", \"the flow is confusing\", \"can you fix the skill\", \"file a skill request\", \"give feedback\", \"this could be better\". Also trigger proactively when the conversation appears to be wrapping up — e.g. the user says \"thanks\", \"that's all\", \"looks good\", \"we're done\", \"nothing else\", or any other signal that the task is complete. In that case, offer a brief feedback prompt instead of launching the full guided flow. Do NOT trigger for general questions about how a skill works — only when the user wants to submit feedback or the conversation is ending."},{"id":"tres-rollup-review","name":"tres-rollup-review","path":"libraries/claude-plugins-community/tres-finance-plugin/skills/tres-rollup-review","original_path":"tres-finance-plugin/skills/tres-rollup-review","tags":["docs","finance","coding","frontend"],"description":"Compute the EXACT sub-transaction impact of a rollup rule in TRES Finance — every filter applied — and flag genuine problems (zero matches, overlap, config mistakes) before the rule is created. Two modes. Mode A: a pre-create quality gate invoked by the tres-rollup-rules skill to vet proposed candidate rules. Mode B: standalone review of a rule someone submitted or of existing PENDING rules. Trigger this skill when the user says \"review this rollup rule\", \"what would this rollup rule actually match\", \"preview the rollup impact\", \"how many transactions would this rule catch\", \"is this rollup rule valid\", \"validate my rollup rule\", \"check my pending rollup rules\", or \"review the rollup requests\". Do NOT use this to design or propose new rollups — that is tres-rollup-rules. This skill only measures impact and flags issues; it never executes mutations.","added_at":"2026-09-01","extracted_path":"extracted-skills/claude-plugins-community/tres-rollup-review","description_zh":"Compute the EXACT sub-transaction impact of a rollup rule in TRES Finance — every filter applied — and flag genuine problems (zero matches, overlap, config mistakes) before the rule is created. Two modes. Mode A: a pre-create quality gate invoked by the tres-rollup-rules skill to vet proposed candidate rules. Mode B: standalone review of a rule someone submitted or of existing PENDING rules. Trigger this skill when the user says \"review this rollup rule\", \"what would this rollup rule actually match\", \"preview the rollup impact\", \"how many transactions would this rule catch\", \"is this rollup rule valid\", \"validate my rollup rule\", \"check my pending rollup rules\", or \"review the rollup requests\". Do NOT use this to design or propose new rollups — that is tres-rollup-rules. This skill only measures impact and flags issues; it never executes mutations."},{"id":"tres-rollup-rules","name":"tres-rollup-rules","path":"libraries/claude-plugins-community/tres-finance-plugin/skills/tres-rollup-rules","original_path":"tres-finance-plugin/skills/tres-rollup-rules","tags":["docs","finance","coding","data"],"description":"Analyze an organization's sub-transaction patterns in TRES Finance, identify groups of repetitive transactions, and propose data-driven rollup rules that consolidate them into one aggregated entry per interval (daily or monthly) for cleaner ERP integration. Also lists and deletes rollup rules. Trigger this skill whenever the user asks about rollup rules, transaction aggregation, consolidating transactions, reducing transaction noise, rolling up gas fees, rolling up staking rewards, rolling up micro-transactions, or collapsing many small ledger entries into fewer summary entries. Also trigger on \"create a rollup rule\", \"suggest rollup rules\", \"what should I roll up\", \"show my rollup rules\", \"delete a rollup rule\", \"aggregate transactions\", \"too many transactions\", \"reduce transaction count\", \"roll up fees\", \"daily rollup\", \"monthly rollup\". If a wallet has too many transactions, high-frequency activity, or noisy ledger entries, proactively suggest rollup rules. For computing the EXACT impact of a single al
