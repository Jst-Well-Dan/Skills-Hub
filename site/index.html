<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="浏览、筛选并直达优质 Agent Skills 的开源目录。">
  <title>Skills-Hub - Agent Skills 目录</title>
  <style>
    @font-face {
      font-family: "TsangerJinKai02";
      src: url("assets/fonts/TsangerJinKai02-W04.ttf") format("truetype");
      font-weight: 400 500;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "JetBrains Mono";
      src: url("assets/fonts/JetBrainsMono.woff2") format("woff2");
      font-weight: 400 500;
      font-style: normal;
      font-display: swap;
    }
    :root {
      color-scheme: light dark;
      --bg: #f6f8fa;
      --bg-deep: #eaeef2;
      --ivory: #ffffff;
      --panel: #ffffff;
      --panel-muted: #f6f8fa;
      --panel-lift: #f3f4f6;
      --text: #1f2328;
      --body-text: #3b434b;
      --muted: #59636e;
      --faint: #6e7781;
      --stone: #59636e;
      --line: #d0d7de;
      --line-strong: #8c959f;
      --accent: #0969da;
      --accent-strong: #0550ae;
      --accent-soft: #ddf4ff;
      --tag-bg: #ddf4ff;
      --accent-text: #ffffff;
      --shadow: 0 8px 24px rgba(140, 149, 159, .18);
      --ease: cubic-bezier(.16, 1, .3, 1);
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      --mono: "JetBrains Mono", "SF Mono", Consolas, Monaco, monospace;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1117;
        --bg-deep: #21262d;
        --ivory: #161b22;
        --panel: #161b22;
        --panel-muted: #0d1117;
        --panel-lift: #21262d;
        --text: #f0f6fc;
        --body-text: #c9d1d9;
        --muted: #9da7b1;
        --faint: #8b949e;
        --stone: #9da7b1;
        --line: #30363d;
        --line-strong: #6e7681;
        --accent: #58a6ff;
        --accent-strong: #79c0ff;
        --accent-soft: #0c2d4a;
        --tag-bg: #0c2d4a;
        --accent-text: #0d1117;
        --shadow: 0 8px 24px rgba(1, 4, 9, .38);
      }
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      background: var(--bg);
      color: var(--body-text);
      font-family: var(--sans);
      font-size: 14px;
      line-height: 1.55;
      letter-spacing: 0;
    }
    a { color: inherit; text-decoration: none; }
    button, input, select { font: inherit; }
    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      border-bottom: 1px solid var(--line);
      background: color-mix(in srgb, var(--ivory) 94%, transparent);
      backdrop-filter: blur(16px);
    }
    .topbar-inner {
      max-width: 1360px;
      margin: 0 auto;
      padding: 10px 24px;
      display: grid;
      grid-template-columns: minmax(180px, 260px) 1fr auto;
      gap: 18px;
      align-items: center;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .mark {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      border: 1px solid var(--accent);
      background: var(--accent);
      color: var(--accent-text);
      font-weight: 800;
      letter-spacing: 0;
      box-shadow: none;
    }
    .brand-title {
      margin: 0;
      color: var(--text);
      font-size: 19px;
      line-height: 1.1;
      font-weight: 720;
    }
    .brand-meta {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .search-box {
      position: relative;
      min-width: 0;
    }
    .search-box input {
      width: 100%;
      height: 44px;
      padding: 0 44px 0 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      outline: none;
    }
    .search-box input::placeholder { color: var(--muted); }
    .search-box input:focus {
      border-color: var(--line-strong);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
    }
    .search-icon, .clear-search {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
    }
    .search-icon { left: 14px; }
    .clear-search {
      right: 8px;
      width: 30px;
      height: 30px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      cursor: pointer;
    }
    .clear-search:hover { background: var(--panel-lift); color: var(--accent); }
    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .nav-link {
      min-height: 38px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--panel);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      transition: border-color .18s var(--ease), background .18s var(--ease);
    }
    .nav-link:hover { border-color: var(--line-strong); background: var(--panel-lift); }
    .icon-button {
      width: 38px;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: var(--panel);
      color: var(--accent);
      cursor: pointer;
      transition: transform .18s var(--ease), border-color .18s var(--ease), background .18s var(--ease);
    }
    .icon-button:hover { border-color: var(--line-strong); background: var(--panel-lift); transform: translateY(-1px); }

    .layout {
      max-width: 1360px;
      margin: 0 auto;
      padding: 32px 24px 48px;
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      gap: 24px;
    }
    .sidebar {
      align-self: start;
      position: sticky;
      top: 76px;
      display: grid;
      gap: 14px;
    }
    .filter-panel {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      overflow: hidden;
    }
    .filter-head {
      padding: 13px 14px;
      border-bottom: 1px solid var(--line);
      background: var(--panel-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .filter-title {
      margin: 0;
      font-size: 13px;
      color: var(--text);
      letter-spacing: 0;
    }
    .filter-list {
      padding: 8px;
      max-height: 250px;
      overflow: auto;
    }
    .facet {
      width: 100%;
      min-height: 34px;
      padding: 7px 8px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
      text-align: left;
      cursor: pointer;
      color: var(--text);
      transition: background .16s var(--ease), color .16s var(--ease);
    }
    .facet:hover { background: var(--panel-lift); }
    .facet.active {
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 650;
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 24%, var(--line));
    }
    .facet span:first-child {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .count {
      min-width: 28px;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--panel-lift);
      color: var(--muted);
      text-align: center;
      font-size: 12px;
    }
    .facet.active .count { background: var(--tag-bg); color: var(--accent); }

    .workspace {
      min-width: 0;
      display: grid;
      gap: 16px;
    }
    .catalog-intro {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 24px;
      align-items: end;
      padding: 4px 2px 8px;
    }
    .catalog-title {
      margin: 0;
      color: var(--text);
      font-size: clamp(28px, 4vw, 44px);
      line-height: 1.08;
      letter-spacing: -.035em;
    }
    .catalog-copy {
      margin: 10px 0 0;
      max-width: 58ch;
      color: var(--muted);
      font-size: 15px;
    }
    .catalog-source {
      color: var(--accent);
      font-weight: 650;
      white-space: nowrap;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      overflow: hidden;
    }
    .stat {
      border-right: 1px solid var(--line);
      padding: 14px 16px;
      min-height: 78px;
      display: grid;
      align-content: space-between;
    }
    .stat:last-child { border-right: 0; }
    .stat-label {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .04em;
    }
    .stat-value {
      margin-top: 8px;
      color: var(--text);
      font-size: 27px;
      line-height: 1;
      font-weight: 760;
    }
    .toolbar {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .segmented {
      display: inline-grid;
      grid-auto-flow: column;
      gap: 3px;
      padding: 3px;
      border-radius: 9px;
      background: var(--bg-deep);
      border: 1px solid var(--line);
    }
    .segment {
      min-width: 72px;
      height: 32px;
      padding: 0 12px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }
    .segment.active {
      background: var(--accent);
      color: var(--accent-text);
      box-shadow: 0 0 0 1px var(--accent);
      font-weight: 650;
    }
    .sort-select {
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--panel);
      color: var(--text);
      padding: 0 10px;
    }
    .result-meta {
      color: var(--muted);
      font-size: 13px;
    }
    .project-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .project-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    .project-card {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--panel);
      min-width: 0;
      overflow: hidden;
      transition: transform .18s var(--ease), border-color .18s var(--ease), box-shadow .18s var(--ease);
    }
    .project-card:hover {
      border-color: var(--line-strong);
      box-shadow: var(--shadow);
      transform: translateY(-2px);
    }
    .project-main {
      width: 100%;
      border: 0;
      background: transparent;
      color: inherit;
      padding: 18px;
      text-align: left;
      cursor: pointer;
      display: grid;
      gap: 12px;
    }
    .project-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: start;
    }
    .project-name {
      margin: 0;
      color: var(--text);
      font-size: 17px;
      line-height: 1.25;
      overflow-wrap: anywhere;
      text-wrap: balance;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 3px 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--accent);
      background: var(--tag-bg);
      font-size: 12px;
      white-space: nowrap;
    }
    .description {
      margin: 0;
      color: var(--muted);
      line-height: 1.65;
      font-size: 13px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .tag {
      min-height: 23px;
      padding: 3px 7px;
      border: 1px solid color-mix(in srgb, var(--accent) 24%, var(--line));
      border-radius: 6px;
      background: var(--tag-bg);
      color: var(--accent);
      font-size: 12px;
    }
    .project-foot {
      padding: 10px 12px 10px 18px;
      border-top: 1px solid var(--line);
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 12px;
      align-items: center;
      color: var(--muted);
      font-size: 12px;
    }
    .path {
      color: var(--stone);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
    }
    .card-category { white-space: nowrap; }
    .github-link, .primary-link {
      min-height: 34px;
      padding: 0 11px;
      border: 1px solid var(--accent);
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--accent);
      color: var(--accent-text);
      font-size: 12px;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
      transition: background .18s var(--ease), transform .18s var(--ease);
    }
    .github-link:hover, .primary-link:hover { background: var(--accent-strong); }
    .github-link:active, .primary-link:active { transform: translateY(1px); }
    .empty {
      border: 1px dashed var(--line-strong);
      border-radius: 6px;
      padding: 38px;
      text-align: center;
      color: var(--muted);
      background: var(--panel);
    }

    .drawer {
      position: fixed;
      inset: 0;
      z-index: 40;
      pointer-events: none;
    }
    .drawer.open { pointer-events: auto; }
    .drawer-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(20, 20, 19, .34);
      opacity: 0;
      transition: opacity .18s ease;
    }
    .drawer.open .drawer-backdrop { opacity: 1; }
    .drawer-panel {
      position: absolute;
      top: 0;
      right: 0;
      width: min(760px, 100vw);
      height: 100%;
      background: var(--bg);
      border-left: 1px solid var(--line-strong);
      transform: translateX(100%);
      transition: transform .2s ease;
      display: grid;
      grid-template-rows: auto 1fr;
    }
    .drawer.open .drawer-panel { transform: translateX(0); }
    .drawer-panel::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 1px;
      background: linear-gradient(var(--accent), var(--line), transparent);
      pointer-events: none;
    }
    .drawer-head {
      padding: 18px;
      border-bottom: 1px solid var(--line);
      background:
        linear-gradient(135deg, var(--accent-soft), transparent 48%),
        var(--panel);
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: start;
    }
    .drawer-head-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .drawer-title {
      margin: 0;
      color: var(--text);
      font-size: 26px;
      line-height: 1.2;
      overflow-wrap: anywhere;
    }
    .drawer-body {
      overflow: auto;
      padding: 18px;
      display: grid;
      gap: 16px;
      align-content: start;
    }
    .detail-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .detail {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 11px;
      background: var(--panel);
      min-width: 0;
    }
    .detail-label {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 6px;
    }
    .detail-value {
      font-size: 13px;
      overflow-wrap: anywhere;
    }
    .section-title {
      margin: 0;
      font-size: 15px;
    }
    .skill-list {
      display: grid;
      gap: 8px;
    }
    .skill-item {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      display: grid;
      gap: 8px;
      background: var(--panel);
    }
    .skill-top {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
    }
    .skill-name {
      font-weight: 680;
      color: var(--text);
      overflow-wrap: anywhere;
    }
    .skill-description {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
      font-size: 13px;
    }
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .text-link {
      color: var(--accent);
      font-size: 13px;
      font-weight: 650;
    }
    .text-link:hover { color: var(--accent-strong); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .001ms !important;
      }
    }

    @media (max-width: 980px) {
      .topbar-inner {
        grid-template-columns: 1fr auto;
      }
      .search-box {
        grid-column: 1 / -1;
        order: 3;
      }
      .layout {
        display: flex;
        flex-direction: column;
      }
      .workspace { display: contents; }
      .catalog-intro { order: 1; }
      .sidebar {
        order: 2;
        position: static;
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .stats { order: 3; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .toolbar { order: 4; }
      .project-grid, .project-list { order: 5; grid-template-columns: 1fr; }
      .catalog-intro { grid-template-columns: 1fr; gap: 8px; }
    }
    @media (max-width: 680px) {
      .topbar-inner, .layout {
        padding-left: 14px;
        padding-right: 14px;
      }
      .sidebar { grid-template-columns: 1fr; }
      .filter-list { max-height: 118px; }
      .stats { grid-template-columns: 1fr 1fr; }
      .stat:nth-child(2) { border-right: 0; }
      .stat:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
      .stat-value { font-size: 23px; }
      .toolbar { align-items: stretch; }
      .segmented { width: 100%; grid-template-columns: 1fr 1fr; grid-auto-flow: row; }
      .sort-select { width: 100%; }
      .detail-grid { grid-template-columns: 1fr; }
      .project-foot { grid-template-columns: minmax(0, 1fr) auto; }
      .card-category { display: none; }
      .nav-link { padding: 0 10px; }
      .nav-docs { display: none; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#" aria-label="Skills-Hub">
        <div class="mark">SH</div>
        <div>
          <h1 class="brand-title">Skills-Hub</h1>
          <div class="brand-meta" id="generatedAt"></div>
        </div>
      </a>
      <div class="search-box">
        <span class="search-icon">⌕</span>
        <input id="searchInput" type="search" placeholder="搜索 skill、项目、标签、描述" autocomplete="off">
        <button class="clear-search" id="clearSearch" title="清空搜索" aria-label="清空搜索">×</button>
      </div>
      <div class="actions">
        <a class="nav-link nav-docs" href="https://github.com/Jst-Well-Dan/Skills-Hub/blob/main/docs/index.md">完整索引</a>
        <a class="nav-link" href="https://github.com/Jst-Well-Dan/Skills-Hub" target="_blank" rel="noreferrer">项目 GitHub</a>
      </div>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar" aria-label="筛选">
      <section class="filter-panel">
        <div class="filter-head"><h2 class="filter-title">分类</h2></div>
        <div class="filter-list" id="categoryFilters"></div>
      </section>
      <section class="filter-panel">
        <div class="filter-head"><h2 class="filter-title">标签</h2></div>
        <div class="filter-list" id="tagFilters"></div>
      </section>
      <section class="filter-panel">
        <div class="filter-head"><h2 class="filter-title">来源</h2></div>
        <div class="filter-list" id="sourceFilters"></div>
      </section>
    </aside>

    <section class="workspace">
      <header class="catalog-intro">
        <div>
          <h2 class="catalog-title">找到值得使用的 Agent Skills</h2>
          <p class="catalog-copy">从开源项目中筛选、比较并直达原始仓库。点击卡片查看详情，或直接打开目标 GitHub。</p>
        </div>
        <a class="catalog-source" href="https://github.com/Jst-Well-Dan/Skills-Hub" target="_blank" rel="noreferrer">在 GitHub 查看本目录</a>
      </header>
      <div class="stats" id="stats"></div>
      <div class="toolbar">
        <div class="segmented" role="tablist" aria-label="展示模式">
          <button class="segment active" data-view="grid">网格</button>
          <button class="segment" data-view="list">列表</button>
        </div>
        <div class="result-meta" id="resultMeta"></div>
        <select class="sort-select" id="sortSelect" aria-label="排序">
          <option value="name">按名称</option>
          <option value="skills">按 skill 数</option>
          <option value="updated">按检查日期</option>
          <option value="category">按分类</option>

"added_at":"2026-05-17","extracted_path":"extracted-skills/huashu-skills/huashu-wechat-image"},{"id":"huashu-xhs-image","name":"huashu-xhs-image","path":"libraries/huashu-skills/huashu-xhs-image","original_path":"huashu-xhs-image","tags":["image","docs","coding"],"description":"为小红书笔记生成高质量配图。默认AI生成（Gemini），仅精确数据表格用HTML兜底。当用户提到\"小红书配图\"、\"小红书封面\"、\"小红书图片\"、\"做张小红书图\"、\"笔记配图\"时使用此技能。","added_at":"2026-05-17","extracted_path":"extracted-skills/huashu-skills/huashu-xhs-image"}],"install":{"method":"extracted","extracted_root":"extracted-skills/huashu-skills"},"extracted":{"root":"extracted-skills/huashu-skills","source_library":"huashu-skills","source_path":"libraries/huashu-skills","last_extracted_commit":"35e7cf31328f6de07e5d125bfd094791f84b2352","skill_count":21},"category":"content-creation"},{"id":"impeccable","name":"impeccable","path":"libraries/impeccable","source":{"type":"github","repo":"pbakaus/impeccable","ref":"main","commit":"d2ab4ddee6fa63002fae680652b5fbd31735e280"},"tags":["automation","coding","docs","frontend","image","workflow"],"description":"Impeccable","added_at":"2026-05-17","last_checked_at":"2026-06-25","last_synced_at":"2026-06-25","skill_count":1,"skills":[{"id":"impeccable","name":"impeccable","path":"libraries/impeccable/plugin/skills/impeccable","original_path":"plugin/skills/impeccable","tags":["browser","docs","coding","frontend"],"description":"Use when the user wants to design, redesign, shape, critique, audit, polish, clarify, distill, harden, optimize, adapt, animate, colorize, extract, or otherwise improve a frontend interface. Covers websites, landing pages, dashboards, product UI, app shells, components, forms, settings, onboarding, and empty states. Handles UX review, visual hierarchy, information architecture, cognitive load, accessibility, performance, responsive behavior, theming, anti-patterns, typography, fonts, spacing, layout, alignment, color, motion, micro-interactions, UX copy, error states, edge cases, i18n, and reusable design systems or tokens. Also use for bland designs that need to become bolder or more delightful, loud designs that should become quieter, live browser iteration on UI elements, or ambitious visual effects that should feel technically extraordinary. Not for backend-only or non-UI tasks.","added_at":"2026-05-17","version":"3.8.0","extracted_path":"extracted-skills/impeccable/impeccable"}],"install":{"method":"npx","extracted_root":"extracted-skills/impeccable","command":"npx impeccable skills install","fallback":"extracted"},"extracted":{"root":"extracted-skills/impeccable","source_library":"impeccable","source_path":"libraries/impeccable","last_extracted_commit":"d2ab4ddee6fa63002fae680652b5fbd31735e280","skill_count":1},"category":"frontend-presentation"},{"id":"kami","name":"kami","path":"libraries/kami","source":{"type":"github","repo":"tw93/Kami","ref":"main","commit":"594bfb8f2c62f26102a377c2e6cdb8cafa7d61f1"},"tags":["coding","data","docs","frontend","pdf"],"description":"Why","added_at":"2026-07-02","last_checked_at":"2026-07-02","last_synced_at":"2026-07-02","skill_count":2,"skills":[{"id":"kami","name":"kami","path":"libraries/kami/plugins/kami/skills/kami","original_path":"plugins/kami/skills/kami","tags":["docs","coding","data","frontend","pdf"],"description":"Typeset professional documents and product landing pages: resumes, one-pagers, white papers, letters, portfolios, slide decks, landing pages. Warm parchment, ink-blue accent, serif-led hierarchy. CN uses TsangerJinKai02, EN uses Charter, JA uses YuMincho (best-effort). Triggers on \"做 PDF / 排版 / 一页纸 / 白皮书 / 作品集 / 简历 / PPT / slides / Marp / markdown slides / マークダウンのスライド / 落地页 / 官网 / landing page / product page\", or \"build me a resume / make a one-pager / design a slide deck / turn this into a PDF / make this presentable / create a landing page\".","added_at":"2026-07-02","extracted_path":"extracted-skills/kami/kami"},{"id":"kami-2","name":"kami","path":"libraries/kami","original_path":".","tags":["docs","coding","data","frontend","pdf"],"description":"Typeset professional documents and product landing pages: resumes, one-pagers, white papers, letters, portfolios, slide decks, landing pages. Warm parchment, ink-blue accent, serif-led hierarchy. CN uses TsangerJinKai02, EN uses Charter, JA uses YuMincho (best-effort). Triggers on \"做 PDF / 排版 / 一页纸 / 白皮书 / 作品集 / 简历 / PPT / slides / Marp / markdown slides / マークダウンのスライド / 落地页 / 官网 / landing page / product page\", or \"build me a resume / make a one-pager / design a slide deck / turn this into a PDF / make this presentable / create a landing page\".","added_at":"2026-07-02","extracted_path":"extracted-skills/kami/kami-2"}],"install":{"method":"npx","extracted_root":"extracted-skills/kami","command":"npx skills add tw93/kami/plugins/kami/skills/kami -a '*' -g -y","fallback":"extracted"},"extracted":{"root":"extracted-skills/kami","source_library":"kami","source_path":"libraries/kami","last_extracted_commit":"594bfb8f2c62f26102a377c2e6cdb8cafa7d61f1","skill_count":2},"category":"document-data","category_locked":true},{"id":"ljg-skills","name":"ljg-skills","path":"libraries/ljg-skills","source":{"type":"github","repo":"lijigang/ljg-skills","ref":"master","commit":"52d8ac25f243221c7cdfc99d04a3b1ad479497d1"},"tags":["automation","coding","data","docs","finance","frontend","pdf","research"],"description":"ljg-skills","added_at":"2026-05-17","last_checked_at":"2026-06-25","last_synced_at":"2026-06-25","skill_count":23,"skills":[{"id":"ljg-book","name":"ljg-book","path":"libraries/ljg-skills/skills/ljg-book","original_path":"skills/ljg-book","tags":["docs","coding","research"],"description":"拆一本书，以「问题」为轴心走一条线。五件事：作者在答什么问题（问题），这个问题之前各流派/社会共识怎么答（零点），作者带来什么独特洞见——公式/理论框架/模型/概念四选一——相对共识挪动了什么（位移/delta），落成哪句结论（落点），最后萃一个 takeaway 作为精神内核（行囊）。收尾画一张 ASCII 参考系图（千脑智能式）：各流派、旧共识、作者钉到同一张图的位置上，delta 是图上一段看得见的距离，再走两步做预测——看懂这本书在认知史里挪动了哪一步，还能拿它预测书外的新事。Use when user says '拆书', '拆这本', '分析这本书', '这本书在讲什么', '上帝之眼看这本书', '压缩一本书', 'book', or shares a book name wanting structural analysis. NOT FOR 章节摘要（用 Fabric extract_wisdom）、论文（用 ljg-paper）、单一观点深钻（用 ljg-think）、一个领域降秩（用 ljg-rank）.","added_at":"2026-06-25","extracted_path":"extracted-skills/ljg-skills/ljg-book"},{"id":"ljg-card","name":"ljg-card","path":"libraries/ljg-skills/skills/ljg-card","original_path":"skills/ljg-card","tags":["docs","coding"],"description":"Content caster (铸). Transforms content into PNG visuals. Seven molds: -l (default) long reading card, -i infograph, -m multi-card reading cards (1080x1440), -v editorial sketchnote (problem→failure→pivot→insight→naming, magazine + archive layout), -c comic (manga-style B&W), -w whiteboard (marker-style board layout), -b big-fonts attachment card (1080x1440, weathered 碑刻 style for 小红书). Output to ~/Downloads/. Use when user says '铸', 'cast', '做成图', '做成卡片', '做成信息图', '做成海报', '视觉笔记', 'sketchnote', '杂志', 'editorial', '漫画', 'comic', 'manga', '白板', 'whiteboard', '大字', '附件图', 'big fonts', '小红书卡片'. Replaces ljg-cards and ljg-infograph.","added_at":"2026-05-17","version":"2.3.0","extracted_path":"extracted-skills/ljg-skills/ljg-card"},{"id":"ljg-invest","name":"ljg-invest","path":"libraries/ljg-skills/skills/ljg-invest","original_path":"skills/ljg-invest","tags":["docs","finance","coding"],"description":"投资分析, 生成一份深度投资分析报告。不做传统投资分析——核心判断是项目是否是一台「秩序创造机器」。Use when user says '投资报告', '投资分析', '分析这个项目', '写投资报告', 'investment report', 'invest analysis', or provides entrepreneur conversation records wanting investment evaluation. Also trigger when user pastes or references meeting notes, pitch decks, or founder interviews and asks for analysis.","added_at":"2026-05-17","extracted_path":"extracted-skills/ljg-skills/ljg-invest"},{"id":"ljg-learn","name":"ljg-learn","path":"libraries/ljg-skills/skills/ljg-learn","original_path":"skills/ljg-learn","tags":["docs","coding","frontend","research"],"description":"Deep concept anatomist that deconstructs any concept through 8 exploration dimensions (history, dialectics, phenomenology, linguistics, formalization, existentialism, aesthetics, meta-philosophy) and compresses insights into an epiphany. Use when user asks to explain, dissect, or deeply understand a concept, term, or idea. Triggers on '解剖概念', '概念解剖', 'explain concept', 'learn concept', '/ljg-learn'. Produces org-mode output.","added_at":"2026-05-17","extracted_path":"extracted-skills/ljg-skills/ljg-learn"},{"id":"ljg-library","name":"ljg-library","path":"libraries/ljg-skills/skills/ljg-library","original_path":"skills/ljg-library","tags":["docs","coding"],"description":"一本书 → 一幅清晰的「取景框」意向画面 → 一张 2050 图书馆借书卡（PNG）。取景框 = 作者从哪个角度看什么问题、看到了哪幅画面；卡上有真实封面、作者头像、书目信息。取景框 block 用费曼式讲解把这幅意向画面讲得通俗又准确；图解 block 用 AI 生图把这幅画面画出来，继刚是固定主角（从其墨像参考生成、认得出的他）。两种风格 mold：默认 -a 动物森友会（暖萌治愈），可选 -c pixel+cyber-hacker（暗黑霓虹）。浅色光学玻璃卡身、强调色从封面动态提取、宽高自适应。合上书记住这幅画面，就没白读。Use when user says '取景框卡', '图书馆卡', 'library card', '书卡', '铸书卡', '一本书一句话一张卡', '/ljg-library', or provides a book name and wants it distilled into one collectible card. 风格：默认 -a 动森，加 -c 走 cyber。NOT FOR 拆书结构分析（用 ljg-book）、纯文字金句（用 ljg-card -b）、信息图（用 ljg-card -i）、视觉笔记（用 ljg-card -v）。","added_at":"2026-06-25","version":"3.0.0","extracted_path":"extracted-skills/ljg-skills/ljg-library"},{"id":"ljg-map","name":"ljg-map","path":"libraries/ljg-skills/skills/ljg-map","original_path":"skills/ljg-map","tags":["docs","finance","coding","research"],"description":"一个行业 → 一张生态地形图卡（PNG）。以《千脑智能》参考系理论为地基：把行业摊成一张可俯瞰的「生态地形」——价值像河一样流过地貌，再在地形上标出两处——「瓶颈」（流量/产能在此收窄的隘口/水坝）和「价值捕获点」（利润在此沉淀的宝藏堆）。地形让权力结构一眼可见：卡流量的地方常常不是钱沉淀的地方。配三个关键指标的 base rate（刻度）+ 三个「大问题」（前沿）。deep research 真联网，图用 AI 生图（默认 -a 动物森友会暖萌风，可选 -c pixel+cyber），继刚作小测量员立在地形上俯瞰。Use when user says '行业地图', '产业地图', '生态地形图', '画一下这个行业', 'industry map', 'map this industry', '行业版图', '产业链地图', '/ljg-map', or gives an industry/领域 name wanting its terrain mapped. 风格：默认 -a 动森，加 -c 走 cyber。NOT FOR 一个领域降秩找生成器（用 ljg-rank）、拆一本书（用 ljg-book）、单个项目投资分析（用 ljg-invest）、一个概念深钻（用 ljg-think）。","added_at":"2026-06-25","version":"2.0.0","extracted_path":"extracted-skills/ljg-skills/ljg-map"},{"id":"ljg-paper-flow","name":"ljg-paper-flow","path":"libraries/ljg-skills/skills/ljg-paper-flow","original_path":"skills/ljg-paper-flow","tags":["docs","coding","workflow","pdf","research"],"description":"Paper workflow: read papers + cast 取景框 library cards in one go. Takes one or more arxiv links, paper URLs, PDFs, or paper names. For each paper, runs ljg-paper (generates org analysis) then ljg-library (distills the paper's 取景框 into a 2050 library card PNG). Use when user says '论文流', 'paper flow', '读论文并做卡片', '论文卡片', or provides multiple papers wanting both analysis and cards.","added_at":"2026-05-17","version":"1.1.0","extracted_path":"extracted-skills/ljg-skills/ljg-paper-flow"},{"id":"ljg-paper-river","name":"ljg-paper-river","path":"libraries/ljg-skills/skills/ljg-paper-river","original_path":"skills/ljg-paper-river","tags":["docs","coding","research"],"description":"论文倒读法：给一篇论文，递归找出它批判和改进的前序论文（最多5层），再找它之后的最新进展，从源头正向讲述问题演化史。以问题为轴，费曼式讲解每篇论文看到的问题和解法创新。Use when user shares a paper and wants to understand its intellectual lineage, citation chain, problem evolution, or says '倒读', '论文溯源', '论文脉络', 'paper river', 'paper connects', 'trace back', '这篇论文的来龙去脉', '论文演化'. Also trigger when user wants to understand how a research problem evolved across multiple papers.","added_at":"2026-05-17","version":"1.0.0","extracted_path":"extracted-skills/ljg-skills/ljg-paper-river"},{"id":"ljg-paper","name":"ljg-paper","path":"libraries/ljg-skills/skills/ljg-paper","original_path":"skills/ljg-paper","tags":["docs","coding","pdf","research"],"description":"Paper reader for non-academics. Reads a paper and tells it back as one continuous story — the life of the paper's core proposition (命题), told on a seven-beat spine (主角 / 困境 / 旧路 / 转折 / 解法 / 结局 / 内核): born in a bind on a base-rate ruler, crystallized as a bold conjecture, argued through mechanism and evidence, distilled into a new way of seeing, then walked out of the paper — life-tested and cashed into falsifiable predictions (检验). Output opens with a scannable 速读 card (一句话 / 大想法 / 只记三件事) that compresses the whole story three ways for the time-poor reader and the six-months-later self, then tells the full story. The job is storytelling that makes the paper land, not academic critique. Use when user shares an arxiv link, paper URL, PDF, or asks to analyze a research paper. Trigger words: '读论文', '讲论文', '把这篇讲给我听', '分析论文', 'paper', or when user shares an academic paper.","added_at":"2026-05-17","version":"6.1.0","extracted_path":"extracted-skills/ljg-skills/ljg-paper"},{"id":"ljg-plain","name":"ljg-plain","path":"libraries/ljg-skills/skills/ljg-plain","original_path":"skills/ljg-plain","tags":["docs","coding"],"description":"Cognitive atom: Plain (白). Rewrites any content so a smart 12-year-old groks it. Structure-free — form follows content. Use when user says '白话说', '说人话', '解释一下', 'plain', 'grok'.","added_at":"2026-05-17","version":"5.0.0","extracted_path":"extracted-skills/ljg-skills/ljg-plain"},{"id":"ljg-present","name":"ljg-present","path":"libraries/ljg-skills/skills/ljg-present","original_path":"skills/ljg-present","tags":["docs","coding"],"description":"演讲铸造器（Outline-Faithful）。基于 orgmode/markdown outline 层级 1:1 视觉化呈现——色块大字、ultra-bold 错位，原文不动只做美化。三档主题色 black/red/yellow（默认 black 或按 filetags 推断），可用 -r/-b/-y 显式覆盖；可用 --cyber 走黑底绿字 cyber-hacker 风。使用时用户会说：'讲这个'、'present'、'做成演讲'、'呈现一下'、'铸成演示'、'做个 slides'、'标语流'、'宣言体'、'slogan'、'manifesto'、'按 outline 美化'。输出单文件 HTML 到 ~/Downloads/。","added_at":"2026-05-17","version":"3.0.0","extracted_path":"extracted-skills/ljg-skills/ljg-present"},{"id":"ljg-push","name":"ljg-push","path":"libraries/ljg-skills/skills/ljg-push","original_path":"skills/ljg-push","tags":["docs","coding"],"description":"把 ~/.claude/skills/ljg-* 里所有更新过的 skills 同步到 github repo (ljg-skills)，先推 master 分支（org-mode 输出风格），再切 md 分支（markdown 输出风格）做基础 markdown 化后推。Use when user says '/ljg-push', 'push skills', '推送 skills', '同步 skills', 'sync ljg', or whenever ljg-* skills get updated and need shipping. NOT FOR pushing non-ljg skills or arbitrary git repos.","added_at":"2026-05-17","extracted_path":"extracted-skills/ljg-skills/ljg-push"},{"id":"ljg-qa","name":"ljg-qa","path":"libraries/ljg-skills/skills/ljg-qa","original_path":"skills/ljg-qa","tags":["docs","coding","frontend","research"],"description":"信息提问机。给一篇文章/论文/书，把核心观点抽成 Q-A 对——Question 切要害，不教科书；Answer 简洁清晰，有形式化收口，逻辑链完整。读者顺 Q 链走过，每个 A 砸下一枚钉子，复现作者整套推理。Use when user says '问答', 'Q&A', 'QA', '提问', '抽取问题', '/ljg-qa', or shares an article/paper/book and asks for Q-A extraction. Triggers when the user wants ideas extracted not as a summary but as a sequence of incisive questions with answered. NOT FOR FAQ generation, glossary creation, or comprehension quizzes — this is intellectual scaffolding, not study aids.","added_at":"2026-05-17","extracted_path":"extracted-skills/ljg-skills/ljg-qa"},{"id":"ljg-rank","name":"ljg-rank","path":"libraries/ljg-skills/skills/ljg-rank","original_path":"skills/ljg-rank","tags":["docs","coding"],"description":"给一个领域，找出背后真正撑着它的几根独立的力。十几个现象砍到不可再少的生成器——砍完能把现象一个个生回来，才算数。Use when user says '降秩', '找秩', '秩是什么', '这个领域靠什么撑着', '背后是什么', or wants to decompose any domain to its irreducible generators.","added_at":"2026-05-17","extracted_path":"extracted-skills/ljg-skills/ljg-rank"},{"id":"ljg-read","name":"ljg-read","path":"libraries/ljg-skills/skills/ljg-read","original_path":"skills/ljg-read","tags":["docs","coding","frontend","automation","research"],"description":"Reading companion agent. Accompanies user through any text (books, articles, essays, papers, news) with translation, structural annotation, deep questioning, and cross-domain insights. Detects language, translates English to Chinese (faithfulness-expressiveness-elegance), guides reader to understand the author and encounter real questions. Use when user says '伴读', '陪我读', '读这篇', 'read with me', 'companion read', or shares a text/URL wanting guided reading.","added_at":"2026-05-17","version":"1.0.0","extracted_path":"extracted-skills/ljg-skills/ljg-read"},{"id":"ljg-relationship","name":"ljg-relationship","path":"libraries/ljg-skills/skills/ljg-relationship","original_path":"skills/ljg-relationship","tags":["docs","coding"],"description":"Relationship analyst combining structural diagnostics (5-layer framework) with psychoanalytic depth (transference, unconscious patterns, resistance). Guides users through dialogue to \"see\" the real structure of their relationship issues. Use when user says \"关系分析\", \"分析关系\", \"relationship\", \"人际关系\", or describes a specific relationship problem they want to understand.","added_at":"2026-05-17","extracted_path":"extracted-skills/ljg-skills/ljg-relationship"},{"id":"ljg-roundtable","name":"ljg-roundtable","path":"libraries/ljg-skills/skills/ljg-roundtable","original_path":"skills/ljg-roundtable","tags":["docs","coding","data"],"description":"Structured roundtable discussion framework with a truth-seeking moderator who invites representative figures for dialectical debate on any topic. Use when user says \"圆桌讨论\", \"圆桌\", \"roundtable\", \"辩论\", or wants to explore a topic through multi-perspective structured debate.","added_at":"2026-05-17","extracted_path":"extracted-skills/ljg-skills/ljg-roundtable"},{"id":"ljg-skill-map","name":"ljg-skill-map","path":"libraries/ljg-skills/skills/ljg-skill-map","original_path":"skills/ljg-skill-map","tags":["docs","coding"],"description":"Skill map viewer. Scans all installed skills and renders a visual overview — name, version, description, category at a glance. Use when user says 'skills', '技能', '技能地图', 'skill map', '我有哪些技能', '看看技能', '列出技能', 'list skills'. Also trigger when user asks what skills are available or installed.","added_at":"2026-05-17","version":"1.0.0","extracted_path":"extracted-skills/ljg-skills/ljg-skill-map"},{"id":"ljg-think","name":"ljg-think","path":"libraries/ljg-skills/skills/ljg-think","original_path":"skills/ljg-think","tags":["docs","coding"],"d     const REPO_URL = "https://github.com/Jst-Well-Dan/Skills-Hub";

    const state = {
      query: "",
      category: "all",
      tag: "all",
      source: "all",
      sort: "name",
      view: "grid",
      selected: null,
    };

    const data = window.SKILL_HUB_DATA;
    const el = (id) => document.getElementById(id);
    const text = (value) => String(value ?? "");
    const categoryLabel = (id) => data.category_labels[id] || id || "未分类";
    const sourceOf = (project) => project.source?.repo || project.source?.type || "local";
    const sourceUrl = (project) => project.source?.repo
      ? `https://github.com/${project.source.repo}`
      : `${REPO_URL}/tree/main/${project.path}`;
    const normalize = (value) => text(value).toLowerCase();
    const readableText = (value) => text(value).replaceAll("—", " - ").replaceAll("–", "-");

    function escapeHtml(value) {
      return readableText(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function projectHaystack(project) {
      const skills = (project.skills || []).flatMap((skill) => [
        skill.name, skill.id, skill.description, skill.path, ...(skill.tags || [])
      ]);
      return normalize([
        project.name, project.id, project.description, project.path, categoryLabel(project.category),
        ...(project.tags || []), sourceOf(project), ...skills
      ].join(" "));
    }

    function matches(project) {
      if (state.category !== "all" && project.category !== state.category) return false;
      if (state.tag !== "all" && !(project.tags || []).includes(state.tag)) return false;
      if (state.source !== "all" && sourceOf(project) !== state.source) return false;
      const terms = normalize(state.query).split(/\s+/).filter(Boolean);
      return terms.every((term) => projectHaystack(project).includes(term));
    }

    function sortProjects(projects) {
      const sorted = [...projects];
      sorted.sort((a, b) => {
        if (state.sort === "skills") return (b.skill_count || 0) - (a.skill_count || 0) || a.name.localeCompare(b.name);
        if (state.sort === "updated") return text(b.last_checked_at).localeCompare(text(a.last_checked_at)) || a.name.localeCompare(b.name);
        if (state.sort === "category") return categoryLabel(a.category).localeCompare(categoryLabel(b.category)) || a.name.localeCompare(b.name);
        return a.name.localeCompare(b.name);
      });
      return sorted;
    }

    function renderStats(projects) {
      const skillCount = projects.reduce((sum, project) => sum + (project.skill_count || 0), 0);
      const categories = new Set(projects.map((project) => project.category || "uncategorized")).size;
      const tags = new Set(projects.flatMap((project) => project.tags || [])).size;
      const stats = [
        ["项目", projects.length],
        ["Skills", skillCount],
        ["分类", categories],
        ["标签", tags],
      ];
      el("stats").innerHTML = stats.map(([label, value]) => `
        <div class="stat">
          <div class="stat-label">${label}</div>
          <div class="stat-value">${value}</div>
        </div>
      `).join("");
    }

    function renderFacet(containerId, items, key) {
      const active = state[key];
      const allLabel = key === "category" ? "全部分类" : key === "tag" ? "全部标签" : "全部来源";
      const buttons = [{ id: "all", label: allLabel, count: data.summary.project_count }, ...items]
        .map((item) => `
          <button class="facet ${active === item.id ? "active" : ""}" data-filter-key="${key}" data-filter-value="${escapeHtml(item.id)}" title="${escapeHtml(item.label)}">
            <span>${escapeHtml(item.label)}</span>
            <span class="count">${item.count}</span>
          </button>
        `).join("");
      el(containerId).innerHTML = buttons;
    }

    function renderFilters() {
      renderFacet("categoryFilters", data.facets.categories, "category");
      renderFacet("tagFilters", data.facets.tags, "tag");
      renderFacet("sourceFilters", data.facets.sources, "source");
    }

    function projectCard(project) {
      const tags = (project.tags || []).slice(0, 7).map((tag) => `<span class="tag">${escapeHtml(tag)}</span>`).join("");
      const sourceLabel = project.source?.repo ? "GitHub" : "查看目录";
      return `
        <article class="project-card">
          <button class="project-main" data-project-id="${escapeHtml(project.id)}">
            <div class="project-row">
              <h3 class="project-name">${escapeHtml(project.name)}</h3>
              <span class="badge">${project.skill_count || 0} skills</span>
            </div>
            <p class="description">${escapeHtml(project.description || "暂无简介")}</p>
            <div class="tags">${tags}</div>
          </button>
          <div class="project-foot">
            <span class="path">${escapeHtml(project.path)}</span>
            <span class="card-category">${escapeHtml(categoryLabel(project.category))}</span>
            <a class="github-link" href="${escapeHtml(sourceUrl(project))}" target="_blank" rel="noreferrer" aria-label="在 GitHub 打开 ${escapeHtml(project.name)}">${sourceLabel}</a>
          </div>
        </article>
      `;
    }

    function renderProjects(projects) {
      const grid = el("projectGrid");
      grid.className = state.view === "list" ? "project-list" : "project-grid";
      if (!projects.length) {
        grid.innerHTML = '<div class="empty">没有匹配的 skill 库</div>';
        return;
      }
      grid.innerHTML = projects.map(projectCard).join("");
    }

    function renderDrawer(project) {
      if (!project) return;
      state.selected = project.id;
      el("drawerTitle").textContent = project.name;
      el("drawerDescription").textContent = readableText(project.description || "暂无简介");
      el("drawerSourceLink").href = sourceUrl(project);
      el("drawerSourceLink").textContent = project.source?.repo ? "打开 GitHub" : "查看项目目录";
      const install = project.install?.command || project.install?.method || "未记录";
      const skills = [...(project.skills || [])].sort((a, b) => a.name.localeCompare(b.name));
      const skillHtml = skills.map((skill) => `
        <article class="skill-item">
          <div class="skill-top">
            <div class="skill-name">${escapeHtml(skill.name)}</div>
            <span class="badge">${escapeHtml(skill.id)}</span>
          </div>
          <p class="skill-description">${escapeHtml(skill.description || "暂无简介")}</p>
          <div class="links">
            <a class="text-link" href="${REPO_URL}/blob/main/${escapeHtml(skill.path)}/SKILL.md">查看 SKILL.md</a>
            ${skill.extracted_path ? `<a class="text-link" href="${REPO_URL}/tree/main/${escapeHtml(skill.extracted_path)}">复制目录</a>` : ""}
          </div>
        </article>
      `).join("");

      el("drawerBody").innerHTML = `
        <div class="detail-grid">
          <div class="detail"><div class="detail-label">分类</div><div class="detail-value">${escapeHtml(categoryLabel(project.category))}</div></div>
          <div class="detail"><div class="detail-label">来源</div><div class="detail-value">${escapeHtml(sourceOf(project))}</div></div>
          <div class="detail"><div class="detail-label">安装</div><div class="detail-value">${escapeHtml(install)}</div></div>
          <div class="detail"><div class="detail-label">路径</div><div class="detail-value">${escapeHtml(project.path)}</div></div>
        </div>
        <div class="tags">${(project.tags || []).map((tag) => `<span class="tag">${escapeHtml(tag)}</span>`).join("")}</div>
        <h3 class="section-title">Skills</h3>
        <div class="skill-list">${skillHtml}</div>
      `;
      el("drawer").classList.add("open");
      el("drawer").setAttribute("aria-hidden", "false");
    }

    function closeDrawer() {
      el("drawer").classList.remove("open");
      el("drawer").setAttribute("aria-hidden", "true");
      state.selected = null;
    }

    function render() {
      const projects = sortProjects(data.projects.filter(matches));
      renderStats(projects);
      renderFilters();
      renderProjects(projects);
      el("resultMeta").textContent = `显示 ${projects.length} / ${data.summary.project_count} 个项目`;
      el("generatedAt").textContent = `${data.summary.project_count} 个库 / ${data.summary.skill_count} 个 skills / ${data.generated_at}`;
      document.querySelectorAll(".segment").forEach((button) => {
        button.classList.toggle("active", button.dataset.view === state.view);
      });
    }

    document.addEventListener("click", (event) => {
      const filter = event.target.closest("[data-filter-key]");
      if (filter) {
        state[filter.dataset.filterKey] = filter.dataset.filterValue;
        render();
        return;
      }
      const projectButton = event.target.closest("[data-project-id]");
      if (projectButton) {
        renderDrawer(data.projects.find((project) => project.id === projectButton.dataset.projectId));
      }
    });

    el("searchInput").addEventListener("input", (event) => {
      state.query = event.target.value;
      render();
    });
    el("clearSearch").addEventListener("click", () => {
      state.query = "";
      el("searchInput").value = "";
      render();
    });
    el("sortSelect").addEventListener("change", (event) => {
      state.sort = event.target.value;
      render();
    });
    document.querySelectorAll(".segment").forEach((button) => {
      button.addEventListener("click", () => {
        state.view = button.dataset.view;
        render();
      });
    });
    el("closeDrawer").addEventListener("click", closeDrawer);
    el("drawerBackdrop").addEventListener("click", closeDrawer);
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") closeDrawer();
    });

    render();
  </script>
</body>
</html>
