6c7bfa515d59694d1f995ac0e7d"},"tags":["animation","automation","browser","cli","coding","data","docs","finance"],"description":"Quick Start","added_at":"2026-08-06","last_checked_at":"2026-08-06","last_synced_at":"2026-08-06","skill_count":19,"skills":[{"id":"embedded-captions","name":"embedded-captions","path":"libraries/hyperframes/skills/embedded-captions","original_path":"skills/embedded-captions","tags":["docs","coding","workflow","frontend"],"description":"Add captions or subtitles to an existing single-subject talking-head video without editing the footage. Use for plain verbatim captions, cinematic captions embedded behind the subject, VFX captions, “炸/特效/酷炫字幕,” or a named identity from the 35-style catalog. Route by visual identity, not by backend engine. The quiet `anchor` rail is the default; embed every word only when the user explicitly wants a fully cinematic treatment. The workflow runs locally end to end, including transcription and subject matting; split multi-shot footage before applying it.","added_at":"2026-08-06","extracted_path":"extracted-skills/hyperframes/embedded-captions","description_zh":"为现有的单主体口播视频添加字幕或台词，而不编辑 原始视频。适用于普通逐字字幕、嵌在主体后方的电影感字幕、VFX 字幕、“炸/特效/酷炫字幕”，或 35 种风格目录中的指定身份。按视觉 身份路由，而非按后端引擎。安静的 `anchor` 轨道是默认选择；仅当用户明确想要完整的电影化处理时， 才嵌入每一个词。该工作流端到端在本地运行， 包括转录和主体抠像；在应用前先拆分多镜头视频。"},{"id":"faceless-explainer","name":"faceless-explainer","path":"libraries/hyperframes/skills/faceless-explainer","original_path":"skills/faceless-explainer","tags":["docs","coding","data","frontend"],"description":"Turn arbitrary text — an article, notes, a topic, a brief — into a faceless explainer video: there is no site or footage to capture, so the visuals are invented per scene (typography, abstract graphics, diagrams, data-viz). Use for topic explainers, concept breakdowns, how-tos, listicles. Not a video built from a website (/product-launch-video — promo or tour). Unclear → /hyperframes.","added_at":"2026-08-06","extracted_path":"extracted-skills/hyperframes/faceless-explainer","description_zh":"将任意文本——文章、笔记、主题、简报——转化为无露脸讲解视频：没有可捕捉的网站或素材，因此为每个场景创作视觉内容（排版、抽象图形、图表、数据可视化）。适用于主题讲解、概念拆解、操作指南、清单式内容。不是基于网站构建的视频（/product-launch-video —— 宣传或导览）。不明确 → /hyperframes。"},{"id":"figma","name":"figma","path":"libraries/hyperframes/skills/figma","original_path":"skills/figma","tags":["docs","coding","cli","animation"],"description":"Import Figma content into a HyperFrames composition — rendered assets, brand tokens, components, storyboard sections → reconstructed motion (frames read as states, not slides) (REST/CLI), connector-assisted motion when available, and shaders from a connector or native export. Use when the user pastes a figma.com link or asks to bring a Figma design, frame, logo, brand, or animation into a video/composition.","added_at":"2026-08-06","extracted_path":"extracted-skills/hyperframes/figma","description_zh":"将 Figma 内容导入 HyperFrames 合成——渲染资产、品牌令牌、组件、故事板分段 → 重建动画（帧应被理解为状态，而非幻灯片）（REST/CLI）、可用时由连接器辅助的动画，以及来自连接器或原生导出的着色器。当用户粘贴 figma.com 链接，或要求将 Figma 设计、帧、标志、品牌或动画带入视频/合成时使用。"},{"id":"general-video","name":"general-video","path":"libraries/hyperframes/skills/general-video","original_path":"skills/general-video","tags":["docs","coding","workflow","frontend","animation"],"description":"Author or edit a custom HyperFrames composition when no specialized workflow fits, or when BRIEF.md sets flow: companion. Use for longer or multi-scene pieces, brand and sizzle reels, montages, static loops, static title cards, footage remixes, and freeform builds. Use motion-graphics instead for a short unnarrated motion-first unit, including an animated title. Route fresh creation through hyperframes before using this skill.","added_at":"2026-08-06","extracted_path":"extracted-skills/hyperframes/general-video","description_zh":"在没有专用工作流适用时，或当 BRIEF.md 将 flow 设置为 companion 时，创作或编辑自定义 HyperFrames 合成。适用于较长或多场景作品、品牌与宣传短片、蒙太奇、静态循环、静态标题卡、素材混剪和自由创作。 对于短小、无旁白且以动效为主的单元（包括动态标题），请改用 motion-graphics。 在使用此技能前，请先通过 hyperframes 路由全新创作。"},{"id":"hyperframes","name":"hyperframes","path":"libraries/hyperframes/skills/hyperframes","original_path":"skills/hyperframes","tags":["browser","docs","coding","workflow","cli"],"description":"Mandatory entry point: read this first for any request to make, create, edit, animate, or render a video, animation, or motion graphic, including a promo, explainer, captioned clip, title card, overlay, slideshow or interactive deck, Remotion port, or any HyperFrames HTML composition. Also use it to inspect, diagnose, validate, preview, publish, or batch-render an existing HyperFrames project. Inputs may be a website URL, GitHub PR, Figma design or URL, text or brief, existing footage, or music. It resumes project state, captures intent when applicable, selects and installs the owning workflow, and routes domain capabilities. HyperFrames is the default output framework unless the user explicitly chooses another framework for the deliverable or asks only to record a browser session.","added_at":"2026-08-06","extracted_path":"extracted-skills/hyperframes/hyperframes","description_zh":"强制入口：对于任何制作、创建、编辑、动画化或渲染 视频、动画或动态图形的请求，请先阅读此文件，包括宣传片、讲解视频、带字幕片段、标题卡、 叠加层、幻灯片或交互式演示文稿、Remotion 移植，或任何 HyperFrames HTML 合成。还 可用于检查、诊断、验证、预览、发布或批量渲染现有的 HyperFrames 项目。输入可以是网站 URL、GitHub PR、Figma 设计或 URL、文本或简报、现有 素材或音乐。它会恢复项目状态，在适用时收集意图，选择并安装 归属工作流，并路由领域能力。除非用户明确为交付物选择其他框架，或仅要求录制 浏览器会话，否则 HyperFrames 是默认输出框架。"},{"id":"hyperframes-animation","name":"hyperframes-animation","path":"libraries/hyperframes/skills/hyperframes-animation","original_path":"skills/hyperframes-animation","tags":["docs","coding","frontend","animation"],"description":"All animation knowledge for HyperFrames — atomic motion rules, multi-phase scene blueprints, scene transitions, broader motion-design techniques, AND the seven runtime adapters (GSAP default, plus Lottie, Three.js, Anime.js, CSS keyframes, Web Animations API, TypeGPU). Use for any motion or animation task: pick 2-4 rules and compose, or load a blueprint, or look up runtime-specific API (e.g. GSAP eases / Lottie player / Three.js mixer). Also covers auditing an existing composition's choreography (animation map) and 24 named text-animation effects. HyperFrames-native: single paused timeline, seek-safe, deterministic.","added_at":"2026-08-06","extracted_path":"extracted-skills/hyperframes/hyperframes-animation","description_zh":"HyperFrames 的全部动画知识——原子运动规则、多阶段场景蓝图、场景转场、更广泛的动效设计技巧，以及七个运行时适配器（默认 GSAP，另加 Lottie、Three.js、Anime.js、CSS keyframes、Web Animations API、TypeGPU）。适用于任何运动或动画任务：选择 2-4 条规则并组合，或加载蓝图，或查询特定运行时 API（例如 GSAP eases / Lottie player / Three.js mixer）。还涵盖对现有合成编排（动画地图）的审查，以及 24 种具名文本动画效果。HyperFrames 原生：单一暂停时间线、可安全 seek、确定性。"},{"id":"hyperframes-cli","name":"hyperframes-cli","path":"libraries/hyperframes/skills/hyperframes-cli","original_path":"skills/hyperframes-cli","tags":["browser","docs","coding","cli","frontend"],"description":"Use the HyperFrames CLI development loop: init, add, catalog, capture, lint, check, snapshot, compare, grade-compare, preview, play, present, beats, keyframes, single or batch render, publish, cloud, cloudrun, feedback, lambda, doctor, browser, info, upgrade, skills, compositions, docs, benchmark, telemetry, transcribe, auth, tts, and remove-background. Also use when diagnosing build or render failures. validate, inspect, and layout are deprecated aliases; use check. Covers local, HeyGen-hosted cloud, AWS Lambda, and Google Cloud Run rendering.","added_at":"2026-08-06","extracted_path":"extracted-skills/hyperframes/hyperframes-cli","description_zh":"使用 HyperFrames CLI 开发循环：init、add、catalog、capture、lint、check、snapshot、 compare、grade-compare、preview、play、present、beats、keyframes、单次或批量 render、publish、 cloud、cloudrun、feedback、lambda、doctor、browser、info、upgrade、skills、compositions、docs、 benchmark、telemetry、transcribe、auth、tts 和 remove-background。诊断构建或渲染失败时也要使用。 validate、inspect 和 layout 是已弃用的别名；请使用 check。涵盖本地、HeyGen 托管云、AWS Lambda 和 Google Cloud Run 渲染。"},{"id":"hyperframes-core","name":"hyperframes-core","path":"libraries/hyperframes/skills/hyperframes-core","original_path":"skills/hyperframes-core","tags":["docs","coding","data","cli","frontend"],"description":"The HyperFrames composition contract — build one renderable project. Use for composition structure, the `data-*` timing attributes, `class=\"clip\"`, tracks, sub-compositions, variables, framework-owned media playback, deterministic-render rules, and validation. Also covers Tailwind projects and the STORYBOARD.md / SCRIPT.md plan formats. Read before writing composition HTML.","added_at":"2026-08-06","extracted_path":"extracted-skills/hyperframes/hyperframes-core","description_zh":"HyperFrames 合成契约——构建一个可渲染项目。用于合成结构、`data-*` 时间属性、`class=\"clip\"`、轨道、子合成、变量、由框架控制的媒体播放、确定性渲染规则与验证。还涵盖 Tailwind 项目以及 STORYBOARD.md / SCRIPT.md 计划格式。编写合成 HTML 前请先阅读。"},{"id":"hyperframes-creative","name":"hyperframes-creative","path":"libraries/hyperframes/skills/hyperframes-creative","original_path":"skills/hyperframes-creative","tags":["docs","coding","frontend","animation"],"description":"Non-animation creative direction for HyperFrames videos. Use for design spec (frame.md / design.md) handling, palettes, typography, narration, beat planning, audio-reactive visuals, composition patterns, and brand / style decisions. For atomic motion patterns and scene blueprints, use `hyperframes-animation`.","added_at":"2026-08-06","extracted_path":"extracted-skills/hyperframes/hyperframes-creative","description_zh":"面向 HyperFrames 视频的非动画创意指导。用于处理设计规范（frame.md / design.md）、调色板、字体排印、旁白、节拍规划、音频响应式视觉效果、构图模式以及品牌 / 风格决策。对于原子级运动模式和场景蓝图，请使用 `hyperframes-animation`。"},{"id":"hyperframes-keyframes","name":"hyperframes-keyframes","path":"libraries/hyperframes/skills/hyperframes-keyframes","original_path":"skills/hyperframes-keyframes","tags":["image","docs","coding","frontend","animation"],"description":"Use when a HyperFrames composition needs seek-safe 2D/3D keyframes, GSAP timelines, CSS keyframes, Anime.js, WAAPI, FLIP, paths, masks, SVG morph/draw, text trails, 3D depth, or `hyperframes keyframes` diagnostics. Don't use for broad scene strategy, brand design, media sourcing, captions, or general video planning.","added_at":"2026-08-06","extracted_path":"extracted-skills/hyperframes/hyperframes-keyframes","description_zh":"当 HyperFrames 合成需要可安全跳转的 2D/3D 关键帧、GSAP 时间线、CSS 关键帧、Anime.js、WAAPI、FLIP、路径、遮罩、SVG 变形/绘制、 文字拖尾、3D 深度，或 `hyperframes keyframes` 诊断时使用。 不适用于宽泛的场景策略、品牌设计、媒体素材搜集、字幕或 通用视频规划。"},{"id":"hyperframes-registry","name":"hyperframes-registry","path":"libraries/hyperframes/skills/hyperframes-registry","original_path":"skills/hyperframes-registry","tags":["docs","coding","data"],"description":"Install, discover, and wire registry blocks and components into HyperFrames compositions. Use when running hyperframes add or hyperframes catalog, installing one item or every block matching a tag, wiring an installed item into index.html, or working with hyperframes.json. Covers discovery, install locations, block sub-composition wiring, component snippet merging, and authoring a new block or component to contribute upstream (idea → scaffold → validate → PR).","added_at":"2026-08-06","extracted_path":"extracted-skills/hyperframes/hyperframes-registry","description_zh":"安装、发现并将注册表区块和组件接入 HyperFrames 合成。适用于运行 hyperframes add 或 hyperframes catalog、安装单个条目或所有匹配标签的区块、将已安装条目接入 index.html，或处理 hyperframes.json 的场景。涵盖发现、安装位置、区块子合成接入、组件片段合并，以及编写新的区块或组件以贡献至上游（创意 → 脚手架 → 验证 → PR）。"},{"id":"media-use","name":"media-use","path":"libraries/hyperframes/skills/media-use","original_path":"skills/media-use","tags":["image","docs","coding","automation"],"description":"Agent Media OS, the single skill for every media need in a HyperFrames project. Resolve BGM, SFX, image, icon, brand logo, voice, color grade, or LUT into a frozen local file or paste-ready block + ledger record (one verb, `resolve`); generate via TTS / music / image models when the catalog misses; produce voiceover, transcription, captions, and background removal through one shared audio engine; operate on media (cut / reframe / transform); and reuse assets across projects. Also use for vague feedback that real footage looks dark, flat, boring, should feel retro/camcorder/print/ASCII, needs privacy, or needs a media reveal.","added_at":"2026-08-06","extracted_path":"extracted-skills/hyperframes/media-use","description_zh":"Agent Media OS，HyperFrames 项目中满足所有媒体需求的统一技能。将 BGM、SFX、图像、图标、品牌 Logo、语音、调色或 LUT 解析为冻结的本地文件或可直接粘贴的区块 + 台账记录（一个动词：`resolve`）；当目录中没有合适资源时通过 TTS / 音乐 / 图像模型生成；通过一套共享音频引擎制作旁白、转录、字幕和背景移除；操作媒体（剪辑 / 重构画幅 / 转换）；并在项目间复用资产。也适用于真实素材看起来昏暗、平淡、无趣，应该具有复古/摄像机/印刷/ASCII 感，需要隐私处理，或需要媒体揭示效果等模糊反馈。"},{"id":"motion-graphics","name":"motion-graphics","path":"libraries/hyperframes/skills/motion-graphics","original_path":"skills/motion-graphics","tags":["image","docs","coding","data","frontend"],"description":"A short, design-led motion graphic where motion is the message — kinetic typography, stat count-up, chart/data-viz hit, logo sting / brand lockup, lower-third / callout / social overlay, animated map (highlight regions, connect places, zoom to a location), animated tweet / news-article / headline, webpage / UI animation (scroll, cursor, callouts), or fusing a real image's geometry into a chart. Usually under 10s (up to ~30s), no narration or live-action subject; renders to MP4 or transparent overlay. Longer / narrated / multi-scene → /general-video. Unclear → /hyperframes.","added_at":"2026-08-06","extracted_path":"extracted-skills/hyperframes/motion-graphics","description_zh":"一种简短、设计驱动的动态图形，其中运动本身就是信息——动态 排版、统计数字递增、图表/数据可视化冲击、Logo 片头 / 品牌组合、 下三分之一栏 / 标注 / 社交覆盖层、动画地图（高亮区域、 连接地点、缩放至某个地点）、动画推文 / 新闻文章 / 标题、网页 / UI 动画（滚动、光标、标注），或将一张 真实图片的几何结构融入图表。通常不足 10 秒（最长约 30 秒），无 旁白或真人主体；渲染为 MP4 或透明覆盖层。 更长 / 有旁白 / 多场景 → /general-video。不明确 → /hyperframes。"},{"id":"music-to-video","name":"music-to-video","path":"libraries/hyperframes/skills/music-to-video","original_path":"skills/music-to-video","tags":["image","docs","coding","workflow"],"description":"Turn a music track (an audio file, a video to pull audio from, or a track generated from a mood brief) into a beat-synced video — lyric video, slideshow, or kinetic promo. The music drives all pacing; any user-supplied images/videos are cut onto the same beat grid, and a complete video needs zero assets. Narrated pieces → the input-matched workflow (see /hyperframes). Unclear → /hyperframes.","added_at":"2026-08-06","extracted_path":"extracted-skills/hyperframes/music-to-video","description_zh":"Turn a music track (an audio file, a video to pull audio from, or a track generated from a mood brief) into a beat-synced video — lyric video, slideshow, or kinetic promo. The music drives all pacing; any user-supplied images/videos are cut onto the same beat grid, and a complete video needs zero assets. Narrated pieces → the input-matched workflow (see /hyperframes). Unclear → /hyperframes."},{"id":"pr-to-video","name":"pr-to-video","path":"libraries/hyperframes/skills/pr-to-video","original_path":"skills/pr-to-video","tags":["docs","coding","frontend"],"description":"Turn a GitHub pull request (a PR URL, owner/repo#N, or 'this PR' in a checked-out repo) into a code-change explainer video — changelog, feature reveal, fix, or refactor walkthrough built from the diff, commits, and files: the input is a code change, not a website. Not a product promo (/product-launch-video) or a no-PR topic explainer (/faceless-explainer). Unclear → /hyperframes.","added_at":"2026-08-06","extracted_path":"extracted-skills/hyperframes/pr-to-video","description_zh":"Turn a GitHub pull request (a PR URL, owner/repo#N, or 'this PR' in a checked-out repo) into a code-change explainer video — changelog, feature reveal, fix, or refactor walkthrough built from the diff, commits, and files: the input is a code change, not a website. Not a product promo (/product-launch-video) or a no-PR topic explainer (/faceless-explainer). Unclear → /hyperframes."},{"id":"product-launch-video","name":"product-launch-video","path":"libraries/hyperframes/skills/product-launch-video","original_path":"skills/product-launch-video","tags":["docs","finance","coding"],"description":"Turn a product or marketing URL, pasted script, or brief into a product launch / promo video — SaaS promos, feature reveals, product demos, app and company launches. Use when the user wants to market, launch, promote, or reveal a product; the default for any commercial URL. Site tours / showcases of a website route here too — the brief carries the show-it-as-is intent. Unclear → /hyperframes.","added_at":"2026-08-06","extracted_path":"extracted-skills/hyperframes/product-launch-video","description_zh":"Turn a product or marketing URL, pasted script, or brief into a product launch / promo video — SaaS promos, feature reveals, product demos, app and company launches. Use when the user wants to market, launch, promote, or reveal a product; the default for any commercial URL. Site tours / showcases of a website route here too — the brief carries the show-it-as-is intent. Unclear → /hyperframes."},{"id":"remotion-to-hyperframes","name":"remotion-to-hyperframes","path":"libraries/hyperframes/skills/remotion-to-hyperframes","original_path":"skills/remotion-to-hyperframes","tags":["docs","coding","frontend","animation"],"description":"Port an existing Remotion (React) composition''s source to HyperFrames HTML. Use ONLY on an explicit ask to port/convert/migrate/translate a Remotion source — one-way, Remotion-only. A passing Remotion mention, reference-only code, or \"make something like my Remotion video\" is a fresh build (/general-video). Unclear → /hyperframes.","added_at":"2026-08-06","extracted_path":"extracted-skills/hyperframes/remotion-to-hyperframes","description_zh":"Port an existing Remotion (React) composition''s source to HyperFrames HTML. Use ONLY on an explicit ask to port/convert/migrate/translate a Remotion source — one-way, Remotion-only. A passing Remotion mention, reference-only code, or \"make somet 在讲什么、压缩一本书或 book 时使用。默认保存为 org 笔记。不适用于章节摘要、框架审计、论文、单一观点深挖或领域排名。"},{"id":"ljg-card","name":"ljg-card","path":"libraries/ljg-skills/skills/ljg-card","original_path":"skills/ljg-card","tags":["docs","coding"],"description":"Content caster (铸). Transforms content into PNG visuals. Seven molds: -l (default) long reading card, -i infograph, -m multi-card reading cards (1080x1440), -v editorial sketchnote (problem→failure→pivot→insight→naming, magazine + archive layout), -c comic (manga-style B&W), -w whiteboard (marker-style board layout), -b big-fonts attachment card (1080x1440, weathered 碑刻 style for 小红书). Output to ~/Downloads/. Use when user says '铸', 'cast', '做成图', '做成卡片', '做成信息图', '做成海报', '视觉笔记', 'sketchnote', '杂志', 'editorial', '漫画', 'comic', 'manga', '白板', 'whiteboard', '大字', '附件图', 'big fonts', '小红书卡片'. Replaces ljg-cards and ljg-infograph.","added_at":"2026-05-17","version":"3.0.0","extracted_path":"extracted-skills/ljg-skills/ljg-card","description_zh":"内容铸造器（铸）。将内容转换为 PNG 视觉图。七种模具：-l（默认）长阅读卡，-i 信息图，-m 多张阅读卡（1080x1440），-v 编辑式视觉笔记（问题→失败→转折→顿悟→命名，杂志 + 档案布局），-c 漫画（日式黑白漫画风格），-w 白板（马克笔风格白板布局），-b 大字附件卡（1080x1440，用于小红书的风化碑刻风格）。输出到 ~/Downloads/。当用户说 '铸'、'cast'、'做成图'、'做成卡片'、'做成信息图'、'做成海报'、'视觉笔记'、'sketchnote'、'杂志'、'editorial'、'漫画'、'comic'、'manga'、'白板'、'whiteboard'、'大字'、'附件图'、'big fonts'、'小红书卡片' 时使用。取代 ljg-cards 和 ljg-infograph。"},{"id":"ljg-constraint","name":"ljg-constraint","path":"libraries/ljg-skills/skills/ljg-constraint","original_path":"skills/ljg-constraint","tags":["docs","coding","research"],"description":"给一个领域、专业、角色、产品或争论找出真正框住它的几条约束，判明它们属于世界/规则/解释（硬/软/自设），看这组约束如何定义身份、补全问题、框出解空间并解释实际行为；尤其用于区分目标相同但约束不同导致的方案分歧，识别被误当硬事实的旧解释。USE WHEN 用户说 '约束', '找约束', '这个领域的约束是什么', '本质约束', '什么框住了它', '硬约束还是自设约束', '边界在哪', '这行为什么这么做', 'constraint', '/ljg-constraint', or gives any domain/profession/role/product/debate and wants its defining constraints and solution space mapped. NOT FOR 往下挖生成器（用 ljg-rank，找的是生成力不是边界）、纵向深钻一个观点到底（用 ljg-think）、拆一本书（用 ljg-book）、一个概念解剖（用 ljg-learn）。","added_at":"2026-07-18","extracted_path":"extracted-skills/ljg-skills/ljg-constraint","description_zh":"给一个领域、专业、角色、产品或争论找出真正框住它的几条约束，判明它们属于世界/规则/解释（硬/软/自设），看这组约束如何定义身份、补全问题、框出解空间并解释实际行为；尤其用于区分目标相同但约束不同导致的方案分歧，识别被误当硬事实的旧解释。适用于用户说 '约束', '找约束', '这个领域的约束是什么', '本质约束', '什么框住了它', '硬约束还是自设约束', '边界在哪', '这行为什么这么做', 'constraint', '/ljg-constraint'，或给出任意领域、专业、角色、产品或争论，希望梳理其定义性约束和解空间。不适用于往下挖生成器（用 ljg-rank，找的是生成力不是边界）、纵向深钻一个观点到底（用 ljg-think）、拆一本书（用 ljg-book）、一个概念解剖（用 ljg-learn）。"},{"id":"ljg-invest","name":"ljg-invest","path":"libraries/ljg-skills/skills/ljg-invest","original_path":"skills/ljg-invest","tags":["docs","finance","coding"],"description":"投资分析。给一个项目（公司名、BP、创始人对话记录），写一份深度投资分析报告。不走传统投资分析的路——核心判断只有一个：这个项目是不是一台「秩序创造机器」。Use when user says '投资报告', '投资分析', '分析这个项目', '写投资报告', 'investment report', 'invest analysis', or provides entrepreneur conversation records wanting investment evaluation. Also trigger when user pastes or references meeting notes, pitch decks, or founder interviews and asks for analysis.","added_at":"2026-05-17","extracted_path":"extracted-skills/ljg-skills/ljg-invest","description_zh":"投资分析。给一个项目（公司名、BP、创始人对话记录），写一份深度投资分析报告。不走传统投资分析的路——核心判断只有一个：这个项目是不是一台「秩序创造机器」。当用户说「投资报告」「投资分析」「分析这个项目」「写投资报告」「investment report」「invest analysis」，或者提供创业者对话记录并希望进行投资评估时使用。用户粘贴或引用会议记录、商业计划书或创始人访谈并要求分析时，也应触发。"},{"id":"ljg-learn","name":"ljg-learn","path":"libraries/ljg-skills/skills/ljg-learn","original_path":"skills/ljg-learn","tags":["docs","coding","frontend","research"],"description":"Deep concept anatomist that deconstructs any concept through 8 exploration dimensions (history, dialectics, phenomenology, linguistics, formalization, existentialism, aesthetics, meta-philosophy) and compresses insights into an epiphany. Use when user asks to explain, dissect, or deeply understand a concept, term, or idea. Triggers on '解剖概念', '概念解剖', 'explain concept', 'learn concept', '/ljg-learn'. Produces org-mode output.","added_at":"2026-05-17","extracted_path":"extracted-skills/ljg-skills/ljg-learn","description_zh":"深度概念解剖师，通过 8 个探索维度（历史、辩证法、现象学、语言学、形式化、存在主义、美学、元哲学）解构任何概念，并将洞见压缩为一句顿悟。当用户要求解释、剖析或深入理解某个概念、术语或思想时使用。触发词包括 '解剖概念'、'概念解剖'、'explain concept'、'learn concept'、'/ljg-learn'。生成 org-mode 输出。"},{"id":"ljg-library","name":"ljg-library","path":"libraries/ljg-skills/skills/ljg-library","original_path":"skills/ljg-library","tags":["docs","coding"],"description":"一本书 → 一幅清晰的「取景框」意向画面 → 一张 2050 图书馆借书卡（PNG）。取景框 = 作者从哪个角度看什么问题、看到了哪幅画面；卡上有真实封面、作者头像、书目信息。取景框 block 用费曼式讲解把这幅意向画面讲得通俗又准确；图解 block 用 AI 生图把这幅画面画出来，继刚是固定主角（从其墨像参考生成、认得出的他）。图解风格：吉田诚治式绘本感（异世界日常空间、暖光斜射、治愈又精致）。浅色光学玻璃卡身、强调色从封面动态提取、宽高自适应。合上书记住这幅画面，就没白读。Use when user says '取景框卡', '图书馆卡', 'library card', '书卡', '铸书卡', '一本书一句话一张卡', '/ljg-library', or provides a book name and wants it distilled into one collectible card. NOT FOR 拆书结构分析（用 ljg-book）、纯文字金句（用 ljg-card -b）、信息图（用 ljg-card -i）、视觉笔记（用 ljg-card -v）。","added_at":"2026-06-25","version":"3.3.0","extracted_path":"extracted-skills/ljg-skills/ljg-library","description_zh":"一本书 → 一幅清晰的「取景框」意向画面 → 一张 2050 图书馆借书卡（PNG）。取景框 = 作者从哪个角度看什么问题、看到了哪幅画面；卡上有真实封面、作者头像、书目信息。取景框区块用费曼式讲解把这幅意向画面讲得通俗又准确；图解区块用 AI 生图把这幅画面画出来，继刚是固定主角（从其墨像参考生成、认得出的他）。图解风格：吉田诚治式绘本感（异世界日常空间、暖光斜射、治愈又精致）。浅色光学玻璃卡身、强调色从封面动态提取、宽高自适应。合上书记住这幅画面，就没白读。当用户说出 '取景框卡'、'图书馆卡'、'library card'、'书卡'、'铸书卡'、'一本书一句话一张卡'、'/ljg-library'，或提供书名并希望将其提炼成一张收藏卡时使用。不适用于拆书结构分析（用 ljg-book）、纯文字金句（用 ljg-card -b）、信息图（用 ljg-card -i）、视觉笔记（用 ljg-card -v）。"},{"id":"ljg-map","name":"ljg-map","path":"libraries/ljg-skills/skills/ljg-map","original_path":"skills/ljg-map","tags":["docs","finance","coding","research"],"description":"一个行业 → 一张生态地形图卡（PNG）。以《千脑智能》参考系理论为地基：把行业摊成一张可俯瞰的「生态地形」——价值像河一样流过地貌，再在地形上标出两处——「瓶颈」（流量/产能在此收窄的隘口/水坝）和「价值捕获点」（利润在此沉淀的宝藏堆）。地形让权力结构一眼可见：卡流量的地方常常不是钱沉淀的地方。配三个关键指标的 base rate（刻度）+ 三个「大问题」（前沿）。deep research 真联网，图用 AI 生图（默认 -a 吉田诚治式绘本画风，与 ljg-library 同源；可选 -c pixel+cyber），继刚作小测量员立在地形上俯瞰。Use when user says '行业地图', '产业地图', '生态地形图', '画一下这个行业', 'industry map', 'map this industry', '行业版图', '产业链地图', '/ljg-map', or gives an industry/领域 name wanting its terrain mapped. 风格：默认 -a 绘本（同 ljg-library），加 -c 走 cyber。NOT FOR 一个领域降秩找生成器（用 ljg-rank）、拆一本书（用 ljg-book）、单个项目投资分析（用 ljg-invest）、一个概念深钻（用 ljg-think）。","added_at":"2026-06-25","version":"2.1.0","extracted_path":"extracted-skills/ljg-skills/ljg-map","description_zh":"一个行业 → 一张生态地形图卡（PNG）。以《千脑智能》参考系理论为地基：把行业摊成一张可俯瞰的「生态地形」——价值像河一样流过地貌，再在地形上标出两处——「瓶颈」（流量/产能在此收窄的隘口/水坝）和「价值捕获点」（利润在此沉淀的宝藏堆）。地形让权力结构一眼可见：卡流量的地方常常不是钱沉淀的地方。配三个关键指标的基准率（刻度）+ 三个「大问题」（前沿）。深度研究真实联网，图用 AI 生图（默认 -a 吉田诚治式绘本画风，与 ljg-library 同源；可选 -c 像素+赛博），继刚作小测量员立在地形上俯瞰。当用户说「行业地图」「产业地图」「生态地形图」「画一下这个行业」「industry map」「map this industry」「行业版图」「产业链地图」「/ljg-map」，或给出一个行业/领域名称并希望绘制其地形时使用。风格：默认 -a 绘本（同 ljg-library），加 -c 走赛博。不适用于对一个领域降秩找生成器（用 ljg-rank）、拆一本书（用 ljg-book）、单个项目投资分析（用 ljg-invest）、一个概念深钻（用 ljg-think）。"},{"id":"ljg-paper","name":"ljg-paper","path":"libraries/ljg-skills/skills/ljg-paper","original_path":"skills/ljg-paper","tags":["docs","coding","pdf","research"],"description":"Paper reader for non-academics. Turns one paper into one clear proposition: the problem, the paper's insight, and the judgment or action the reader can carry away. USE WHEN the user shares an arXiv link OR paper URL OR PDF OR local paper file OR paper title, or asks to read, explain, analyze, or understand a paper. Defaults to a saved org note. NOT FOR experiment reproduction, exhaustive method summaries, formal peer review, benchmark tables, or literature surveys.","added_at":"2026-05-17","extracted_path":"extracted-skills/ljg-skills/ljg-paper","description_zh":"面向非学术读者的论文阅读器。将一篇论文提炼成一个清晰命题：问题是什么、论文洞见是什么，以及读者可以带走的判断或行动。当用户分享 arXiv 链接、论文 URL、PDF、本地论文文件或论文标题，或者要求阅读、解释、分析或理解一篇论文时使用。默认保存为 org 笔记。不适用于复现实验、穷尽式方法总结、正式同行评审、基准测试表格或文献综述。"},{"id":"ljg-plain","name":"ljg-plain","path":"libraries/ljg-skills/skills/ljg-plain","original_path":"skills/ljg-plain","tags":["docs","coding"],"description":"Cognitive atom: Plain (白). Rewrites any content so a smart 12-year-old groks it. Structure-free — form follows content. Use when user says '白话说', '说人话', '解释一下', 'plain', 'grok'.","added_at":"2026-05-17","version":"5.0.0","extracted_path":"extracted-skills/ljg-skills/ljg-plain","description_zh":"认知原子：白。把任何内容改写到聪明的 12 岁孩子也能真正弄懂。不限定结构——形式跟着内容走。用户说「白话说」「说人话」「解释一下」「plain」「grok」时使用。"},{"id":"ljg-present","name":"ljg-present","path":"libraries/ljg-skills/skills/ljg-present","original_path":"skills/ljg-present","tags":["docs","coding"],"description":"演讲铸造器（Outline-Faithful）。把 orgmode/markdown outline 1:1 铸成单文件离线 HTML；支持 black/red/yellow、浅色 hacker 与暗色 hacker-dark，自动处理标题封面、多行密度布局、表格、ASCII、LaTeX、自适应与翻页笔。USE WHEN 用户要求讲这个、present、做成演讲、slides、标语流、宣言体、slogan、manifesto、按 outline 美化。NOT FOR 内容提炼、改写或企业 PPT。","added_at":"2026-05-17","version":"4.4.0","extracted_path":"extracted-skills/ljg-skills/ljg-present","description_zh":"演讲铸造器（忠实大纲）。把 orgmode/markdown outline 1:1 铸成单文件离线 HTML；支持 black/red/yellow、浅色 hacker 与暗色 hacker-dark，自动处理标题封面、多行密度布局、表格、ASCII、LaTeX、自适应与翻页笔。适用场景：用户要求讲这个、present、做成演讲、slides、标语流、宣言体、slogan、manifesto、按 outline 美化。不适用于内容提炼、改写或企业 PPT。"},{"id":"ljg-push","name":"ljg-push","path":"libraries/ljg-skills/skills/ljg-push","original_path":"skills/ljg-push","tags":["docs","coding"],"description":"把 ~/.agents/skills/ljg-* 里所有更新过的 skills 同步到 github repo (ljg-skills)，先推 master 分支（org-mode 输出风格），再切 md 分支（markdown 输出风格）做基础 markdown 化后推。Use when user says '/ljg-push', 'push skills', '推送 skills', '同步 skills', 'sync ljg', or whenever ljg-* skills get updated and need shipping. NOT FOR pushing non-ljg skills or arbitrary git repos.","added_at":"2026-05-17","extracted_path":"extracted-skills/ljg-skills/ljg-push","description_zh":"把 ~/.agents/skills/ljg-* 里所有更新过的 skills 同步到 github repo (ljg-skills)，先推 master 分支（org-mode 输出风格），再切 md 分支（markdown 输出风格）做基础 markdown 化后推。当用户说 '/ljg-push'、'push skills'、'推送 skills'、'同步 skills'、'sync ljg'，或每当 ljg-* skills 更新后需要发布时使用。不得用于推送非 ljg skills 或任意 git repo。"},{"id":"ljg-qa","name":"ljg-qa","path":"libraries/ljg-skills/skills/ljg-qa","original_path":"skills/ljg-qa","tags":["docs","coding","frontend","research"],"description":"信息提问机。给一篇文章/论文/书，把核心观点抽成 Q-A 对——Question 切要害，不教科书；Answer 简洁清晰，有形式化收口，逻辑链完整。读者顺 Q 链走过，每个 A 砸下一枚钉子，复现作者整套推理。Use when user says '问答', 'Q&A', 'QA', '提问', '抽取问题', '/ljg-qa', or shares an article/paper/book and asks for Q-A extraction. Triggers when the user wants ideas extracted not as a summary but as a sequence of incisive questions with answered. NOT FOR FAQ generation, glossary creation, or comprehension quizzes — this is intellectual scaffolding, not study aids.","added_at":"2026-05-17","extracted_path":"extracted-skills/ljg-skills/ljg-qa","description_zh":"信息提问机。给一篇文章/论文/书，把核心观点抽成 Q-A 对——Question 切要害，不教科书；Answer 简洁清晰，有形式化收口，逻辑链完整。读者顺 Q 链走过，每个 A 砸下一枚钉子，复现作者整套推理。当用户说“问答”“Q&A”“QA”“提问”“抽取问题”“/ljg-qa”，或分享一篇文章/论文/书并要求提取 Q-A 时使用。当用户希望将思想提取为一系列尖锐且有答案的问题，而非摘要时触发。不适用于生成 FAQ、创建术语表或阅读理解测验——这是思想脚手架，不是学习辅助工具。"},{"id":"ljg-rank","name":"ljg-rank","path":"libraries/ljg-skills/skills/ljg-rank","original_path":"skills/ljg-rank","tags":["docs","coding"],"description":"给一个领域，找出背后真正撑着它的几根独立的力。十几个现象砍到不可再少的生成器——砍完能把现象一个个生回来，才算数。Use when user says '降秩', '找秩', '秩是什么', '这个领域靠什么撑着', '背后是什么', or wants to decompose any domain to its irreducible generators.","added_at":"2026-05-17","extracted_path":"extracted-skills/ljg-skills/ljg-rank","description_zh":"给一个领域，找出背后真正撑着它的几根独立的力。十几个现象砍到不可再少的生成器——砍完能把现象一个个生回来，才算数。当用户说“降秩”“找秩”“秩是什么”“这个领域靠什么撑着”“背后是什么”，或者想把任何领域分解为不可约的生成器时使用。"},{"id":"ljg-read","name":"ljg-read","path":"libraries/ljg-skills/skills/ljg-read","original_path":"skills/ljg-read","tags":["docs","coding","frontend","automation","research"],"description":"Reading companion agent. Accompanies user through any text (books, articles, essays, papers, news) with translation, structural annotation, deep questioning, and cross-domain insights. Detects language, translates English to Chinese (faithfulness-expressiveness-elegance), guides reader to understand the author and encounter real questions. Use when user says '伴读', '陪我读', '读这篇', 'read with me', 'companion read', or shares a text/URL wanting guided reading.","added_at":"2026-05-17","version":"1.0.0","extracted_path":"extracted-skills/ljg-skills/ljg-read","description_zh":"伴读智能体。通过翻译、结构标注、深度提问和跨领域洞见，陪伴用户阅读任何文本（书籍、文章、随笔、论文、新闻）。检测语言，将英文翻译为中文（信、达、雅），引导读者理解作者并遭遇真实问题。当用户说「伴读」「陪我读」「读这篇」「read with me」「companion read」，或分享文本/URL 并希望获得引导式阅读时使用。"},{"id":"ljg-relationship","name":"ljg-relationship","path":"libraries/ljg-skills/skills/ljg-relationship","original_path":"skills/ljg-relationship","tags":["docs","coding"],"description":"Relationship analyst combining structural diagnostics (5-layer framework) with psychoanalytic depth (transference, unconscious patterns, resistance). Guides users through dialogue to \"see\" the real structure of their relationship issues. Use when user says \"关系分析\", \"分析关系\", \"relationship\", \"人际关系\", or describes a specific relationship problem they want to understand.","added_at":"2026-05-17","extracted_path":"extracted-skills/ljg-skills/ljg-relationship","description_zh":"关系分析师，将结构诊断（五层框架）与精神分析深度 （移情、无意识模式、阻抗）相结合。 通过对话引导用户“看见”其关系问题的真实结构。 当用户说“关系分析”“分析关系”“relationship”“人际关系”， 或描述一个他们想要理解的具体关系问题时使用。"},{"id":"ljg-roundtable","name":"ljg-roundtable","path":"libraries/ljg-skills/skills/ljg-roundtable","original_path":"skills/ljg-roundtable","tags":["docs","coding","data"],"description":"一个议题，一场圆桌：主持人请来 3-5 位真实人物，定义开场，逐轮交锋， 每轮收一张 ASCII 结构图，用户用指令控节奏（可/止/深入此节/引入新人物）， 散场后全文存入 org 笔记。Use when user says \"圆桌讨论\", \"圆桌\", \"roundtable\", \"辩论\", or wants to explore a topic through multi-perspective structured debate.","added_at":"2026-05-17","extracted_path":"extracted-skills/ljg-skills/ljg-roundtable","description_zh":"一个议题，一场圆桌：主持人请来 3-5 位真实人物，定义开场，逐轮交锋， 每轮收一张 ASCII 结构图，用户用指令控节奏（可/止/深入此节/引入新人物）， 散场后全文存入 org 笔记。当用户说“圆桌讨论”、“圆桌”、 “roundtable”、“辩论”，或希望通过多视角的结构化辩论探索某个议题时使用。"},{"id":"ljg-structure","name":"ljg-structure","path":"libraries/ljg-skills/skills/ljg-structure","original_path":"skills/ljg-structure","tags":["docs","coding"],"description":"找出一段信息中母题级别的结构，用 scription_zh":"MinerU 文档提取——将 PDF、扫描文档、图片、Word（DOC/DOCX）、PowerPoint（PPT/PPTX）、Excel（XLS/XLSX）和网页转换为整洁的 Markdown、HTML、LaTeX 或 DOCX。MinerU 是一款一体化 CLI 工具和智能体技能，可实现可靠、高保真的文档解析。 是否正为无法阅读的 PDF、混乱的表格格式或转换后乱码的公式而苦恼？MinerU 通过两种提取模式解决这些问题：MinerU flash-extract 可即时进行零配置转换，支持表格识别、公式识别和 OCR（无需令牌、无需登录、无需配置——运行即可获得结果）；MinerU precision extract 则提供基于 VLM 的版面分析、多种输出格式，以及数百个文件的批量处理能力。 当你需要以下功能时，请使用 MinerU：“如何从这个 PDF 中提取文本”“我想把 PDF 转换为 Markdown”“能否解析这篇包含表格和公式的学术论文”“我需要对扫描文档进行 OCR”“批量转换我的所有 PDF”“把这个 Word 文档转换为 Markdown”“将网页抓取为 Markdown”“从这个文档中提取表格”。MinerU 支持 80 多种语言，包括中文、英语、日语、韩语、阿拉伯语等。 对于复杂版面，可选择 MinerU vlm 模型以获得最高准确率；对于零幻觉的可靠性，可选择 MinerU pipeline 模型。非常适合解析论文的研究人员、构建文档处理流水线的开发者，以及大规模处理文档的数据工程师。 MinerU文档提取工具，PDF转Markdown、扫描件OCR、表格识别、公式识别、批量PDF处理、Word转Markdown、Excel转Markdown、网页爬取、图片OCR、学术论文解析。MinerU支持PDF、Word、PPT、Excel（XLS/XLSX）、图片等多格式文档智能转换，命令行一键提取，免登录快速模式或高精度专业模式。"}],"install":{"method":"extracted","extracted_root":"extracted-skills/mineru"},"extracted":{"root":"extracted-skills/mineru","source_library":"mineru","source_path":"libraries/mineru","last_extracted_commit":"5733c03b3d53cb01c0361bb6acecda3f554c8c12","skill_count":1},"category":"daily-tools","category_locked":true,"description_zh":"MinerU 文档提取——将 PDF、扫描文档、图片、Word（DOC/DOCX）、PowerPoint（PPT/PPTX）、Excel（XLS/XLSX）和网页转换为整洁的 Markdown、HTML、LaTeX 或 DOCX。MinerU 是一款一体化 CLI 工具和智能体技能，可实现可靠、高保真的文档解析。 是否正为无法阅读的 PDF、混乱的表格格式或转换后乱码的公式而苦恼？MinerU 通过两种提取模式解决这些问题：MinerU flash-extract 可即时进行零配置转换，支持表格识别、公式识别和 OCR（无需令牌、无需登录、无需配置——运行即可获得结果）；MinerU precision extract 则提供基于 VLM 的版面分析、多种输出格式，以及数百个文件的批量处理能力。 当你需要以下功能时，请使用 MinerU：“如何从这个 PDF 中提取文本”“我想把 PDF 转换为 Markdown”“能否解析这篇包含表格和公式的学术论文”“我需要对扫描文档进行 OCR”“批量转换我的所有 PDF”“把这个 Word 文档转换为 Markdown”“将网页抓取为 Markdown”“从这个文档中提取表格”。MinerU 支持 80 多种语言，包括中文、英语、日语、韩语、阿拉伯语等。 对于复杂版面，可选择 MinerU vlm 模型以获得最高准确率；对于零幻觉的可靠性，可选择 MinerU pipeline 模型。非常适合解析论文的研究人员、构建文档处理流水线的开发者，以及大规模处理文档的数据工程师。 MinerU文档提取工具，PDF转Markdown、扫描件OCR、表格识别、公式识别、批量PDF处理、Word转Markdown、Excel转Markdown、网页爬取、图片OCR、学术论文解析。MinerU支持PDF、Word、PPT、Excel（XLS/XLSX）、图片等多格式文 ", \"lazy mode\", \"simplest solution\", \"minimal solution\", \"yagni\", \"do less\", or \"shortest path\", or complains about over-engineering, bloat, boilerplate, or unnecessary dependencies. Do NOT use for non-coding requests (general knowledge, prose, translation, summaries, recipes).","added_at":"2026-07-15","extracted_path":"extracted-skills/ponytail/ponytail","description_zh":"强制采用真正可行的最懒惰、最简单、最短、最精简的解决方案。化身为一名见多识广的 高级开发者：先质疑任务是否根本有存在的必要（YAGNI），优先使用标准库而非 自定义代码，优先使用平台原生功能而非依赖，优先写一行而非 五十行。支持强度级别：lite、full（默认）、ultra。用于任何 编码任务：编写、添加、重构、修复、审查或设计 代码，以及选择库或依赖。每当用户说 \"ponytail\"、\"be lazy\"、\"lazy mode\"、\"simplest solution\"、\"minimal solution\"、\"yagni\"、\"do less\" 或 \"shortest path\"，或抱怨 过度工程、臃肿、样板代码或不必要的依赖时，也应使用。不要 用于非编码请求（常识、散文、翻译、 摘要、食谱）。"},{"id":"ponytail-audit","name":"ponytail-audit","path":"libraries/ponytail/ponytail-audit","original_path":"libraries/ponytail/ponytail-audit","tags":["docs","coding","frontend"],"description":"Whole-repo audit for over-engineering. Like ponytail-review, but scans the entire codebase instead of a diff: a ranked list of what to delete, simplify, or replace with stdlib/native equivalents. Use when the user says \"audit this codebase\", \"audit for over-engineering\", \"what can I delete from this repo\", \"find bloat\", \"ponytail-audit\", or \"/ponytail-audit\". One-shot report, does not apply fixes.","added_at":"2026-07-15","extracted_path":"extracted-skills/ponytail/ponytail-audit","description_zh":"全仓库过度工程审计。类似 ponytail-review，但扫描整个代码库而不是 差异：按优先级排列可删除、简化或替换为标准库/原生等效实现的内容。 当用户说“审计这个代码库”“审计过度工程”“这个仓库里有什么可以删除” “查找臃肿内容”“ponytail-audit”或“/ponytail-audit”时使用。生成一次性报告， 不应用修复。"},{"id":"ponytail-debt","name":"ponytail-debt","path":"libraries/ponytail/ponytail-debt","original_path":"libraries/ponytail/ponytail-debt","tags":["docs","coding"],"description":"Harvest every `ponytail:` comment in the codebase into a debt ledger, so the deliberate shortcuts and deferrals ponytail leaves behind get tracked instead of rotting into \"later means never\". Use when the user says \"ponytail debt\", \"/ponytail-debt\", \"what did ponytail defer\", \"list the shortcuts\", \"ponytail ledger\", or \"what did we mark to do later\". One-shot report, changes nothing.","added_at":"2026-07-15","extracted_path":"extracted-skills/ponytail/ponytail-debt","description_zh":"将代码库中的每一条 `ponytail:` 注释汇总到技术债台账中，从而跟踪 ponytail 有意留下的捷径和延期事项，而不是让它们腐化成“以后就等于永远不做”。 当用户说“ponytail 技术债”、“/ponytail-debt”、“ponytail 延期了什么”、 “列出捷径”、“ponytail 台账”或“我们标记了哪些以后再做的事项”时使用。 一次性报告，不做任何更改。"},{"id":"ponytail-gain","name":"ponytail-gain","path":"libraries/ponytail/ponytail-gain","original_path":"libraries/ponytail/ponytail-gain","tags":["docs","coding"],"description":"Show ponytail's measured impact as a compact scoreboard: less code, less cost, more speed, from the benchmark medians. One-shot display, not a persistent mode, and not a per-repo number. Trigger: /ponytail-gain, \"ponytail gain\", \"what does ponytail save\", \"show ponytail impact\", \"ponytail scoreboard\".","added_at":"2026-07-15","extracted_path":"extracted-skills/ponytail/ponytail-gain","description_zh":"以紧凑记分板展示 ponytail 经测量的影响：更少代码、更低成本、 更快速度，数据取自基准测试中位数。一次性展示，并非 持久模式，也不是针对单个仓库的数值。触发方式：/ponytail-gain、 \"ponytail 收益\"、\"ponytail 节省了什么\"、\"展示 ponytail 的影响\"、 \"ponytail 记分板\"。"},{"id":"ponytail-help","name":"ponytail-help","path":"libraries/ponytail/ponytail-help","original_path":"libraries/ponytail/ponytail-help","tags":["docs","coding","cli","frontend"],"description":"Quick-reference card for all ponytail modes, skills, and commands. One-shot display, not a persistent mode. Trigger: /ponytail-help, \"ponytail help\", \"what ponytail commands\", \"how do I use ponytail\".","added_at":"2026-07-15","extracted_path":"extracted-skills/ponytail/ponytail-help","description_zh":"所有 ponytail 模式、技能和命令的快速参考卡。 单次显示，并非持久模式。触发方式：/ponytail-help、 \"ponytail help\"、\"what ponytail commands\"、\"how do I use ponytail\"。"},{"id":"ponytail-review","name":"ponytail-review","path":"libraries/ponytail/ponytail-review","original_path":"libraries/ponytail/ponytail-review","tags":["docs","coding"],"description":"Code review focused exclusively on over-engineering. Finds what to delete: reinvented standard library, unneeded dependencies, speculative abstractions, dead flexibility. One line per finding: location, what to cut, what replaces it. Use when the user says \"review for over-engineering\", \"what can we delete\", \"is this over-engineered\", \"simplify review\", or invokes /ponytail-review. Complements correctness-focused review, this one only hunts complexity.","added_at":"2026-07-15","extracted_path":"extracted-skills/ponytail/ponytail-review","description_zh":"专门针对过度工程化的代码审查。找出可以删除的内容： 重复实现的标准库功能、不必要的依赖、臆想式抽象、 无用的灵活性。每个发现一行：位置、要删减的内容、替代方案。 当用户说“审查过度工程化”“我们能删除什么” “这是否过度工程化了”“简化审查”，或调用 /ponytail-review 时使用。它是以正确性为重点的审查的补充，且只 查找复杂性。"}],"install":{"method":"extracted","extracted_root":"extracted-skills/ponytail"},"extracted":{"root":"extracted-skills/ponytail","source_library":"ponytail","source_path":"libraries/ponytail","last_extracted_commit":"16f29800fd2681bdf24f3eb4ccffe38be3baec6b","skill_count":6},"category":"coding-tools","description_zh":"ponytail 收录了 6 个 Agent Skills。"},{"id":"punk-skill","name":"punk-skill","path":"libraries/punk-skill","source":{"type":"github","repo":"adrianpunk/Punk-Skill","ref":"main","commit":"288376c9d47e1567e8b1fffe50ac7c1143f477df","original_path":"skills"},"tags":["image","workflow"],"description":"Punk Avatar","added_at":"2026-06-25","last_checked_at":"2026-07-18","last_synced_at":"2026-07-18","skill_count":2,"skills":[{"id":"punk-avatar","name":"punk-avatar","path":"libraries/punk-skill/punk-avatar","original_path":"libraries/punk-skill/punk-avatar","tags":["image","docs","coding"],"description":"Generate avatar images and reusable avatar image prompts from the shared Punk style library for people, pets, objects, profile pictures, pet portraits, and avatar-derived keepsake cards. Use this skill to identify the subject fr aradigms","original_path":"libraries/swyxio-skills/app-ux-paradigms","tags":["browser","docs","coding","cli","frontend"],"description":"Applies standard web app UX for keyboard shortcuts, modals, overlays, forms, and interaction patterns. Use when building UI, dialogs, menus, hotkeys, help text, accessibility, or when the user asks about Esc, shortcuts, modal close, backdrop click, or common desktop-app expectations.","added_at":"2026-06-25","extracted_path":"extracted-skills/swyxio-skills/app-ux-paradigms","description_zh":"应用标准的 Web 应用用户体验规范，涵盖键盘快捷键、模态框、浮层、表单 和交互模式。适用于构建 UI、对话框、菜单、快捷键、帮助文本、 无障碍功能，或用户询问 Esc、快捷键、关闭模态框、点击背景遮罩 以及常见桌面应用操作习惯时。"},{"id":"autoreview","name":"autoreview","path":"libraries/swyxio-skills/autoreview","original_path":"libraries/swyxio-skills/autoreview","tags":["docs","coding"],"description":"Run structured closeout code review after non-trivial code edits, branch or PR work, or commits using an autoreview helper. Use when the user asks for autoreview, Codex review, Claude review, second-model review, or a final review before commit, ship, merge, or release.","added_at":"2026-06-25","extracted_path":"extracted-skills/swyxio-skills/autoreview","description_zh":"在进行非平凡的代码编辑、分支或 PR 工作或提交后，使用 autoreview 辅助工具执行结构化收尾代码审查。当用户要求 autoreview、Codex 审查、Claude 审查、第二模型审查，或要求在提交、交付、合并或发布前进行最终审查时使用。"},{"id":"claude-session-introspect","name":"claude-session-introspect","path":"libraries/swyxio-skills/claude-session-introspect","original_path":"libraries/swyxio-skills/claude-session-introspect","tags":["docs","coding","data"],"description":"Inspect Claude Code session JSONL files at ~/.claude/projects/ to extract real conversation telemetry: token counts (input/output/cache reads/cache writes), assistant turn counts, human prompt counts, tool-use counts, compaction boundaries, and the contents of compaction summaries. Use this skill when the user asks \"how many tokens did this session use\", \"how many prompts have I sent\", \"show me the stats for this conversation\", \"what got compacted\", \"where are the compaction boundaries\", \"introspect the session\", \"do brain surgery on the JSONL\", or wants any data point that lives inside the on-disk session log rather than the live context window. Inspired by Tal Raviv's \"I wanted to know how compaction works\" article.","added_at":"2026-06-25","extracted_path":"extracted-skills/swyxio-skills/claude-session-introspect","description_zh":"检查位于 ~/.claude/projects/ 的 Claude Code 会话 JSONL 文件，以提取真实的对话遥测数据：令牌计数（输入/输出/缓存读取/缓存写入）、助手轮次、人工提示数、工具使用次数、压缩边界以及压缩摘要的内容。当用户询问“这个会话使用了多少令牌”“我发送了多少条提示”“显示这次对话的统计信息”“哪些内容被压缩了”“压缩边界在哪里”“自省会话”“对 JSONL 做脑部手术”，或需要任何存在于磁盘会话日志而非实时上下文窗口中的数据点时，请使用此技能。灵感来自 Tal Raviv 的文章《I wanted to know how compaction works》。"},{"id":"codebase-maintainability-guardrails","name":"codebase-maintainability-guardrails","path":"libraries/swyxio-skills/codebase-maintainability-guardrails","original_path":"libraries/swyxio-skills/codebase-maintainability-guardrails","tags":["docs","coding","frontend"],"description":"Use for most substantial coding work, especially frontend/fullstack apps, greenfield apps built from scratch, production refactors, UI migrations, and feature work where Codex should preserve maintainable code style: small typed feature-owned files, thin entrypoints, pure domain logic, centralized contracts, behavior-preserving refactors, protected persisted state, feature-owned CSS/Tailwind, focused tests, and real viewport visual QA.","added_at":"2026-06-25","extracted_path":"extracted-skills/swyxio-skills/codebase-maintainability-guardrails","description_zh":"适用于大多数重要的编码工作，尤其是前端/全栈应用、从零构建的全新应用、生产环境重构、UI 迁移，以及需要 Codex 保持代码可维护性的功能开发：由功能归属的小型类型化文件、轻量入口点、纯领域逻辑、集中式契约、保持行为不变的重构、受保护的持久化状态、由功能归属的 CSS/Tailwind、聚焦测试，以及真实视口下的可视化质量检查。"},{"id":"conference-developer-endpoints","name":"conference-developer-endpoints","path":"libraries/swyxio-skills/conference-developer-endpoints","original_path":"libraries/swyxio-skills/conference-developer-endpoints","tags":["docs","coding","data","mcp"],"description":"Use when adding or reviewing developer and AI-facing conference data endpoints such as llms.txt, sessions.json, speakers.json, and MCP routes across AI Engineer conference pages.","added_at":"2026-06-25","extracted_path":"extracted-skills/swyxio-skills/conference-developer-endpoints","description_zh":"用于在 AI Engineer 大会页面中添加或审查面向开发者和 AI 的大会数据端点，例如 llms.txt、sessions.json、speakers.json 和 MCP 路由。"},{"id":"conference-transcribe","name":"conference-transcribe","path":"libraries/swyxio-skills/conference-transcribe","original_path":"libraries/swyxio-skills/conference-transcribe","tags":["docs","coding"],"description":"Transcribe a multi-talk conference livestream or long YouTube video into separate per-talk transcripts. Parses timestamps from the video description to split talks, downloads audio/video, transcribes each segment, then uses an LLM to clean up and format the transcripts with key takeaways and frequent timestamps. Use when user says \"transcribe this conference\", \"split this livestream into talks\", \"transcribe each talk separately\", or provides a YouTube URL of a multi-hour event stream with chapter timestamps.","added_at":"2026-06-25","extracted_path":"extracted-skills/swyxio-skills/conference-transcribe","description_zh":"将包含多场演讲的会议直播或较长的 YouTube 视频转录为按演讲拆分的独立文本。解析视频描述中的时间戳以拆分演讲，下载音频/视频，转录每个片段，然后使用 LLM 清理并格式化转录文本，添加关键要点和密集时间戳。当用户说“转录这场会议”“将此直播拆分为多场演讲”“分别转录每场演讲”，或提供带章节时间戳的数小时活动直播 YouTube URL 时使用。"},{"id":"data-chatbots","name":"data-chatbots","path":"libraries/swyxio-skills/data-chatbots","original_path":"libraries/swyxio-skills/data-chatbots","tags":["docs","coding","data","workflow","cli"],"description":"Design and implement AI copilots that analyze structured data and propose mutations for human approval (draft → apply), not direct writes. Covers prompting, multistep compound requests (remove + add in one turn), FIFO client queuing for long agent loops, validation, session memory, optimistic versioning UX, copilot panel/surface ergonomics (floating-dockable panel, summon-hotkey size state machine), LLM tracing/observability (OpenInference + OTLP session.id grouping, orphan-span fixes, human thumbs up/down feedback annotations), and test matrices. Use when building scheduling/admin chatbots, proposal workflows, human-in-the-loop agents, or reviewing aiebot-style features.","added_at":"2026-06-25","extracted_path":"extracted-skills/swyxio-skills/data-chatbots","description_zh":"设计并实现可分析结构化数据、提出变更并交由人工批准（草稿 → 应用）的 AI 副驾驶，而不是直接写入。涵盖提示、多步骤复合请求（单轮中删除 + 添加）、 面向长时间智能体循环的 FIFO 客户端队列、验证、会话记忆、乐观版本控制 UX、 副驾驶面板/界面的人体工学设计（浮动可停靠面板、唤出快捷键尺寸状态机）、 LLM 追踪/可观测性（OpenInference + OTLP session.id 分组、孤立 span 修复、 人工点赞/点踩反馈注释）以及测试矩阵。适用于构建排程/管理聊天机器人、 提案工作流、人在回路中的智能体，或审查 aiebot 风格的功能。"},{"id":"download-video","name":"download-video","path":"libraries/swyxio-skills/download-video","original_path":"libraries/swyxio-skills/download-video","tags":["docs","coding","frontend"],"description":"Downloads embedded videos from web pages. Fetches the page, identifies the video hosting service (Vimeo, YouTube, etc.), resolves the correct embed/player URL, and downloads using yt-dlp. Handles private/unlisted videos that require referer headers or embed URLs. Use this skill when someone says \"download this video\", \"save this video\", \"grab the video from this page\", \"rip this video\", or provides a URL and asks to download media from it. Also trigger when someone pastes a URL to a page with an embedded video and wants the video file locally.","added_at":"2026-06-25","extracted_path":"extracted-skills/swyxio-skills/download-video","description_zh":"从网页下载嵌入式视频。获取页面，识别视频托管服务（Vimeo、YouTube 等），解析正确的嵌入/播放器 URL，然后使用 yt-dlp 下载。支持需要 referer 请求头或嵌入 URL 的私有/不公开列出视频。当有人说“下载这个视频”“保存这个视频”“从这个页面获取视频”“抓取这个视频”，或者提供一个 URL 并要求从中下载媒体时，请使用此技能。当有人粘贴包含嵌入式视频的页面 URL，并希望将视频文件保存到本地时，也应触发此技能。"},{"id":"download-x-video","name":"download-x-video","path":"libraries/swyxio-skills/download-x-video","original_path":"libraries/swyxio-skills/download-x-video","tags":["docs","coding"],"description":"Download video from X/Twitter posts using yt-dlp. Use when the user wants to \"download this X video\", \"save this tweet video\", \"grab video from Twitter\", or provides an x.com/twitter.com status URL with a video. Handles HLS streams and uses --print after_move:filepath for reliable path detection.","added_at":"2026-06-25","extracted_path":"extracted-skills/swyxio-skills/download-x-video","description_zh":"使用 yt-dlp 下载 X/Twitter 帖子中的视频。当用户想要“下载这个 X 视频”“保存这个推文视频”“从 Twitter 获取视频”，或提供包含视频的 x.com/twitter.com 状态 URL 时使用。支持 HLS 流，并使用 --print after_move:filepath 可靠地检测路径。"},{"id":"europe-developer-api","name":"europe-developer-api","path":"libraries/swyxio-skills/europe-developer-api","original_path":"libraries/swyxio-skills/europe-developer-api","tags":["docs","coding","data","mcp","cli"],"description":"Use when working with AI Engineer Europe 2026 developer-facing endpoints, public schedule JSON, speakers JSON, llms.txt files, MCP access, and the local aieng CLI.","added_at":"2026-06-25","extracted_path":"extracted-skills/swyxio-skills/europe-developer-api","description_zh":"在使用 AI Engineer Europe 2026 面向开发者的端点、公开日程 JSON、演讲者 JSON、llms.txt 文件、MCP 访问以及本地 aieng CLI 时使用。"},{"id":"media-transform","name":"media-transform","path":"libraries/swyxio-skills/media-transform","original_path":"libraries/swyxio-skills/media-transform","tags":["image","docs","coding","research"],"description":"Generic media transformation orchestrator — download videos from any source (X/Twitter, Zoom, YouTube, web embeds), upload to YouTube, transcribe with timestamps, generate chapters, create thumbnails with GPT-Image-2, and A/B test titles. Use when the user wants to move a video from one platform to another, or asks to \"download and upload this video to YouTube\", \"publish this recording\", \"save and transcribe this\", or any video pipeline task. Encodes learned best practices and preferences for each stage.","added_at":"2026-06-25","extracted_path":"extracted-skills/swyxio-skills/media-transform","description_zh":"通用媒体转换编排器——从任何来源（X/Twitter、Zoom、YouTube、网页嵌入）下载视频，上传到 YouTube，生成带时间戳的转录、章节，使用 GPT-Image-2 创建缩略图，并对标题进行 A/B 测试。当用户希望将视频从一个平台迁移到另一个平台，或提出“下载此视频并上传到 YouTube”“发布此录像”“保存并转录此内容”或任何视频流水线任务时使用。包含每个阶段中总结出的最佳实践和偏好。"},{"id":"multimodal-extraction","name":"multimodal-extraction","path":"libraries/swyxio-skills/multimodal-extraction","original_path":"libraries/swyxio-skills/multimodal-extraction","tags":["image","docs","coding"],"description":"Given a local video or video URL, downloads the media if needed, extracts slide frames and key moments, transcribes the audio, and writes a Markdown timeline that interleaves screenshots with the transcript at the associated timestamps. Use when asked to turn a video into a multimodal notes file, slide-synced transcript, screenshot-enhanced transcript, or talk recap with images.","added_at":"2026-06-25","version":"0.1.0","extracted_path":"extracted-skills/swyxio-skills/multimodal-extraction","description_zh":"给定本地视频或视频 URL，在需要时下载媒体，提取幻灯片帧和关键时刻，转录音频，并编写一个 Markdown 时间线，将截图与对应时间戳处的转录文本交错排列。适用于将视频转换为多模态笔记文件、与幻灯片同步的转录稿、带截图的转录稿，或包含图片的演讲回顾。"},{"id":"new-mac-setup","name":"new-mac-setup","path":"libraries/swyxio-skills/new-mac-setup","original_path":"libraries/swyxio-skills/new-mac-setup","tags":["docs","coding","cli","frontend"],"description":"Fully automated new Mac setup for fullstack web developers and AI engineers. Generates and executes idempotent shell scripts to install dev tools, CLI utilities, GUI apps, AI/ML tooling, shell config, and macOS preferences — all via Homebrew, fnm, uv, and defaults commands. Use this skill whenever someone says \"set up my Mac\", \"new Mac setup\", \"configure my dev machine\", \"install my dev tools\", \"fresh Mac install\", \"developer environment setup\", or anything about bootstrapping a macOS machine for development. Also trigger when someone mentions setting up Homebrew, Oh-My-ZSH, Node.js, Python, Docker, or terminal configuration on a new Mac — even if they don't call it a \"setup\". This skill is opinionated and based on real-world experience setting up M-series Macs for fullstack JS/TS + Python + AI development.","added_at":"2026-06-25","extracted_path":"extracted-skills/swyxio-skills/new-mac-setup","description_zh":"面向全栈 Web 开发者和 AI 工程师的全自动新 Mac 配置。生成并执行幂等 Shell 脚本，通过 Homebrew、fnm、uv 和 defaults 命令安装开发工具、CLI 实用程序、GUI 应用、AI/ML 工具、Shell 配置和 macOS 偏好设置。只要有人说“配置我的 Mac”“新 Mac 配置”“配置我的开发机器”“安装我的开发工具”“全新安装 Mac”“开发环境配置”，或提到任何为开发用途初始化 macOS 机器的内容，就使用此技能。当有人提到在新 Mac 上配置 Homebrew、Oh-My-ZSH、Node.js、Python、Docker 或终端配置时，也应触发此技能——即使他们没有将其称为“配置”。此技能具有明确的偏好取向，基于为全栈 JS/TS + Python + AI 开发配置 M 系列 Mac 的真实经验。"},{"id":"observability-hardening","name":"observability-hardening","path":"libraries/swyxio-skills/observability-hardening","original_path":"libraries/swyxio-skills/observability-hardening","tags":["docs","coding"],"description":"Make a production application observable and debuggable with privacy-safe telemetry. Use when the user asks for structured logging, error classes, request IDs, traces, metrics, dashboards, alerts, product analytics, LLM/media operation visibility, user-visible operation status, or production debugging improvements.","added_at":"2026-06-25","extracted_path":"extracted-skills/swyxio-skills/observability-hardening","description_zh":"通过隐私安全的遥测，使生产应用具备可观测性和可调试性。当用户要求改进结构化日志、错误类、请求 ID、追踪、指标、仪表板、告警、产品分析、LLM/媒体操作可见性、用户可见的操作状态或生产环境调试时使用。"},{"id":"podcast-publishing-assistant","name":"podcast-publishing-assistant","path":"libraries/swyxio-skills/podcast-publishing-assistant","original_path":"libraries/swyxio-skills/podcast-publishing-assistant","tags":["docs","coding","workflow"],"description":"Transcribe long-form audio, YouTube videos, podcasts, interviews, or panels; summarize them; extract chapter markers; and draft publishing assets like titles, YouTube descriptions, show notes, and tweet/X copy. Use when a user shares a YouTube link or audio/video file and asks for transcription, diarization, summaries with timestamps, chapter markers, show notes, titles, descriptions, promo copy, or social posts. Especially use for Whisper-based workflows, source-audio-first podcast processing, and any request to turn a recorded conversation into publishable assets.","added_at":"2026-06-25","extracted_path":"extracted-skills/swyxio-skills/podcast-publishing-assistant","description_zh":"转录长篇音频、YouTube 视频、播客、访谈或专题讨论；总结内容；提取章节标记；并起草标题、YouTube 简介、节目笔记和推文/X 文案等发布素材。当用户分享 YouTube 链接或音频/视频文件，并要求转录、说话人区分、带时间戳的摘要、章节标记、节目笔记、标题、简介、推广文案或社交媒体帖子时使用。尤其适用于基于 Whisper 的工作流、音源优先的播客处理，以及任何将录制对话转化为可发布素材的请求。"},{"id":"productionize-app-with-services","name":"productionize-app-with-services","path":"libraries/swyxio-skills/productionize-app-with-services","original_path":"libraries/swyxio-skills/productionize-app-with-services","tags":["docs","coding","data","frontend","automation"],"description":"Transform a working demo/prototype codebase into a production-shaped product that is observable, auditable, secure, API-drivable, product-manageable, and easy for AI agents/bots to maintain. Use when the user asks to harden or productize a repo, add audit trails, role permissions, API keys, REST/OpenAPI/agent docs, feature flags, PostHog observability, security/rate limits, admin management UI, migration/readiness audits, concurrent subagent execution, or a final migration audit microsite.","added_at":"2026-06-25","extracted_path":"extracted-skills/swyxio-skills/productionize-app-with-services","description_zh":"将可运行的演示/原型代码库转变为具备生产级形态的产品，使其可观测、可审计、安全、可通过 API 驱动、便于产品管理，并易于 AI 智能体/机器人维护。当用户要求强化代码仓库或将其产品化，添加审计跟踪、角色权限、API 密钥、REST/OpenAPI/智能体文档、功能标志、PostHog 可观测性、安全措施/速率限制、管理后台 UI、迁移/就绪情况审计、并发子智能体执行或最终迁移审计微型站点时使用。"},{"id":"public-qa-chatbot","name":"public-qa-chatbot","path":"libraries/swyxio-skills/public-qa-chatbot","original_path":"libraries/swyxio-skills/public-qa-chatbot","tags":["docs","coding","frontend"],"description":"Best practices for building an unauthenticated public Q&A chatbot widget w mechanical interfaces fusing Swiss typographic print with military terminal aesthetics. Rigid grids, extreme type scale contrast, utilitarian color, analog degradation effects. For data-heavy dashboards, portfolios, or editorial sites that need to feel like declassified blueprints.","added_at":"2026-07-15","extracted_path":"extracted-skills/taste-skill/industrial-brutalist-ui","description_zh":"融合瑞士字体印刷与军用终端美学的原始机械界面。刚性网格、极端的字体尺度对比、实用主义色彩、模拟退化效果。适用于需要呈现解密蓝图质感的数据密集型仪表盘、作品集或编辑类网站。"},{"id":"gpt-taste","name":"gpt-taste","path":"libraries/taste-skill/gpt-tasteskill","original_path":"libraries/taste-skill/gpt-tasteskill","tags":["image","docs","coding","frontend","animation"],"description":"Elite UX/UI & Advanced GSAP Motion Engineer. Enforces Python-driven true randomization for layout variance, strict AIDA page structure, wide editorial typography (bans 6-line wraps), gapless bento grids, strict GSAP ScrollTriggers (pinning, stacking, scrubbing), inline micro-images, and massive section spacing.","added_at":"2026-07-15","extracted_path":"extracted-skills/taste-skill/gpt-taste","description_zh":"顶尖 UX/UI 与高级 GSAP 动效工程师。强制使用 Python 驱动的真正随机化来实现布局变化，采用严格的 AIDA 页面结构、宽幅编辑式排版（禁止标题换行至 6 行）、无空隙便当网格、严格的 GSAP ScrollTrigger（固定、堆叠、擦洗），并使用行内微型图片和超大区块间距。"},{"id":"image-to-code","name":"image-to-code","path":"libraries/taste-skill/image-to-code-skill","original_path":"libraries/taste-skill/image-to-code-skill","tags":["image","docs","coding","frontend"],"description":"Elite website image-to-code skill for Codex. For visually important web tasks, it must first generate the design image(s) itself, deeply analyze them, then implement the website to match them as closely as possible. In Codex, it must prefer large, readable, section-specific images instead of tiny compressed boards, generate fresh standalone images for sections or detail views instead of cropping old ones, avoid lazy under-generation, avoid cards-inside-cards-inside-cards UI, and keep the hero clean, spacious, readable, and visible on a small laptop.","added_at":"2026-07-15","extracted_path":"extracted-skills/taste-skill/image-to-code","description_zh":"面向 Codex 的顶级网站图像转代码技能。对于视觉效果至关重要的 Web 任务，必须先自行生成设计图像，对其进行深入分析，然后实现与图像尽可能一致的网站。在 Codex 中，必须优先使用大型、清晰、针对具体区块的图像，而不是微小的压缩拼板；应为区块或细节视图生成全新的独立图像，而不是裁剪旧图像；避免偷懒少生成图像；避免卡片套卡片再套卡片的 UI；并确保首屏主视觉简洁、宽敞、易读，且在小型笔记本电脑上清晰可见。"},{"id":"imagegen-frontend-mobile","name":"imagegen-frontend-mobile","path":"libraries/taste-skill/imagegen-frontend-mobile","original_path":"libraries/taste-skill/imagegen-frontend-mobile","tags":["image","docs","coding","workflow","frontend"],"description":"Elite mobile app image-generation skill for creating premium, app-native screen concepts and flows. Designed for iOS, Android, and cross-platform mobile products. Prioritizes clean hierarchy, comfortably readable text, strong multi-screen consistency, controlled color palettes, non-generic creative direction, textured surfaces, image-led composition, tasteful custom iconography, and clean phone mockup framing. By default, screens should be shown inside a subtle premium iPhone or similar phone mockup with a visible frame, while the main focus stays on the app content itself. This skill generates images only. It does not write code.","added_at":"2026-07-15","extracted_path":"extracted-skills/taste-skill/imagegen-frontend-mobile","description_zh":"用于创建高端、原生应用风格屏幕概念与流程的顶级移动应用图像生成技能。专为 iOS、Android 和跨平台移动产品设计。优先确保清晰的层级、舒适易读的文字、强大的多屏一致性、受控的配色方案、非通用的创意方向、富有质感的表面、图像主导的构图、雅致的自定义图标系统，以及简洁的手机样机框架。默认情况下，屏幕应展示在带有可见边框的低调高端 iPhone 或类似手机样机中，同时让应用内容本身始终成为视觉重点。本技能仅生成图像，不编写代码。"},{"id":"imagegen-frontend-web","name":"imagegen-frontend-web","path":"libraries/taste-skill/imagegen-frontend-web","original_path":"libraries/taste-skill/imagegen-frontend-web","tags":["image","docs","finance","coding","frontend"],"description":"Elite frontend image-direction skill for generating premium, conversion-aware website design references. CRITICAL OUTPUT RULE — generate ONE separate horizontal image FOR EVERY           flash(el("deployHint"), `完成：新增 ${ok.length}，覆盖 ${over.length}` + (err.length?`，失败 ${err.length}`:""));
        }catch(e){
          flash(el("deployHint"),"部署失败："+e.message);
        }
      });
      // browse modal
      async function browseLoad(path){
        const input=el("browsePathInput"), list=el("browseList");
        if(input) input.value=path||"";
        if(list) list.innerHTML='<div style="padding:12px;color:var(--muted)">加载中…</div>';
        try{
          const qs=path?`?path=${encodeURIComponent(path)}`:"";
          const res=await adminFetch("/api/browse"+qs);
          const cur=res.path||path||"";
          if(input) input.value=cur;
          if(!list) return;
          if(res.error) { list.innerHTML=`<div style="padding:12px;color:#b42318">${escapeHtml(res.error)}</div>`; return; }
          const dirs=res.dirs||[];
          if(!dirs.length) { list.innerHTML='<div style="padding:12px;color:var(--muted)">无子目录</div>'; return; }
          list.innerHTML=dirs.map(d=>`<button class="admin-chip" data-browse-path="${escapeHtml(d.path)}" style="text-align:left;justify-content:flex-start;overflow:hidden;text-overflow:ellipsis">📁 ${escapeHtml(d.name)}</button>`).join("");
          list.querySelectorAll("[data-browse-path]").forEach(b=>b.addEventListener("click", ()=>browseLoad(b.dataset.browsePath)));
        }catch(e){
          if(list) list.innerHTML=`<div style="padding:12px;color:#b42318">${escapeHtml(e.message)}</div>`;
        }
      }
      el("browseBtn")?.addEventListener("click", ()=>{ el("browseModal")?.classList.add("open"); const cur=el("deployRoot")?.value.trim()||""; browseLoad(cur); });
      el("browseCancelBtn")?.addEventListener("click", ()=>el("browseModal")?.classList.remove("open"));
      el("browseModal")?.addEventListener("click", e=>{ if(e.target===el("browseModal")) el("browseModal").classList.remove("open"); });
      el("browseUpBtn")?.addEventListener("click", async ()=>{
        const cur=el("browsePathInput")?.value.trim();
        if(!cur) return browseLoad("");
        try{ const res=await adminFetch("/api/browse?path="+encodeURIComponent(cur)); if(res.parent) browseLoad(res.parent); else browseLoad(""); }catch(_){}
      });
      el("browseSelectBtn")?.addEventListener("click", ()=>{
        const cur=el("browsePathInput")?.value.trim();
        if(!cur) return;
        el("deployRoot").value=cur;
        deployState.targetRoot=cur; localStorage.setItem("skill-hub-deploy-root", cur);
        el("browseModal")?.classList.remove("open");
        flash(el("deployHint"),`已选目录：${cur}`);
      });
      el("browsePathInput")?.addEventListener("keydown", e=>{ if(e.key==="Enter") browseLoad(e.target.value.trim()); });
      // init mode UI
      document.querySelectorAll("#modeSwitch .segment").forEach(b=>{ b.classList.toggle("active", b.dataset.mode===adminState.mode); b.setAttribute("aria-selected", b.dataset.mode===adminState.mode); });
    }
    // hide admin UI when not admin
    if(!isAdmin){
      el("adminBar")?.classList.remove("open");
      el("bottomDockOrganize")?.classList.remove("open");
      el("bottomDockDeploy")?.classList.remove("open");
    }
    applyLanguage();
  </script>
</body>
</html>
